<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1f5fbf">
<title>Полевой план</title>
<!-- библиотеки лежат рядом (lib/), чтобы приложение открывалось без интернета: Leaflet 1.9.4 (BSD-2), proj4 2.11.0 (MIT) -->
<link rel="stylesheet" href="lib/leaflet.min.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,400;0,500;1,400;1,500&display=swap">
<script src="lib/leaflet.min.js"></script>
<script src="lib/proj4.js"></script>
<style>
  /* ── темы: день / солнце / ночь ── */
  body.day   { --bg:#f4f1e8; --panel:#ffffff; --ink:#151515; --muted:#5d5d5d; --line:#d9d6cc; --accent:#1f5fbf; --accentInk:#fff; --red:#c62828; --sym:#111111; --symBg:#ffffff; --halo:#ffffff; --shadow:0 1px 6px rgba(0,0,0,.18); --fs:14px; }
  body.sun   { --bg:#ffffff; --panel:#ffffff; --ink:#000000; --muted:#222222; --line:#000000; --accent:#0039a6; --accentInk:#fff; --red:#b00000; --sym:#000000; --symBg:#ffffff; --halo:#ffffff; --shadow:0 0 0 2px #000; --fs:15.5px; }
  body.night { --bg:#1c2127; --panel:#262c33; --ink:#e9edf1; --muted:#9aa5b1; --line:#38414b; --accent:#5aa2ff; --accentInk:#0d1117; --red:#ff6b6b; --sym:#e9edf1; --symBg:#1c2127; --halo:#1c2127; --shadow:0 1px 8px rgba(0,0,0,.5); --fs:14px; }
  /* традиционные цвета сетей («Правила начертания…», п. 6 — по дополнительным требованиям) */
  /* чертёжный шрифт подписей на плане: узкий наклонный, как по ГОСТ 2.304 */
  body { --draft:"Roboto Condensed","Arial Narrow",Arial,sans-serif; }
  body { --c-water:#1565c0; --c-sewer:#6d4c41; --c-heat:#8e24aa; --c-gas:#ef8f00; --c-el:#d32f2f; --c-comm:#2e7d32; --c-own:#7b1fa2; }
  body.night { --c-water:#64b5f6; --c-sewer:#bcaaa4; --c-heat:#ce93d8; --c-gas:#ffb74d; --c-el:#ff6b6b; --c-comm:#81c784; --c-own:#ce93d8; }
  /* рельеф по ГКИНП — коричневым (горизонтали, откосы, обрывы); ночью светлее, на солнце темнее */
  body { --rel:#8a4b1c; } body.sun { --rel:#5e2e0c; } body.night { --rel:#d6a06e; }
  body { --veg:#2e7d32; } body.sun { --veg:#1b5e20; } body.night { --veg:#81c784; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; background:var(--bg); font:var(--fs)/1.35 system-ui, "Segoe UI", Roboto, sans-serif; color:var(--ink); }
  #map { position:absolute; inset:0; background:var(--bg); }
  body.night .leaflet-tile-pane { filter: brightness(.55) contrast(1.15) saturate(.55); }
  body.sun .leaflet-tile-pane { filter: contrast(1.2) saturate(1.1); }
  button { font:inherit; color:inherit; }

  /* ── верхняя плашка координат ── */
  #top { position:absolute; left:8px; right:8px; top:8px; z-index:1000; background:var(--panel); color:var(--ink); border-radius:14px; padding:8px 10px; box-shadow:var(--shadow); font-variant-numeric:tabular-nums; }
  #top .r1 { display:flex; justify-content:space-between; align-items:center; gap:6px; }
  .seg { display:flex; background:var(--line); border-radius:9px; padding:2px; }
  body.sun .seg { background:#fff; border:2px solid #000; }
  .seg button { border:0; background:none; padding:5px 10px; border-radius:7px; color:var(--muted); font-size:12.5px; }
  .seg button.on { background:var(--panel); color:var(--ink); font-weight:700; }
  body.sun .seg button.on { background:#000; color:#fff; }
  #zone { font-size:12px; color:var(--muted); }
  .xy { font-size:1.08em; font-weight:700; margin-top:4px; letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .xy small { font-weight:400; color:var(--muted); font-size:.75em; }
  #gpsLine { display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); margin-top:3px; }
  #updLine { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:6px; padding:6px 8px; border-radius:10px;
    background:color-mix(in srgb, var(--accent) 14%, transparent); font-size:13px; }
  #updLine .btn { min-height:34px; padding:6px 14px; }
  #satLine { display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink); margin-top:3px; cursor:pointer; white-space:nowrap; overflow:hidden; }
  #satLine #satText { overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
  #satLine .more { color:var(--muted); margin-left:auto; }
  .sat-tab { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; margin-top:4px; }
  .sat-tab th, .sat-tab td { padding:9px 6px; border-bottom:1px solid var(--line); text-align:right; }
  .sat-tab th:first-child, .sat-tab td:first-child { text-align:left; }
  .sat-tab th { color:var(--muted); font-weight:500; font-size:12.5px; }
  .sat-tab tr.sum td { font-weight:700; }
  .dop { display:flex; align-items:center; gap:7px; margin:2px 0 8px; font-variant-numeric:tabular-nums; }
  .meas-big { font-size:2em; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.1; }
  .meas-live { min-height:84px; }
  .meas-sub { color:var(--muted); font-size:.85em; margin-top:4px; }
  .meas-h { font-size:1.15em; font-weight:700; margin-top:6px; } .meas-h span { font-weight:400; color:var(--muted); font-size:.85em; }
  .meas-sum { width:100%; text-align:left; border:1px solid var(--line); background:none; color:var(--ink); border-radius:12px; padding:10px 12px; margin-top:8px; min-height:44px; font-size:.95em; }
  .meas-sum .pen { float:right; color:var(--accent); }
  .meas-verdict { border-radius:12px; padding:10px 12px; margin:6px 0; font-weight:600; }
  .meas-verdict.ok { background:color-mix(in srgb, #2e7d32 15%, transparent); }
  .meas-verdict.mid { background:color-mix(in srgb, #f9a825 20%, transparent); }
  .meas-verdict.bad { background:color-mix(in srgb, #c62828 15%, transparent); }
  .meas-row { display:flex; gap:8px; align-items:center; margin:8px 0; flex-wrap:wrap; }
  .meas-row > span { color:var(--muted); font-size:13px; min-width:92px; }
  .meas-row .seg { flex-wrap:wrap; }
  .dot { width:9px; height:9px; border-radius:50%; background:#9e9e9e; flex:none; }
  .dot.ok { background:#2e7d32; } .dot.mid { background:#f9a825; } .dot.bad { background:#c62828; }

  /* ── перекрестье ── */
  #cross { position:absolute; left:50%; top:50%; width:34px; height:34px; margin:-17px 0 0 -17px; z-index:900; pointer-events:none; }

  /* ── круглые кнопки справа ── */
  #fabs { position:absolute; right:10px; z-index:1000; display:flex; flex-direction:column; gap:10px; }
  .fab { width:50px; height:50px; border-radius:50%; border:0; background:var(--panel); color:var(--ink); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow); }
  .fab svg { width:26px; height:26px; }
  .fab.on { background:var(--accent); color:var(--accentInk); }

  /* ── масштаб ── */
  #scale { position:absolute; left:10px; z-index:1000; background:var(--panel); color:var(--ink); border-radius:10px; padding:7px 11px 7px; font-size:13px; font-weight:700; box-shadow:var(--shadow); cursor:pointer; }
  #scale i { display:block; height:5px; border:2px solid var(--ink); border-top:0; margin-top:3px; }

  /* ── нижняя панель ── */
  #bar { position:absolute; left:0; right:0; bottom:0; z-index:1000; background:var(--panel); display:flex; justify-content:space-around; padding:8px 4px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); }
  body.sun #bar { border-top:2px solid #000; }
  #bar button { border:0; background:none; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--muted); font-size:12.5px; width:72px; padding:0; }
  #bar .ic { width:56px; height:36px; border-radius:18px; display:flex; align-items:center; justify-content:center; }
  #bar svg { width:26px; height:26px; }
  #bar button.on { color:var(--ink); font-weight:700; }
  #bar button.on .ic { background:color-mix(in srgb, var(--accent) 22%, transparent); color:var(--accent); }

  /* ── панель режима (ставим знак / рисуем линию) ── */
  #mode { position:absolute; left:8px; right:8px; z-index:1000; background:var(--panel); color:var(--ink); border-radius:16px; box-shadow:var(--shadow); padding:10px 12px; display:none; }
  #mode .title { display:flex; align-items:center; gap:8px; font-weight:700; margin-bottom:8px; }
  #mode .title svg { flex:none; }
  #mode .btns { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
  #mode .quick { display:flex; gap:6px; overflow-x:auto; margin:-2px 0 8px; }
  #mode .quick button { flex:none; display:flex; align-items:center; gap:4px; min-height:44px; padding:4px 10px; border:1px solid var(--line); border-radius:22px; background:var(--panel); color:var(--ink); font-size:12px; max-width:150px; }
  #mode .quick button span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #mode .quick button.on { border:2px solid var(--accent); font-weight:700; }
  #stake { position:absolute; left:8px; right:8px; z-index:1000; background:var(--panel); color:var(--ink); border-radius:16px; box-shadow:var(--shadow); padding:10px 12px; display:none; }
  #stake .big { font-size:1.9em; font-weight:700; font-variant-numeric:tabular-nums; }
  #stake .row { display:flex; gap:10px; align-items:center; }
  #stake .ok { color:#2e7d32; }
  .btn { border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:12px; padding:11px 6px; font-weight:600; font-size:.95em; min-height:46px; }
  body.sun .btn { border:2px solid #000; }
  .btn.primary { background:var(--accent); color:var(--accentInk); border-color:var(--accent); }
  .btn.danger { color:var(--red); }
  .btn.on { border-color:var(--accent); color:var(--accent); }
  .rubber-lbl span { position:absolute; transform:translate(-50%, -150%); white-space:nowrap; font:700 14px/1 var(--draft); color:var(--ink); background:var(--panel); border:1px solid var(--ink); padding:3px 6px; border-radius:10px; }

  /* ── нижние листы ── */
  #sheet { position:absolute; inset:0; z-index:2000; background:rgba(0,0,0,.38); display:none; }
  #sheet .panel { position:absolute; left:0; right:0; bottom:0; max-height:82%; overflow:auto; background:var(--panel); color:var(--ink); border-radius:18px 18px 0 0; padding:10px 12px calc(20px + env(safe-area-inset-bottom)); }
  .grab { width:40px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 10px; }
  .sh-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .sh-head b { font-size:1.1em; }
  .x { border:0; background:var(--line); color:var(--ink); width:44px; height:44px; border-radius:50%; font-size:20px; line-height:1; flex:none; }
  body.sun .x { background:#fff; color:#000; border:2px solid #000; }
  .search { display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:12px; padding:0 10px; color:var(--muted); }
  body.sun .search { border:2px solid #000; }
  .search input { flex:1; border:0; outline:0; background:none; color:var(--ink); font:inherit; padding:11px 0; }
  .tabs { display:flex; gap:6px; margin:10px 0 6px; overflow-x:auto; padding-bottom:2px; }
  .tabs button { flex:none; border:1px solid var(--line); background:none; color:var(--muted); font-size:13px; padding:7px 12px; border-radius:16px; }
  .tabs button.on { background:var(--accent); color:var(--accentInk); border-color:var(--accent); font-weight:700; }
  .h { font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:12px 2px 6px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill, minmax(78px, 1fr)); gap:7px; }
  .tile { border:1px solid var(--line); background:none; color:var(--ink); border-radius:13px; padding:9px 3px 7px; display:flex; flex-direction:column; align-items:center; gap:5px; text-align:center; font-size:11px; line-height:1.15; min-height:84px; min-width:0; }
  .tile span { max-width:100%; hyphens:manual; -webkit-hyphens:manual; }   /* длинные слова переносятся по мягким переносам из tileName() */
  #modeTitle span, #card .name, #card .sub { overflow-wrap:anywhere; hyphens:auto; -webkit-hyphens:auto; }
  body.sun .tile { border:2px solid #000; }
  .tile:active { background:color-mix(in srgb, var(--accent) 15%, transparent); }
  .tile svg { flex:none; }
  .empty { color:var(--muted); font-size:13px; padding:8px 2px; }
  .list .item { display:flex; align-items:center; gap:12px; padding:13px 6px; border-bottom:1px solid var(--line); }
  .list .item:active { background:color-mix(in srgb, var(--accent) 12%, transparent); }
  .list .item .i { width:26px; text-align:center; font-size:18px; flex:none; }
  .list .item.on { font-weight:700; color:var(--accent); }
  .list .item .chk { margin-left:auto; font-size:18px; color:var(--accent); }

  /* ── формы ── */
  .form label { display:block; font-size:12.5px; color:var(--muted); margin:10px 2px 4px; }
  .form input, .form select { width:100%; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:11px; padding:11px 12px; font:inherit; }
  body.sun .form input, body.sun .form select { border:2px solid #000; }
  .form .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .form .hint { font-size:12px; color:var(--muted); margin:6px 2px 0; }
  .form .acts { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:16px; }

  /* ── карточка объекта ── */
  #card { position:absolute; left:8px; right:8px; z-index:1100; background:var(--panel); color:var(--ink); border-radius:16px; padding:12px; box-shadow:var(--shadow); display:none; }
  #card .t { display:flex; align-items:center; gap:10px; }
  #mode .title .cnt { font-variant-numeric:tabular-nums; }
  details.more { margin-top:10px; } details.more summary { color:var(--accent); padding:10px 0; min-height:44px; cursor:pointer; }
  #card .photos { display:flex; gap:6px; overflow-x:auto; margin:4px 0 8px; }
  #card .photos button { flex:none; width:64px; height:64px; border-radius:10px; border:1px solid var(--line); padding:0; overflow:hidden; background:var(--line); color:var(--muted); font-size:11px; }
  #card .photos img { width:100%; height:100%; object-fit:cover; display:block; }
  .ai-btn { width:100%; margin:0 0 8px; }
  .ai-cand { display:flex; gap:12px; align-items:center; width:100%; text-align:left; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:12px; padding:10px 12px; margin-bottom:6px; min-height:56px; }
  .ai-cand:first-of-type { border:2px solid var(--accent); }
  .ai-cand svg { flex:none; } .ai-cand small { color:var(--muted); }
  .photo-big { width:100%; max-height:60vh; object-fit:contain; border-radius:10px; background:#000; display:block; }
  #card .x.trash { background:none; color:var(--red); border:1px solid var(--line); }
  #card .t > div { flex:1; min-width:0; }
  #card .name { font-weight:700; font-size:1.08em; }
  #card .sub { color:var(--muted); font-size:12.5px; }
  #card .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 10px; margin:10px 0; font-size:13.5px; font-variant-numeric:tabular-nums; }
  #card .kv span:nth-child(odd) { color:var(--muted); }
  #card .acts { display:grid; grid-template-columns:1fr 1fr 1fr 52px; gap:6px; }
  #card .btn.trash { color:var(--red); padding:0; margin-left:6px; }
  #card .swatches { display:flex; align-items:center; gap:8px; margin:2px 0 10px; overflow-x:auto; padding:3px 2px; }
  .meas-row .seg button { min-height:44px; font-size:15px; padding:8px 12px; }
  .tabs button { min-height:40px; }
  #card .swatches > span { color:var(--muted); font-size:.9em; margin-right:4px; }
  #card .swatches button { flex:none; width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--panel); padding:0; font-size:9px; color:var(--muted); }
  #card .swatches button[data-color=""] { width:auto; border-radius:19px; padding:0 10px; font-size:11px; }
  body.night #card .swatches button[data-color="#000000"] { box-shadow:0 0 0 2px #888; }
  #card .swatches button.on { outline:3px solid var(--accent); outline-offset:1px; }

  /* ── знаки и подписи на карте ── */
  .sym { background:none; border:0; color:var(--sym); display:flex; align-items:center; justify-content:center; }   /* знак — в центре зоны касания */
  svg [fill="#fff"] { fill:var(--symBg); }                              /* белая заливка знаков — ночью тёмная, чтобы светлые черты были видны */
  .sym .lbl { position:absolute; left:24px; top:-2px; white-space:nowrap; font:italic 12.5px/1 var(--draft); color:var(--sym); letter-spacing:.01em;
    text-shadow:0 0 2px var(--halo), 0 0 2px var(--halo), 0 0 3px var(--halo); }
  .sym .lbl.off { display:none; }
  .sym .lbl.frac { display:flex; flex-direction:column; align-items:center; line-height:1.05; }
  .sym .lbl.frac .t { border-bottom:1px solid currentColor; padding:0 1px; font-style:italic; }
  .sym .lbl.frac .b { font-style:italic; }                                        /* места нет — подпись появится при приближении */
  .sym.sel svg { filter: drop-shadow(0 0 3px var(--accent)) drop-shadow(0 0 3px var(--accent)); }
  .gtxt { pointer-events:none; fill:#1b5e20; font-weight:400; font-style:italic; font-family:var(--draft); font-variant-numeric: tabular-nums;
    paint-order: stroke; stroke:var(--halo); stroke-width:3.5px; stroke-linejoin:round; }
  body.night .gtxt { fill:#a5d6a7; }
  .gridlbl { background:none; border:0; pointer-events:none; }
  .gridlbl .glw { position:absolute; left:0; top:0; transform-origin:0 0; }
  .gridlbl .gx, .gridlbl .gy { position:absolute; white-space:nowrap; line-height:1; color:#1b5e20; font-weight:600;
    font-family: system-ui, "Segoe UI", Roboto, sans-serif; font-variant-numeric: tabular-nums;
    text-shadow: 0 0 2px var(--halo), 0 0 2px var(--halo), 0 0 3px var(--halo), 0 0 4px var(--halo); }
  body.night .gridlbl .gx, body.night .gridlbl .gy { color:#a5d6a7; }
  .gridlbl .gx { top:-3px; transform:translateY(-100%); }               /* над горизонтальной чертой, справа */
  .gridlbl .gyw { position:absolute; left:0; top:0; transform:rotate(-90deg); transform-origin:0 0; }
  .gridlbl .gy { top:-3px; transform:translateY(-100%); }               /* после поворота — над вертикальной чертой (слева от неё) */
  .netlines { overflow:visible; pointer-events:none; }
  .netlines text { font-family:var(--draft); paint-order: stroke; stroke:var(--halo); stroke-width:2.6px; stroke-linejoin:round; }

  /* ── Leaflet: свой список слоёв и масштаб, кнопки +/− под плашкой ── */
  .leaflet-control-layers, .leaflet-control-scale { display:none !important; }
  .leaflet-top.leaflet-left { top:var(--topH, 92px); }
  .leaflet-top.leaflet-left .leaflet-control { margin-top:0; }          /* отступ уже учтён в --topH */
  .leaflet-control-zoom a { width:40px !important; height:40px !important; line-height:40px !important; font-size:20px !important; background:var(--panel) !important; color:var(--ink) !important; border-color:var(--line) !important; }
  .leaflet-bottom { bottom:var(--barH, 70px); }
  .leaflet-control-attribution { background:color-mix(in srgb, var(--panel) 80%, transparent) !important; color:var(--muted) !important; }
  .leaflet-control-attribution a { color:var(--accent) !important; }

  #toast { position:absolute; left:50%; transform:translateX(-50%); z-index:3000; background:#222; color:#fff; padding:9px 15px; border-radius:18px; font-size:14px; display:none; width:max-content; max-width:calc(100% - 32px); text-align:center; line-height:1.3; }
</style>
</head>
<body class="day">
<div id="map"></div>

<div id="top">
  <div class="r1">
    <div class="seg" id="coordSeg"><button data-c="wgs">WGS-84</button><button data-c="sk" id="segPlane">ГСК-2011</button><button data-c="both">оба</button></div>
    <span id="zone"></span>
  </div>
  <div id="coords"></div>
  <div id="gpsLine"><span class="dot" id="gpsDot"></span><span id="gpsText">GPS выключен — нажмите ◎</span></div>
  <div id="updLine" style="display:none"><span>⬆ Доступна новая версия <b id="updVer"></b></span><button class="btn primary" id="updBtn">Обновить</button></div>

/* ───────────── Координаты: WGS-84 → плоская система (ГСК-2011, СК-42 или своя МСК) ───────────── */

// ГСК-2011 — государственная система с 2017 г. (пост. № 1463), СК-42 для новых работ — только до 01.01.2021 (пост. № 1240).
// Переход ГСК-2011 → WGS-84: через ПЗ-90.11, параметры по ГОСТ 32453-2017 (расхождение систем — сантиметры–дециметры).
const TOWGS84_SK42 = '+towgs84=23.57,-140.95,-79.8,0,0.35,0.79,-0.22';

const CRS = {
  gsk: { name: 'ГСК-2011', zoned: true,
    def: zone => `+proj=tmerc +lat_0=0 +lon_0=${zone * 6 - 3} +k=1 +x_0=${zone * 1e6 + 500000} +y_0=0 +a=6378136.5 +rf=298.2564151 ${TOWGS84_GSK} +units=m +no_defs` },
  sk42: { name: 'СК-42', zoned: true,
    def: zone => `+proj=tmerc +lat_0=0 +lon_0=${zone * 6 - 3} +k=1 +x_0=${zone * 1e6 + 500000} +y_0=0 +ellps=krass ${TOWGS84_SK42} +units=m +no_defs` }
};
let crsId = pref('crs', 'gsk'), msk = pref('msk', null);   // msk: { name, lon0, lat0, k, x0, y0, towgs84 } — вводит сам пользователь
function crs() {
  if (crsId === 'msk' && msk) return { name: msk.name || 'МСК', zoned: false,
    def: () => `+proj=tmerc +lat_0=${msk.lat0 || 0} +lon_0=${msk.lon0} +k=${msk.k || 1} +x_0=${msk.x0 || 0} +y_0=${msk.y0 || 0} +ellps=krass +towgs84=${msk.towgs84 || TOWGS84_SK42.slice(9)} +units=m +no_defs` };
  return CRS[crsId] || CRS.gsk;
}
const planeName = () => crs().name;
const zoneOf = lng => crs().zoned ? Math.floor(lng / 6) + 1 : 0;

// Имена sk42/fromSk42 оставлены для краткости: считают в выбранной плоской системе
function sk42(lat, lng) {
  const zone = zoneOf(lng);
  const [y, x] = proj4('WGS84', gkDef(zone), [lng, lat]);
  return { zone, x, y };       // x — на север, y — на восток (с номером зоны впереди), как принято в геодезии
}
function fromSk42(x, y, zone) {   // обратный пересчёт плоской системы → WGS-84 (L.LatLng)
  const [lng, lat] = proj4(gkDef(zone), 'WGS84', [y, x]);

}
const f2 = v => v.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const f6 = v => v.toFixed(6);
function coordText(ll) {
  const s = sk42(ll.lat, ll.lng);
  return { wgs: `${f6(ll.lat)}°  ${f6(ll.lng)}°`, sk: `X ${f2(s.x)}  Y ${f2(s.y)}`, s };

/* ───────────── Данные и хранение ───────────── */

const STORE_KEY = 'tk.plan.v1';

}
function showUndo() { const b = document.getElementById('fabUndo'); if (b) b.style.display = undoStack.length ? 'flex' : 'none'; }
function undo() {
  if (!undoStack.length) return;

  data = JSON.parse(lastSaved);
  try { localStorage.setItem(STORE_KEY, lastSaved); } catch (e) { /* сохранится при следующем изменении */ }

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ── Карта без интернета: куски подложки хранятся в телефоне (IndexedDB) ── */
const tileDb = new Promise(resolve => {
  try {
    const req = indexedDB.open('tk-tiles', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('t');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
  } catch (e) { resolve(null); }
});

  const db = await tileDb;

  return new Promise(resolve => {
    try {
      const tx = db.transaction('t', mode), req = fn(tx.objectStore('t'));
      tx.oncomplete = () => resolve(req && req.result);
      tx.onerror = () => resolve(null);

}
// Подложка, которая сначала берёт кусок из телефона, а скачанный из сети — запоминает (если поставщик разрешает)
const CachedTiles = L.TileLayer.extend({
  createTile(coords, done) {
    const img = document.createElement('img'), url = this.getTileUrl(coords), opt = this.options;
    const key = opt.cacheId + '/' + coords.z + '/' + coords.x + '/' + coords.y;
    img.alt = ''; img.setAttribute('role', 'presentation');
    const show = (src, revoke) => { img.onload = () => { if (revoke) URL.revokeObjectURL(src); done(null, img); }; img.onerror = e => done(e, img); img.src = src; };

      if (blob) { show(URL.createObjectURL(blob), true); return; }
      fetch(url, { mode: 'cors' })
        .then(r => { if (!r.ok) throw new Error(r.status); return r.blob(); })
        .then(b => { tileStore('readwrite', s => s.put(b, key)); show(URL.createObjectURL(b), true); })

let coordMode = pref('coords', 'sk');

// Масштаб «1:N»: размер экранного пикселя — ~0,16 мм на телефоне и ~0,26 мм на компьютере; точнее — калибровкой по линейке
const PX_MM_DEFAULT = matchMedia('(pointer: coarse)').matches ? 0.159 : 0.2646;
let PX_MM = pref('pxmm', PX_MM_DEFAULT);
const NICE_M = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000];
const SCALES = [200, 500, 1000, 2000, 5000, 10000, 25000];
function metersPerPx() {
  const y = map.getSize().y / 2, a = map.containerPointToLatLng([0, y]), b = map.containerPointToLatLng([100, y]);
  return a.distanceTo(b) / 100;
}
function setScale(denom) {
  const cur = metersPerPx(), target = denom * PX_MM / 1000;
  if (!cur || !target) return;
  map.setZoom(map.getZoom() + Math.log2(cur / target));
}
function updateScale() {
  const mPerPx = metersPerPx();
  if (!mPerPx) return;
  const denom = mPerPx * 1000 / PX_MM, p = Math.pow(10, Math.floor(Math.log10(denom)) - 1);
  const preset = SCALES.find(s => Math.abs(denom / s - 1) < 0.01);      // стоим на стандартном масштабе — пишем его ровно
  const round = preset || Math.round(denom / p) * p;
  const meters = NICE_M.find(m => m / mPerPx >= 50) || NICE_M[NICE_M.length - 1];
  $('scaleText').textContent = `1:${round.toLocaleString('ru-RU')} · ${meters >= 1000 ? meters / 1000 + ' км' : meters + ' м'} ▾`;
  $('scaleBar').style.width = Math.round(meters / mPerPx) + 'px';
}
$('scale').onclick = () => openList('Масштаб', [
  { header: 'Встать в масштаб' },
  ...SCALES.map(s => ({ id: String(s), icon: '⤢', text: '1:' + s.toLocaleString('ru-RU') + (s === 500 ? ' — исполнительная съёмка' : '') })),
  { header: 'Точность' },
  { id: 'cal', icon: '📏', text: PX_MM === PX_MM_DEFAULT ? 'Откалибровать экран по линейке' : 'Калибровка экрана: сделана — повторить или сбросить' }
], pick => pick === 'cal' ? calibrate() : setScale(Number(pick)));

// Калибровка: на экране полоса известной длины в пикселях, геодезист меряет её линейкой
const CAL_PX = 240;
function calibrate() {
  showSheet(`<div class="sh-head"><b>Калибровка экрана</b><button class="x" data-close>×</button></div><div class="form">
    <div class="hint" style="font-size:13.5px">Приложите линейку к полосе ниже и измерьте её длину в миллиметрах — от левого края до правого.</div>
    <div style="margin:16px 0 6px;height:22px;width:${CAL_PX}px;border:2px solid var(--ink);border-top:0;position:relative">
      <div style="position:absolute;left:0;right:0;top:9px;height:3px;background:var(--accent)"></div></div>
    <label for="f_mm">Длина полосы, мм</label><input id="f_mm" inputmode="decimal" placeholder="например 38,5" autocomplete="off">
    <div class="hint">Сейчас: 1 точка экрана = ${PX_MM.toFixed(4).replace('.', ',')} мм${PX_MM === PX_MM_DEFAULT ? ' (примерно, без калибровки)' : ' (по калибровке)'}.</div>
    <div class="acts"><button class="btn" id="calReset">Сбросить</button><button class="btn primary" id="calSave">Сохранить</button></div></div>`);
  $('calSave').onclick = () => {
    const mm = parseNum($('f_mm').value);
    const px = mm / CAL_PX;
    if (!(px > 0.05 && px < 0.6)) { toast('Проверьте длину: обычно это от 20 до 100 мм'); return; }
    PX_MM = px; setPref('pxmm', px); closeSheet(); updateScale(); toast('Готово: масштаб и размер знаков — по линейке');
    setTimeout(() => location.reload(), 900);                          // размер знаков (мм экрана) пересчитывается при запуске
  };
  $('calReset').onclick = () => { PX_MM = PX_MM_DEFAULT; setPref('pxmm', PX_MM_DEFAULT); closeSheet(); updateScale(); toast('Калибровка сброшена'); setTimeout(() => location.reload(), 900); };
}

/* ───────────── GPS ───────────── */

let gps = null, gpsMarker = null, gpsCircle = null, gpsWatch = null;
const GPS_WARN_M = 0.25;          // хуже — «По GPS» переспрашивает (допуск 1:500 — 0,5 мм на плане)
const GPS_FRESH_MS = 5000;        // «По GPS» берёт координаты не старше 5 с

function startGps() {

  if (!navigator.geolocation) { toast('В этом браузере нет GPS'); return; }

  $('gpsText').textContent = 'Ищу спутники…'; $('gpsDot').className = 'dot mid';

/* ───────────── Отметки: высота над эллипсоидом (ГНСС) → нормальная высота ───────────── */

// Пересчёт отметок, снятых по ГНСС (по сохранённой высоте над эллипсоидом): onlyMissing — только тем, у кого отметки ещё нет

    if (p.hSrc === 'gnss' && e != null) out.push({ ll: [p.lat, p.lng], hEll: e, has: p.h != null && p.h !== '', set: (H, ref) => { p.h = H; p.hInfo = { ...(p.hInfo || {}), ref, hEll: e }; } }); }

  });
}
function ctrlText(p) {
  const c = p.ctrl && p.ctrl[p.ctrl.length - 1];

  return `${cmText(c.dS)} в плане${c.dH != null ? `, ${c.dH >= 0 ? '+' : '−'}${cmText(Math.abs(c.dH))} по высоте` : ''} · ${CTRL_MARK[c.ok]}` +
    `<br><span style="color:var(--muted)">${new Date(c.at).toLocaleString('ru-RU')}${p.ctrl.length > 1 ? ` · всего контролей ${p.ctrl.length}` : ''}</span>`;
}

function openMeasure(onAccept) {
  const o = pref('meas', { sec: 30, kind: 'clear', scale: 500 });
  const seg = (key, items, label) => `<div class="seg" data-key="${key}">${items.map(([v, t]) =>
    `<button data-v="${v}" class="${String(o[key]) === String(v) ? 'on' : ''}">${t}</button>`).join('')}</div>`;
  // результат — первым и крупно; настройки (меняются редко) — одной строкой «30 с · Чёткий контур · 1:500 ✎», по нажатию раскрываются
  showSheet(`<div class="sh-head"><b>Измерение точки</b><button class="x" data-close>×</button></div><div id="measBox">
    <div id="measLive" class="meas-live"></div>
    <button class="meas-sum" id="measSum"></button>
    <div id="measOpts" style="display:none">
      <div class="meas-row"><span>Время</span>${seg('sec', MEAS_SECONDS.map(s => [s, s < 60 ? s + ' с' : s / 60 + ' мин']))}</div>
      <div class="meas-row"><span>Что снимаем</span>${seg('kind', MEAS_KINDS.map(k => [k.id, k.name]))}</div>
      <div class="meas-row"><span>Масштаб плана</span>${seg('scale', MEAS_SCALES.map(s => [s, '1:' + s]))}</div>
    </div>
    <div class="acts" style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px">
      <button class="btn" data-close>Отмена</button><button class="btn primary" id="measGo">Начать</button></div></div>`);
  const tolNote = () => {
    const k = MEAS_KINDS.find(x => x.id === o.kind);
    $('measSum').innerHTML = `${o.sec < 60 ? o.sec + ' с' : o.sec / 60 + ' мин'} · ${esc(k.name)} · 1:${o.scale} <span class="pen">✎ изменить</span>`;
    if (!measuring) $('measLive').innerHTML = `<div class="meas-big">допуск ${cmText(measTol(o))}</div>
      <div class="meas-sub">${String(k.mm).replace('.', ',')} мм на плане, ${k.hint} СП 47.13330. Стойте неподвижно, веха — по уровню, затем «Начать».</div>`;
  };
  $('measSum').onclick = () => { const b = $('measOpts'); b.style.display = b.style.display === 'none' ? 'block' : 'none'; };
  tolNote();
  $('measBox').querySelectorAll('.seg').forEach(box => box.onclick = e => {
    const b = e.target.closest('button[data-v]');
    if (!b || measuring) return;
    const key = box.dataset.key;
    o[key] = key === 'kind' ? b.dataset.v : Number(b.dataset.v);
    box.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    setPref('meas', o); tolNote();
  });
  $('measGo').onclick = () => runMeasure(o, onAccept);
}

function runMeasure(o, onAccept) {
  startGps();
  loadGeoid().catch(() => toast('Модель геоида не загрузилась — отметки не посчитаются'));
  const fixes = [], t0 = Date.now(), tol = measTol(o);
  let lastTs = 0, timer = null, hdops = [];
  const stop = () => { clearInterval(timer); measuring = null; };
  const live = () => {
    if (!$('measBox') || $('sheet').style.display === 'none') { stop(); return; }     // лист закрыли — измерение отменено
    const sec = Math.min(o.sec, Math.round((Date.now() - t0) / 1000));
    if (!fixes.length) { $('measLive').innerHTML = `<div class="meas-big">жду координаты…</div><div class="meas-sub">${sec} с</div>`; }
    else {
      const use = goodFixes(fixes, tol), dropped = fixes.length - use.length;
      const s = measStats(use), [cls0, text] = measVerdict(s.m, tol, o.scale), d = sats && sats.dop;
      const H = normalHeight(s.lat, s.lng, s.hEll), ht = heightTol(o.scale), hBad = s.hm != null && s.hm > ht;
      const cls = hBad && cls0 === 'ok' ? 'mid' : cls0;
      $('measLive').innerHTML = `<div class="meas-verdict ${cls}"><div class="meas-big">±${cmText(s.m)}</div>${text}</div>
        ${H != null ? `<div class="meas-h">H ${mText(H, 2)} м <span>±${cmText(s.hm)}${hgt.ref || hgt.dh ? '' : ', без привязки к реперу'}</span></div>
          <div class="meas-sub" style="${hBad ? 'color:var(--red)' : ''}">${hBad ? `Высота хуже допуска ${cmText(ht)} (¼ сечения рельефа) — для отметок не годится` : `Высота в допуске ${cmText(ht)}`}</div>` : ''}
        ${dropped ? `<div class="meas-sub" style="color:var(--red)">Отброшено отсчётов хуже допуска (FLOAT, без поправок): ${dropped}</div>` : ''}
        <div class="meas-sub">${sec} из ${o.sec} с · отсчётов ${s.n} · разброс ±${cmText(s.dev)} · по приёмнику ±${cmText(s.acc)}${d ? ' · HDOP ' + d.h.toFixed(1) : ''}</div>` +
        (d && d.h > 5 ? '<div class="meas-sub" style="color:var(--red)">Плохая геометрия спутников (HDOP больше 5) — лучше подождать.</div>' : '');
    }
    if (sec >= o.sec) finish();
  };
  const finish = () => {
    stop();
    if (fixes.length < MEAS_MIN_FIXES) { $('measLive').textContent = `Мало отсчётов (${fixes.length}) — нужен хотя бы ${MEAS_MIN_FIXES}. Проверьте GPS и повторите.`; resetButtons(); return; }
    const use = goodFixes(fixes, tol), s = measStats(use), [cls0] = measVerdict(s.m, tol, o.scale);
    const cls = s.hm != null && s.hm > heightTol(o.scale) && cls0 === 'ok' ? 'mid' : cls0;
    const hd = hdops.length ? hdops.reduce((a, b) => a + b, 0) / hdops.length : null;
    const meas = { sec: Math.round((Date.now() - t0) / 1000), n: s.n, m: +s.m.toFixed(3), dev: +s.dev.toFixed(3), acc: +s.acc.toFixed(3),
      hdop: hd == null ? null : +hd.toFixed(1), hEll: s.hEll == null ? null : +s.hEll.toFixed(3), hm: s.hm == null ? null : +s.hm.toFixed(3), kind: o.kind, scale: o.scale, tol: +tol.toFixed(3), ok: cls, dropped: fixes.length - use.length, at: new Date().toISOString() };
    const go = $('measGo');
    go.textContent = 'Принять'; go.disabled = false;
    go.onclick = () => { closeSheet(); onAccept(L.latLng(s.lat, s.lng), meas); };
    const back = go.previousElementSibling;
    back.removeAttribute('data-close'); back.textContent = 'Повторить';
    back.onclick = () => openMeasure(onAccept);
  };
  const resetButtons = () => { const go = $('measGo'); go.textContent = 'Начать'; go.disabled = false; go.onclick = () => runMeasure(o, onAccept); };
  measuring = { onFix(p) {
    if (p.timestamp === lastTs) return;                                // тот же отсчёт повторно
    lastTs = p.timestamp;
    fixes.push({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, alt: p.coords.altitude, altAcc: p.coords.altitudeAccuracy });
    if (sats && sats.dop) hdops.push(sats.dop.h);
  } };
  const go = $('measGo');
  go.textContent = 'Стоп — принять';
  go.onclick = () => finish();
  timer = setInterval(live, 500);
  live();
}

/* ───────────── Обновление Android-приложения: плашка «Доступна новая версия» ───────────── */

// APP_BUILD меняет скрипт выпуска (release.ps1); на сайте лежит version.json с номером последней сборки и ссылкой на APK
const APP_BUILD = 31;
const UPDATE_URL = 'https://maximenkovdi-cloud.github.io/polevoy-plan/version.json';
async function checkUpdate() {
  if (!NATIVE || !navigator.onLine) return;
  try {
    const v = await fetch(UPDATE_URL + '?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json());
    if (!(v.build > APP_BUILD)) return;
    $('updVer').textContent = v.name || ('сборка ' + v.build);
    $('updLine').style.display = 'flex';
    const U = window.Capacitor.Plugins && window.Capacitor.Plugins.Updater || (window.Capacitor.registerPlugin && window.Capacitor.registerPlugin('Updater'));
    const btn = $('updBtn');
    let busy = false;
    btn.onclick = async () => {
      if (busy) return;
      if (!U || !U.install) { if (U) U.open({ url: v.apk }); else window.open(v.apk, '_blank'); return; }   // старая сборка — через браузер
      busy = true; btn.disabled = true; btn.textContent = 'Скачиваю…';
      const sub = await U.addListener('progress', p => { btn.textContent = p.percent >= 0 ? `Скачиваю ${p.percent}%` : 'Скачиваю…'; });
      try {
        const r = await U.install({ url: v.apk });
        if (r && r.needPermission) toast('Включите «Разрешить установку» для «Полевого плана», вернитесь и нажмите «Обновить» ещё раз');
        else btn.textContent = 'Установите в окне Android';
      } catch (e) { toast((e && e.message) || 'Не удалось скачать обновление'); }
      if (sub && sub.remove) sub.remove();
      busy = false; btn.disabled = false;
      if (btn.textContent.startsWith('Скачиваю')) btn.textContent = 'Обновить';
    };
  } catch (e) { /* нет связи с сайтом — проверим в другой раз */ }
}

/* ───────────── Спутники ГНСС — только в Android-приложении (браузер этих данных не даёт) ───────────── */

const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const GNSS = NATIVE && ((window.Capacitor.Plugins && window.Capacitor.Plugins.Gnss) ||
  (window.Capacitor.registerPlugin && window.Capacitor.registerPlugin('Gnss')));   // Capacitor 6: registerPlugin, запасной путь — Plugins
const SAT_SHORT = { 'GPS': 'GPS', 'ГЛОНАСС': 'ГЛН', 'Galileo': 'GAL', 'BeiDou': 'BDS', 'QZSS': 'QZS', 'SBAS': 'SBAS', 'NavIC': 'NavIC', 'Прочие': 'проч.' };
let sats = null, gnssOn = false;
function showSats(st) {

  sats.dop = st.sats ? computeDop(st.sats) : null;

  $('satLine').style.display = 'flex';

    (st.systems || []).map(s => `${SAT_SHORT[s.name] || s.name} ${s.used}/${s.seen}`).join(' · ');
  if ($('satBody')) $('satBody').innerHTML = satSheetBody();            // лист «Спутники» открыт — обновляем вживую
}

/* DOP — геометрический фактор (ESA GNSS Data Processing, т. I, § 6.1.3.2): Q = (GᵀG)⁻¹ в системе ВСВ (восток-север-верх).
   Строка G для спутника: [cos el·sin az, cos el·cos az, sin el, часы]. Часы приёмника для каждой системы свои —
   у GPS, ГЛОНАСС, Galileo, BeiDou разные шкалы времени, поэтому по столбцу «часов» на каждую систему в решении. */
const DOP_GRADES = [[1, 'отлично', 'ok'], [2, 'хорошо', 'ok'], [5, 'удовлетворительно', 'mid'], [Infinity, 'плохо — подождите', 'bad']];
function computeDop(list) {
  const used = list.filter(s => s.used && s.el >= 0);
  const systems = [...new Set(used.map(s => s.sys))];
  const n = 3 + systems.length;
  if (used.length < n) return null;                                     // неизвестных больше, чем спутников
  const N = Array.from({ length: n }, () => new Array(n).fill(0));
  for (const s of used) {
    const el = s.el * Math.PI / 180, az = s.az * Math.PI / 180;
    const g = new Array(n).fill(0);
    g[0] = Math.cos(el) * Math.sin(az); g[1] = Math.cos(el) * Math.cos(az); g[2] = Math.sin(el);
    g[3 + systems.indexOf(s.sys)] = 1;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) N[i][j] += g[i] * g[j];
  }
  const Q = invert(N);
  if (!Q) return null;
  const h = Math.sqrt(Q[0][0] + Q[1][1]), v = Math.sqrt(Q[2][2]);
  return { h, v, p: Math.sqrt(h * h + v * v), n: used.length };
}
function dopGrade(h) { return DOP_GRADES.find(([max]) => h <= max); }
// обращение небольшой симметричной матрицы методом Гаусса — Жордана; null, если геометрия вырождена
function invert(M) {
  const n = M.length, A = M.map((row, i) => [...row, ...row.map((_, j) => (i === j ? 1 : 0))]);
  for (let c = 0; c < n; c++) {
    let p = c;
    for (let r = c + 1; r < n; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
    if (Math.abs(A[p][c]) < 1e-9) return null;
    [A[c], A[p]] = [A[p], A[c]];
    const d = A[c][c];
    A[c] = A[c].map(x => x / d);
    for (let r = 0; r < n; r++) if (r !== c) { const k = A[r][c]; A[r] = A[r].map((x, j) => x - k * A[c][j]); }
  }
  return A.map(row => row.slice(n));
}

/* Карта неба: центр — зенит, край — горизонт, север вверху. Закрашен — спутник в решении, кружок — только виден.
   Пунктир — маска 15°: спутники ниже неё сигнал дают через толщу атмосферы и отражения, им веры меньше. */
const SKY_MASK = 15;
const SYS_COLOR = { 'GPS': '#1e88e5', 'ГЛОНАСС': '#e53935', 'Galileo': '#43a047', 'BeiDou': '#fb8c00' };
function skyPlot(list, size) {
  const c = size / 2, R = c - 16, rr = el => R * (90 - el) / 90;
  let svg = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block;margin:0 auto">
    <g fill="none" stroke="var(--muted)" stroke-width=".8">
      <circle cx="${c}" cy="${c}" r="${R}"/><circle cx="${c}" cy="${c}" r="${rr(30)}"/><circle cx="${c}" cy="${c}" r="${rr(60)}"/>
      <circle cx="${c}" cy="${c}" r="${rr(SKY_MASK)}" stroke-dasharray="3 3"/>
      <path d="M${c} ${c - R}V${c + R}M${c - R} ${c}H${c + R}"/></g>
    <g font-size="11" fill="var(--muted)" text-anchor="middle">
      <text x="${c}" y="10">С</text><text x="${c}" y="${size - 2}">Ю</text><text x="${size - 6}" y="${c + 4}">В</text><text x="6" y="${c + 4}">З</text>
      <text x="${c + 3}" y="${c - rr(30) + 11}" text-anchor="start" font-size="9">30°</text><text x="${c + 3}" y="${c - rr(60) + 11}" text-anchor="start" font-size="9">60°</text></g>`;
  for (const s of list) {
    if (!(s.el >= 0)) continue;
    const a = s.az * Math.PI / 180, r = rr(s.el), x = c + r * Math.sin(a), y = c - r * Math.cos(a), col = SYS_COLOR[s.sys] || '#757575';
    svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6" fill="${s.used ? col : 'var(--panel)'}" stroke="${col}" stroke-width="1.5" opacity="${s.el < SKY_MASK ? .55 : 1}"/>
      <text x="${(x + 8).toFixed(1)}" y="${(y + 3).toFixed(1)}" font-size="9" fill="var(--ink)">${s.svid}</text>`;
  }
  return svg + '</svg>';
}
function satSheetBody() {
  const d = sats.dop, g = d && dopGrade(d.h);
  const rows = (sats.systems || []).map(s => `<tr><td>${SYS_COLOR[s.name] ? `<span style="color:${SYS_COLOR[s.name]}">●</span> ` : ''}${esc(s.name)}</td><td>${s.seen}</td><td>${s.used}</td><td>${s.snr}</td></tr>`).join('');
  const dopLine = d
    ? `<div class="dop"><span class="dot ${g[2]}"></span><b>HDOP ${d.h.toFixed(1)}</b> — ${g[1]} · PDOP ${d.p.toFixed(1)} · VDOP ${d.v.toFixed(1)}</div>`
    : `<div class="dop"><span class="dot bad"></span>DOP: мало спутников в решении</div>`;
  const bands = [...new Set((sats.sats || []).map(x => x.band).filter(Boolean))];
  const dual = bands.some(b => b !== 'L1' && b !== 'B1');
  const track = sats.fullTracking
    ? '<div class="dop"><span class="dot ok"></span>Полное слежение включено — телефон не притормаживает спутниковый чип</div>'
    : '<div class="dop"><span class="dot mid"></span>Полное слежение недоступно (нужен Android 12+) — включите его в настройках телефона, см. ниже</div>';
  const freq = bands.length ? `<div class="dop"><span class="dot ${dual ? 'ok' : 'mid'}"></span>Частоты: <b>${bands.join(', ')}</b> — ${dual ? 'телефон двухчастотный' : 'только одна частота'}</div>` : '';
  return dopLine + track + freq + (sats.sats ? skyPlot(sats.sats, 240) : '') +
    `<table class="sat-tab"><tr><th>Система</th><th>Видно</th><th>В решении</th><th>Сигнал, дБ·Гц</th></tr>${rows}
    <tr class="sum"><td>Всего</td><td>${sats.total}</td><td>${sats.used}</td><td></td></tr></table>
    <div class="hint" style="margin-top:10px;color:var(--muted);font-size:12.5px">HDOP — во сколько раз геометрия спутников ухудшает точность в плане: до 2 — хорошо, больше 5 — снимать не стоит.
    <details class="more"><summary>Как ещё помочь приёму</summary><div class="hint" style="line-height:1.5">
      1. <b>Батарея без ограничений:</b> Настройки → Приложения → «Полевой план» → Батарея → «Без ограничений».<br>
      2. <b>Все измерения ГНСС:</b> Настройки → «Для разработчиков» → «Принудительно включать все измерения GNSS» (если пункт есть). Меню разработчика открывается 7 нажатиями на «Номер сборки» в «О телефоне».<br>
      3. Держите телефон экраном вверх, не закрывайте рукой верх корпуса — там антенна. На вехе или на капоте лучше, чем в кармане.<br>
      4. Это убирает пропуски и скачки, но сантиметров телефон не даст — для 1:500 нужен внешний приёмник.</div></details>
    Закрашенные кружки — в решении, пустые — только видны; ниже пунктира (15°) спутникам веры меньше. Сигнал выше 30 дБ·Гц — хороший, ниже 20 — слабый.</div>`;
}
function satMessage(msg) { $('satLine').style.display = 'flex'; $('satText').textContent = msg; }
function startGnss() {
  if (!NATIVE || gnssOn) return;

  gnssOn = true;
  satMessage('Спутники: поиск… (на открытом месте, без сим-карты — до нескольких минут)');
  GNSS.addListener('status', showSats);
  if (GNSS.keepScreen) GNSS.keepScreen({ on: pref('keepScreen', true) }).catch(() => {});   // экран не гаснет, пока открыт план
  GNSS.start().catch(e => { gnssOn = false; satMessage('Спутники: ' + (e && e.message || 'нет доступа') + ' — нажмите ◎'); });
}
$('satLine').onclick = () => {
  if (!sats) return;
  showSheet(`<div class="sh-head"><b>Спутники ГНСС</b><button class="x" data-close>×</button></div><div id="satBody">${satSheetBody()}</div>`);
};

$('fabMe').onclick = () => {
  startGnss();
  if (!gps) { startGps(); return; }

/* ───────────── Точечные знаки ───────────── */

const pointLayer = L.layerGroup().addTo(map);
let selected = null;                          // { kind: 'point'|'line', obj }
function symbolSvg(svg, px, color) { return `<svg viewBox="0 0 24 24" width="${px}" height="${px}" style="color:${color || 'var(--sym)'};display:block">${svg}</svg>`; }

  if (s.spot) return p.h == null || p.h === '' ? '' : planNum(p.h, 2);
  if (p.type === GENERIC.point && p.h != null && p.h !== '') return [p.name, planNum(p.h, 2)].filter(Boolean).join(' ');
  if (/^w_/.test(p.type) && hasH(p.h) && wellBottom(p) != null) return [p.name, `${planNum(p.h, 2)}/${planNum(wellBottom(p), 2)}`].filter(Boolean).join(' ');            // отметка высоты — сама отметка, два знака (1:500)

function openForm(title, fields, onSave, saveText) {

    const input = x.type === 'select'

    return { half: x.half, html: `<div><label for="${id}">${esc(x.label)}</label>${input}${x.hint ? `<div class="hint">${esc(x.hint)}</div>` : ''}</div>` };
  });
  let body = '';
  for (let i = 0; i < f.length; i++) {
    if (f[i].half && f[i + 1] && f[i + 1].half) { body += `<div class="row2">${f[i].html}${f[i + 1].html}</div>`; i++; }
    else body += f[i].html;

  showSheet(`<div class="sh-head"><b>${esc(title)}</b><button class="x" data-close>×</button></div><div class="form">${body}
    <div class="acts"><button class="btn" data-close>Отмена</button><button class="btn primary" id="formSave">${esc(saveText || 'Сохранить')}</button></div></div>`);
  $('formSave').onclick = () => {
    const vals = Object.fromEntries(fields.map(x => [x.key, $('f_' + x.key).value.trim()]));

/* ───────────── Вынос в натуру: цель — точка плана, вершина или координаты; показываем куда и сколько идти ───────────── */

const STAKE_OK_M = 0.02;                                               // ближе 2 см — «на месте»

      <div><div class="big ${here ? 'ok' : ''}">${here ? 'На месте' : cmText(d)}</div>
      <div>${dx >= 0 ? 'на север' : 'на юг'} ${cmText(Math.abs(dx))} · ${dy >= 0 ? 'на восток' : 'на запад'} ${cmText(Math.abs(dy))}</div>

    <div style="color:var(--muted);font-size:.8em;margin-top:4px">X ${f2(t.x)} Y ${f2(t.y)} — стрелка показывает направление на карте (север вверху)</div>`;

setInterval(updateStake, 1000);

/* ───────────── Точка по расстоянию и углу от базы (смещение): база — GPS, если свежий, иначе последняя поставленная ───────────── */
function offsetPoint() {
  const fresh = gps && Date.now() - gps.at < GPS_FRESH_MS;
  const last = mode.kind === 'point' ? data.points[data.points.length - 1] : null;
  const base = fresh ? L.latLng(gps.lat, gps.lng) : mode.kind === 'line' && mode.latlngs.length ? L.latLng(mode.latlngs[mode.latlngs.length - 1]) : last ? L.latLng(last.lat, last.lng) : null;
  if (!base) { toast('Нет базы: включите GPS или сначала поставьте точку'); return; }
  openForm('Точка по расстоянию и углу', [
    { key: 'd', label: 'Расстояние, м', type: 'number', placeholder: '3.50', half: true },
    { key: 'a', label: 'Дирекционный угол, °', type: 'number', placeholder: '90 — на восток', half: true,
      hint: `От ${fresh ? 'текущего положения по GPS' : 'последней точки'}. 0° — на север, 90° — на восток, 180° — на юг, 270° — на запад.` }
  ], v => {

    const b = sk42(base.lat, base.lng), r = a * Math.PI / 180;

}

/* ───────────── Режимы: ставим знак / рисуем линию ───────────── */

let mode = null;          // { kind: 'point'|'line', type, latlngs, temp }

// кнопки громкости в режиме съёмки (Android): «−» — точка по GPS, «+» — измерение с усреднением
addEventListener('volumeKey', e => {

/* ── Сохранить участок заранее (для работы без интернета) ── */
const TILE_KB = 18;                  // средний размер куска карты — для оценки объёма
const PREFETCH_MAX_TILES = 4000;     // больше за раз не качаем: бережём и телефон, и сервер карты
const PREFETCH_PARALLEL = 3;         // одновременно не больше трёх запросов — так просит политика OSM
function tileRange(b, z) {
  const n = 2 ** z, tx = lng => Math.floor((lng + 180) / 360 * n);
  const ty = lat => { const r = lat * Math.PI / 180; return Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n); };
  return { x0: tx(b.getWest()), x1: tx(b.getEast()), y0: ty(b.getNorth()), y1: ty(b.getSouth()) };
}
function tileUrl(layer, z, x, y) {
  const sub = layer.options.subdomains, s = sub && sub.length ? sub[Math.abs(x + y) % sub.length] : '';
  return L.Util.template(layer._url, { s, z, x, y, r: '' });
}
let prefetching = false;
async function saveArea() {
  if (prefetching) { toast('Уже сохраняю — подождите'); return; }
  const layer = bases[baseName], o = layer.options;
  if (!o.cache || !o.prefetch) { alert(`«${baseName}» по условиям поставщика нельзя сохранять в телефон.\nВыберите в слоях схему OSM, рельеф или Sentinel-2.`); return; }
  const b = map.getBounds(), zMax = o.prefetch, zMin = Math.max(8, Math.min(zMax, Math.floor(map.getZoom()) - 3)), jobs = [];
  for (let z = zMin; z <= zMax; z++) { const r = tileRange(b, z); for (let x = r.x0; x <= r.x1; x++) for (let y = r.y0; y <= r.y1; y++) jobs.push({ z, x, y }); }
  if (jobs.length > PREFETCH_MAX_TILES) { alert(`Район слишком большой: ${jobs.length} кусков карты (можно до ${PREFETCH_MAX_TILES}).\nПриблизьте карту к своему участку и повторите.`); return; }
  if (!confirm(`Сохранить видимый участок для работы без интернета?\n\nПодложка: ${baseName}\nКусков карты: ${jobs.length}, примерно ${Math.max(1, Math.round(jobs.length * TILE_KB / 1024))} МБ\n\nЗаранее сохраняется до масштаба около 1:8000 (так требуют правила OpenStreetMap). Крупнее — карта сохраняется сама, когда вы просматриваете участок при интернете.`)) return;
  prefetching = true;
  let done = 0, failed = 0;
  const next = async () => {
    while (jobs.length) {
      const j = jobs.shift(), key = `${o.cacheId}/${j.z}/${j.x}/${j.y}`;
      if (!(await tileStore('readonly', s => s.count(key)))) {
        try {
          const r = await fetch(tileUrl(layer, j.z, j.x, j.y), { mode: 'cors' });
          if (!r.ok) throw new Error(r.status);
          const blob = await r.blob();                                // сначала целиком получаем кусок, потом сохраняем
          await tileStore('readwrite', s => s.put(blob, key));
        }
        catch (e) { failed++; }
      }
      if (++done % 40 === 0) toast(`Сохраняю карту: ${done} из ${done + jobs.length}`);
    }
  };
  await Promise.all(Array.from({ length: PREFETCH_PARALLEL }, next));
  prefetching = false;
  toast(failed ? `Сохранено, но ${failed} кусков не скачались — проверьте интернет и повторите` : 'Участок сохранён — можно работать без интернета');
}

/* ───────────── Фото к объектам: съёмка, хранение в телефоне (IndexedDB «tk-photos»), просмотр ───────────── */

const PHOTO_MAX_PX = 1600, PHOTO_Q = 0.82;                           // ≈ 300–500 КБ: надпись на люке читается
const photoDb = new Promise(resolve => {
  try {
    const req = indexedDB.open('tk-photos', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('photos', { keyPath: 'id' });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
  } catch (e) { resolve(null); }
});
async function photoTx(mode, fn) {
  const db = await photoDb;
  if (!db) throw new Error('память для фото недоступна');
  return new Promise((ok, bad) => { const tx = db.transaction('photos', mode), r = fn(tx.objectStore('photos')); tx.oncomplete = () => ok(r && r.result); tx.onerror = () => bad(tx.error); });
}
const photoGet = id => photoTx('readonly', st => st.get(id));

// направление съёмки — по компасу телефона, если он есть
let heading = null;
addEventListener('deviceorientationabsolute', e => { if (e.alpha != null) heading = Math.round((360 - e.alpha) % 360); });

photoInput.type = 'file'; photoInput.accept = 'image/*'; photoInput.setAttribute('capture', 'environment'); photoInput.style.display = 'none';
document.body.appendChild(photoInput);
// открыть камеру; вернёт сжатый JPEG или null, если сняли отмену
function takePhoto() {
  return new Promise(resolve => {
    photoInput.value = '';
    photoInput.onchange = async () => {
      const file = photoInput.files[0];
      if (!file) { resolve(null); return; }
      try { resolve(await shrinkPhoto(file)); } catch (e) { toast('Не удалось обработать фото'); resolve(null); }
    };
    photoInput.click();
  });
}
async function shrinkPhoto(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  const k = Math.min(1, PHOTO_MAX_PX / Math.max(bmp.width, bmp.height)), w = Math.round(bmp.width * k), h = Math.round(bmp.height * k);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  cv.getContext('2d').drawImage(bmp, 0, 0, w, h);
  return new Promise(ok => cv.toBlob(b => ok(b), 'image/jpeg', PHOTO_Q));
}

const GRID_STEPS = [10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000];
const GRID_MIN_PX = 120;         // кресты не чаще, чем через 120 пикселей — чтобы поместились подписи
const GRID_ARM = 0.1;            // половина креста — 10 % шага сетки, кресты растут вместе с картой
const GRID_COLOR = '#2e7d32';    // кресты — зелёные
const GRID_LINE_COLOR = '#66bb6a';

const GRID_MAX_CROSSES = 400;    // предохранитель: больше крестов на экране не рисуем

  onAdd(m) {

  },
  onRemove(m) {

  try {

  layersControl.addOverlay(layer, 'Растр: ' + esc(r.name));
}
async function loadRasters() {
  try { const all = await rasterStore('readonly', s => s.getAll()); (all || []).forEach(showRaster); }
  catch (e) { toast('Не удалось открыть сохранённые растры'); }
}
// «5892500 6662500» или «5 892 500; 6 662 500» (пробелы внутри числа — только с точкой с запятой между X и Y)
function parseXY(v) {
  const parts = v.includes(';') ? v.split(';') : v.trim().split(/\s+/);
  const nums = parts.filter(s => s.trim() !== '').map(parseNum);
  return nums.length === 2 && !nums.some(isNaN) ? nums : null;
}
const rasterInput = document.createElement('input');
rasterInput.type = 'file'; rasterInput.accept = 'image/png,image/jpeg,image/webp'; rasterInput.style.display = 'none';
document.body.appendChild(rasterInput);
rasterInput.onchange = e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  const c = sk42(map.getCenter().lat, map.getCenter().lng);
  openForm('Привязка растра: ' + f.name, [
    { key: 'tl', label: 'Левый верхний угол — X Y, м', value: `${Math.round(c.x)} ${Math.round(c.y)}`, hint: 'Два числа через пробел, например 5892500 6662500' },
    { key: 'br', label: 'Правый нижний угол — X Y, м', value: `${Math.round(c.x) - 500} ${Math.round(c.y) + 500}` },
    { key: 'zone', label: crs().zoned ? 'Зона ' + planeName() : 'Зона (для МСК не нужна)', type: 'number', value: c.zone, hint: `Картинка должна быть выровнена по сетке ${planeName()}: север вверху.` }
  ], v => {
    const tl = parseXY(v.tl), br = parseXY(v.br), zone = crs().zoned ? parseInt(v.zone, 10) : 0;
    if (!tl || !br) { toast('Нужно два числа: X и Y'); return false; }
    if (!(tl[0] > br[0] && br[1] > tl[1])) { toast('У левого верхнего угла X больше, а Y меньше, чем у правого нижнего'); return false; }
    if (crs().zoned && !(zone > 0 && zone < 61)) { toast('Зона — число от 1 до 60'); return false; }
    const ll = (x, y) => { const p = fromSk42(x, y, zone); return [p.lat, p.lng]; };
    const r = { id: uid(), name: f.name, blob: f, tl: ll(tl[0], tl[1]), tr: ll(tl[0], br[1]), bl: ll(br[0], tl[1]), opacity: RASTER_OPACITY };
    rasterStore('readwrite', s => s.put(r)).catch(() => toast('Растр показан, но не сохранён на телефоне'));
    showRaster(r);
    map.fitBounds([r.tl, r.tr, r.bl], { padding: [30, 30] });
    toast('Растр наложен. Включать и выключать — кнопкой «Слои»');
  }, 'Наложить');
};
function rasterMenu() {
  const ids = Object.keys(rasterLayers);
  if (!ids.length) { toast('Своих растров пока нет'); return; }
  openList('Свои растры', ids.flatMap(id => {
    const r = rasterLayers[id].r;
    return [{ header: r.name }, { id: 'op:' + id, icon: '◐', text: `Прозрачность ${Math.round((1 - (r.opacity || RASTER_OPACITY)) * 100)} % — нажмите, чтобы изменить` },
      { id: 'del:' + id, icon: '🗑', text: 'Удалить растр' }];
  }), async pick => {
    const [act, id] = pick.split(':'), layer = rasterLayers[id];
    if (!layer) return;
    if (act === 'op') {
      const o = { 0.5: 0.7, 0.7: 0.9, 0.9: 1, 1: 0.5 }[layer.r.opacity || RASTER_OPACITY] || RASTER_OPACITY;
      layer.setOpacity(o);
      try { await rasterStore('readwrite', s => s.put(layer.r)); } catch (e) { /* не критично */ }
      toast('Прозрачность ' + Math.round((1 - o) * 100) + ' %');
      rasterMenu();
    }
    if (act === 'del' && confirm('Удалить растр «' + layer.r.name + '»?')) {
      map.removeLayer(layer); layersControl.removeLayer(layer); delete rasterLayers[id];
      try { await rasterStore('readwrite', s => s.delete(id)); } catch (e) { /* уже убран с карты */ }
    }
  });
}

/* ───────────── Старт ───────────── */

ready = true;
loadGeoid().catch(() => { /* без сети и кэша — попробуем при съёмке */ });
if (NATIVE) { startGnss(); startGps(); checkUpdate(); }   // в Android-приложении спутники и GPS включаются сразу, проверяется обновление
// вернулись в приложение (из другого окна, после сна телефона) — ещё раз проверить обновление, перезапускать не нужно
if (NATIVE) document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
// на сайте — фоновый помощник, чтобы приложение открывалось без интернета (в Android-приложении всё и так внутри)
if (!NATIVE && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { /* без него просто нужен интернет */ });
redrawAll();
updateInfo();
layout();                                            // после updateInfo: плашка уже с координатами и своей настоящей высотой
window.addEventListener('resize', layout);
// плашка меняет высоту (WGS / СК-42 / оба, длинная строка GPS) — кнопки и подсказки сдвигаются следом
if (window.ResizeObserver) new ResizeObserver(layout).observe($('top'));
loadRasters();
if (data.points.length || data.lines.length) MENU.fit();
</script>
