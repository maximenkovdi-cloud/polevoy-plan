<script src="lib/leaflet.min.js"></script>
<script src="lib/proj4.js"></script>
<style>
  /* Roboto Condensed © The Roboto Condensed Project Authors, SIL Open Font License 1.1 (https://openfontlicense.org), с Google Fonts; лежит в lib — запуск без интернета не ждёт шрифт */
  @font-face { font-family:'Roboto Condensed'; font-style:normal; font-weight:400 500; font-display:swap; src:url(lib/rc-normal-cyrillic.woff2) format('woff2'); unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family:'Roboto Condensed'; font-style:normal; font-weight:400 500; font-display:swap; src:url(lib/rc-normal-latin.woff2) format('woff2'); unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family:'Roboto Condensed'; font-style:italic; font-weight:400 500; font-display:swap; src:url(lib/rc-italic-cyrillic.woff2) format('woff2'); unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family:'Roboto Condensed'; font-style:italic; font-weight:400 500; font-display:swap; src:url(lib/rc-italic-latin.woff2) format('woff2'); unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  /* ── темы: день / солнце / ночь ── */
  body.day   { --bg:#f4f1e8; --panel:#ffffff; --ink:#151515; --muted:#5d5d5d; --line:#d9d6cc; --accent:#1f5fbf; --accentInk:#fff; --red:#c62828; --sym:#111111; --symBg:#ffffff; --halo:#ffffff; --shadow:0 1px 6px rgba(0,0,0,.18); --fs:14px; }
  body.sun   { --bg:#ffffff; --panel:#ffffff; --ink:#000000; --muted:#222222; --line:#000000; --accent:#0039a6; --accentInk:#fff; --red:#b00000; --sym:#000000; --symBg:#ffffff; --halo:#ffffff; --shadow:0 0 0 2px #000; --fs:15.5px; }
  body.night { --bg:#1c2127; --panel:#262c33; --ink:#e9edf1; --muted:#9aa5b1; --line:#38414b; --accent:#5aa2ff; --accentInk:#0d1117; --red:#ff6b6b; --sym:#e9edf1; --symBg:#1c2127; --halo:#1c2127; --shadow:0 1px 8px rgba(0,0,0,.5); --fs:14px; }
  /* традиционные цвета сетей («Правила начертания…», п. 6 — по дополнительным требованиям) */
  /* чертёжный шрифт подписей на плане: узкий наклонный, как по ГОСТ 2.304 */
  body { --draft:"Roboto Condensed","Arial Narrow",Arial,sans-serif; }
  body { --c-water:#1565c0; --c-sewer:#6d4c41; --c-heat:#8e24aa; --c-gas:#ef8f00; --c-el:#d32f2f; --c-comm:#2e7d32; --c-own:#7b1fa2; }
  body.night { --c-water:#64b5f6; --c-sewer:#bcaaa4; --c-heat:#ce93d8; --c-gas:#ffb74d; --c-el:#ff6b6b; --c-comm:#81c784; --c-own:#ce93d8; }
  /* рельеф по ГКИНП — коричневым (горизонтали, откосы, обрывы); ночью светлее, на солнце темнее */
  body { --rel:#8a4b1c; } body.sun { --rel:#5e2e0c; } body.night { --rel:#d6a06e; }
  body { --veg:#2e7d32; } body.sun { --veg:#1b5e20; } body.night { --veg:#81c784; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; overflow:hidden; background:var(--bg);   /* повёрнутая карта больше экрана — страница не должна прокручиваться */ font:var(--fs)/1.35 system-ui, "Segoe UI", Roboto, sans-serif; color:var(--ink); }
  #map { position:absolute; top:0;right:0;bottom:0;left:0; background:var(--bg); }
  .leaflet-tile-pane { opacity:var(--baseOp, .7); }
  .sat-tiles .leaflet-tile { width:257px !important; height:257px !important; }   /* снимок: кусок на 1 px шире — без светлых швов на экранах с дробным масштабом */
  body.day .leaflet-tile-pane { filter: saturate(.6); }
  body.night .leaflet-tile-pane { filter: brightness(.55) contrast(1.15) saturate(.55); }
  body.sun .leaflet-tile-pane { filter: contrast(1.2) saturate(1.1); }
  button { font:inherit; color:inherit; }

  /* ── верхняя плашка координат ── */
  #top { position:absolute; left:8px; right:8px; top:8px; z-index:1000; background:var(--panel); color:var(--ink); border-radius:14px; padding:6px 8px; box-shadow:var(--shadow); font-variant-numeric:tabular-nums;
    display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
  #top .r1 { display:none; }                                         /* система координат — касанием по координатам */
  /* вторая строка: от меня до крестика (как в «Тактической карте»), при рисовании линии — длина, площадь и направление отрезка */
  #aimLine { flex:1 0 100%; order:5; font-size:13px; line-height:1.3; color:var(--muted); }   /* узкий экран — переносится, но не обрезается */
  #aimLine .nw { white-space:nowrap; }
  #aimLine b { color:var(--ink); font-weight:700; }
  #aimLine.draw b { color:#1565c0; } body.night #aimLine.draw b { color:#90caf9; }
  #coords { flex:1 1 130px; min-width:0; cursor:pointer; }
  #coords .xy .nw { white-space:nowrap; }
  #coords .xy { margin:0; font-size:14px; line-height:1.25; white-space:normal; }
  #top > #updLine, #top > #recLine { flex-basis:100%; }
  /* идёт запись трека — красная полоса вверху: видно в любой теме и на солнце */
  #recLine { display:flex; align-items:center; gap:8px; margin-top:6px; padding:6px 10px; border-radius:10px; background:#c62828; color:#fff; font-size:13px; font-weight:800; cursor:pointer; }
  #recLine .dot { width:10px; height:10px; border-radius:50%; background:#fff; flex:none; animation:recBlink 1.2s steps(2) infinite; }
  @keyframes recBlink { 50% { opacity:.25; } }
  .seg { display:flex; background:var(--line); border-radius:9px; padding:2px; }
  body.sun .seg { background:#fff; border:2px solid #000; }
  .seg button { border:0; background:none; padding:7px 12px; min-height:36px; border-radius:7px; color:var(--muted); font-size:14px; }
  .seg button.on { background:var(--panel); color:var(--ink); font-weight:700; }
  body.sun .seg button.on { background:#000; color:#fff; }
  #zone { font-size:12px; color:var(--muted); }
  .xy { font-size:1.08em; font-weight:700; margin-top:4px; letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .xy small { font-weight:400; color:var(--muted); font-size:.75em; }
  #gpsRow { display:flex; align-items:stretch; gap:6px; flex:0 1 auto; min-width:0; }
  #gpsLine { min-width:0; max-width:190px; min-height:44px; display:flex; align-items:center; gap:6px; font-size:14px; font-weight:700; padding:4px 10px; border-radius:10px; background:var(--line); color:var(--ink); cursor:pointer; }
  #antChip { min-height:44px; }
  body.glove #gpsLine, body.glove #antChip { min-height:56px; }
  #gpsLine #gpsText { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #gpsLine[data-st=fix] { background:#2e7d32; color:#fff; } #gpsLine[data-st=float] { background:#f9a825; color:#1b1b1b; }
  #gpsLine[data-st=phone] { background:#cfd8dc; color:#1b1b1b; } #gpsLine[data-st=bad], #gpsLine[data-st=spoof] { background:#c62828; color:#fff; }
  #gpsLine[data-st=fix] .dot, #gpsLine[data-st=bad] .dot, #gpsLine[data-st=spoof] .dot { background:#fff; }
  #antChip { flex:none; min-width:64px; border:2px solid var(--line); border-radius:9px; background:var(--panel); font-weight:700; font-size:14px; padding:4px 8px; }
  body.night #gpsLine[data-st=phone] { background:#455a64; color:#fff; }
  #updLine { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:6px; padding:6px 8px; border-radius:10px;
    background:color-mix(in srgb, var(--accent) 14%, transparent); font-size:13px; }
  #updLine .btn { min-height:34px; padding:6px 14px; }
  #spoofLine { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:6px; padding:6px 8px; border-radius:10px; background:#c62828; color:#fff; font-size:13px; font-weight:600; }
  #spoofLine .btn { min-height:34px; padding:6px 12px; flex:none; }
  #spoofLine { display:none !important; }                           /* подмена — красной плашкой GPS, подробности по касанию */
  #satLine { display:none !important; }                             /* спутники — внутри плашки GPS, таблица по касанию */
  #satLine.unused { display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink); margin-top:3px; cursor:pointer; white-space:nowrap; overflow:hidden; }
  #satLine #satText { overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
  #satLine .more { color:var(--muted); margin-left:auto; }
  .sat-tab { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; margin-top:4px; }
  .sat-tab th, .sat-tab td { padding:9px 6px; border-bottom:1px solid var(--line); text-align:right; }
  .sat-tab th:first-child, .sat-tab td:first-child { text-align:left; }
  .sat-tab th { color:var(--muted); font-weight:500; font-size:12.5px; }
  .sat-tab tr.sum td { font-weight:700; }
  .dop { display:flex; align-items:center; gap:7px; margin:2px 0 8px; font-variant-numeric:tabular-nums; }
  .meas-big { font-size:2em; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.1; }
  .meas-live { min-height:84px; }
  .meas-sub { color:var(--muted); font-size:.85em; margin-top:4px; }
  .meas-h { font-size:1.15em; font-weight:700; margin-top:6px; } .meas-h span { font-weight:400; color:var(--muted); font-size:.85em; }
  .meas-sum { width:100%; text-align:left; border:1px solid var(--line); background:none; color:var(--ink); border-radius:12px; padding:10px 12px; margin-top:8px; min-height:44px; font-size:.95em; }
  .meas-sum .pen { float:right; color:var(--accent); }
  .meas-verdict { border-radius:12px; padding:10px 12px; margin:6px 0; font-weight:600; }
  .meas-verdict.ok { background:color-mix(in srgb, #2e7d32 15%, transparent); }
  .meas-verdict.mid { background:color-mix(in srgb, #f9a825 20%, transparent); }
  .meas-verdict.bad { background:color-mix(in srgb, #c62828 15%, transparent); }
  .meas-row { display:flex; gap:8px; align-items:center; margin:8px 0; flex-wrap:wrap; }
  .meas-row > span { color:var(--muted); font-size:13px; min-width:92px; }
  .meas-row .seg { flex-wrap:wrap; }
  .dot { width:9px; height:9px; border-radius:50%; background:#9e9e9e; flex:none; }
  .dot.ok { background:#2e7d32; } .dot.mid { background:#f9a825; } .dot.bad { background:#c62828; }

  /* ── перекрестье ── */
  #cross { position:absolute; left:50%; top:50%; width:var(--cs, 34px); height:var(--cs, 34px); margin:calc(var(--cs, 34px) / -2) 0 0 calc(var(--cs, 34px) / -2); z-index:900; pointer-events:none; }
  /* служебная графика — графитом, не красным: красный занят знаками (трасса демонтажа и др.) */
  #cross path + path { stroke:var(--svc); } #cross circle { fill:var(--svc); }
  #cross.snap path + path { stroke:#00c853; } #cross.snap circle { fill:#00c853; }   /* ярко-зелёный — «+» прилипнет к точке под ним (не путать с сеткой) */
  body { --svc:#263238; --svcPath:#5e35b1; } body.night { --svc:#eceff1; --svcPath:#b39ddb; } body.sun { --svc:#000; --svcPath:#4a148c; }
  #fabPlus { position:absolute; right:12px; z-index:1001; width:66px; height:66px; border-radius:50%; border:0; background:var(--accent); color:var(--accentInk); display:none; align-items:center; justify-content:center; box-shadow:var(--shadow); }
  #fabPlus svg { width:36px; height:36px; }
  #fabPlus .sym { position:absolute; right:-4px; top:-4px; width:28px; height:28px; border-radius:50%; background:var(--panel); box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; }
  #fabPlus .sym svg { width:20px; height:20px; }
  body.glove #fabPlus { width:78px; height:78px; }

  /* ── круглые кнопки справа ── */
  #fabs { position:absolute; right:10px; z-index:1000; display:flex; flex-direction:column; gap:10px; }
  .fab { width:50px; height:50px; border-radius:50%; border:0; background:var(--panel); color:var(--ink); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow); }
  .fab svg { width:26px; height:26px; }
  .fab.on { background:var(--accent); color:var(--accentInk); }
  /* Кнопка GPS — четыре состояния, различимые и на солнце (по форме, не по оттенку):
     выкл. — значок серый; GPS есть, не следит — синий значок; следит — синяя заливка; компас — заливка + толстое кольцо;
     пауза (карту сдвинули) — пунктирное кольцо и подпись «вернуть» */
  #fabMe { position:relative; color:var(--muted); }
  #fabMe.on { background:var(--panel); color:var(--accent); }
  #fabMe[data-view=follow], #fabMe[data-view=compass] { background:var(--accent); color:var(--accentInk); }
  #fabMe[data-view=compass] { box-shadow:0 0 0 4px var(--panel), 0 0 0 7px var(--accent), var(--shadow); }
  #fabMe[data-paused="1"] { background:var(--panel); color:var(--accent); outline:3px dashed var(--accent); outline-offset:2px; }
  #fabMe[data-paused="1"]::after { content:'вернуть'; position:absolute; left:50%; bottom:-15px; transform:translateX(-50%); font:800 10px/1 system-ui, sans-serif; color:#fff; background:var(--accent); padding:2px 5px; border-radius:7px; white-space:nowrap; }
  #fabTrack { position:relative; }
  #fabTrack.rec { background:#c62828; color:#fff; animation:recPulse 1.6s ease-in-out infinite; }   /* идёт запись трека */
  #fabTrack.rec::after { content:''; position:absolute; right:3px; top:3px; width:11px; height:11px; border-radius:50%; background:#fff; box-shadow:0 0 0 2px #c62828; }   /* «●» — видно и без пульсации */
  @keyframes recPulse { 50% { box-shadow:0 0 0 7px rgba(198,40,40,.25), var(--shadow); } }
  #fabCompass { position:absolute; left:10px; top:calc(var(--topH, 92px) + 96px); z-index:1000; width:52px; height:52px; }
  body.glove #fabCompass { width:62px; height:62px; top:calc(var(--topH, 92px) + 112px); }
  #fabCompass svg { transition:transform .1s ease-out; }   /* короткий переход: датчик шлёт часто, длинный отставал бы */
  #fabUndo { position:absolute; left:10px; top:calc(var(--topH, 92px) + 160px); z-index:1000; }   /* «Вернуть» — слева, под компасом: правый столбец короче */
  body.glove #fabUndo { top:calc(var(--topH, 92px) + 186px); }
  /* низкий экран (телефон боком): «Вернуть» — рядом с компасом, а не под ним, чтобы не наезжать на масштаб внизу */
  #fabRedo { position:absolute; left:10px; top:calc(var(--topH, 92px) + 222px); z-index:1000; }   /* «Повторить» — под «Вернуть» */
  body.glove #fabRedo { top:calc(var(--topH, 92px) + 258px); }
  @media (max-height:520px) { #fabRedo, body.glove #fabRedo { top:calc(var(--topH, 92px) + 96px); left:134px; } body.glove #fabRedo { left:158px; } }
  @media (max-height:520px) { #fabUndo, body.glove #fabUndo { top:calc(var(--topH, 92px) + 96px); left:72px; } body.glove #fabUndo { left:84px; } }
  /* ночью светлый крестик — с тёмным ободком (белый ободок сливается со светлым крестиком) */
  body.night #cross path:first-child { stroke:#000; stroke-opacity:.75; }
  #map.rot .leaflet-control-container { display:none; }
  /* круг-компас вокруг крестика: поменьше и полупрозрачный, чтобы не закрывать подписи знаков */
  #ring { position:absolute; left:50%; top:50%; width:min(64vw, 48vh); height:min(64vw, 48vh); transform:translate(-50%, -50%); z-index:899; pointer-events:none; display:none; overflow:visible; opacity:.8;
    filter:drop-shadow(0 0 1px var(--panel)) drop-shadow(0 0 1px var(--panel)); }
  .rg-c { fill:none; stroke:var(--svc); stroke-width:.9; opacity:.6; }
  .rg-t { stroke:var(--svc); stroke-width:.6; opacity:.8; } .rg-t.big { stroke-width:1.3; }
  .rg-l, .rg-a { font:600 9px var(--draft, sans-serif); fill:var(--svc); text-anchor:middle; dominant-baseline:central; paint-order:stroke; stroke:var(--panel); stroke-width:2.5px; }
  .rg-l.cd { font-size:12px; font-weight:800; } .rg-l.n { fill:#c62828; } body.night .rg-l.n { fill:#ff8a80; }
  .rg-h { stroke:var(--svc); stroke-width:1.6; stroke-dasharray:5 3; }
  .rg-a { font-size:11px; font-weight:800; }
  .found-lbl { position:absolute; left:32px; top:7px; white-space:nowrap; font:700 13px/1 var(--draft); color:#e65100; paint-order:stroke;
    text-shadow:0 0 2px var(--panel), 0 0 2px var(--panel), 0 0 3px var(--panel), 0 0 3px var(--panel); }
  body.night .found-lbl { color:#ffab40; }
  /* подписи чертежа DXF: точка привязки — левый нижний угол, сдвиг и поворот — от неё */
  .dxf-ti { pointer-events:none; }
  /* привязка чертежа по двум точкам: панель шагов и метки Ч1/М1 */
  #calBar, #shiftBar { position:fixed; left:8px; right:8px; top:calc(62px + env(safe-area-inset-top)); z-index:1200;   /* сверху: внизу всплывают подсказки */ background:var(--panel); color:var(--ink);
    border-radius:12px; box-shadow:var(--shadow); padding:10px 12px; font-size:var(--fs); max-width:560px; margin:0 auto; }
  #calBar .cal-b, #shiftBar .cal-b { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; margin-top:8px; }
  .cal-m span { position:absolute; transform:translate(-50%,-50%); background:#7b1fa2; color:#fff; font:700 12px Arial, sans-serif; padding:2px 5px; border-radius:9px; white-space:nowrap; box-shadow:0 0 0 2px #fff; }
  .cal-m.g span { background:#2e7d32; }
  .dxf-t { position:absolute; left:0; bottom:0; white-space:pre; line-height:1.1; transform-origin:0 100%; font-family:Arial, sans-serif;
    text-shadow:0 0 2px var(--halo), 0 0 2px var(--halo); pointer-events:none; }

  /* ── масштаб ── */
  #scale { position:absolute; left:10px; z-index:1000; background:var(--panel); color:var(--ink); border-radius:10px; padding:7px 11px 7px; font-size:13px; font-weight:700; box-shadow:var(--shadow); cursor:pointer; }
  #scale i { display:block; height:5px; border:2px solid var(--ink); border-top:0; margin-top:3px; }

  /* ── нижняя панель ── */
  #bar { position:absolute; left:0; right:0; bottom:0; z-index:1000; background:var(--panel); display:flex; justify-content:space-around; padding:8px 4px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); }
  body.sun #bar { border-top:2px solid #000; }
  #bar button { border:0; background:none; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--muted); font-size:12.5px; width:72px; padding:0; }
  #bar .ic { width:56px; height:36px; border-radius:18px; display:flex; align-items:center; justify-content:center; }
  #bar svg { width:26px; height:26px; }
  body.day #bar button:not(.on) { color:#424242; }   /* на солнце серое бледнеет — темнее, чем остальной вспомогательный текст */
  #bar button.on { color:var(--ink); font-weight:700; }
  #bar button.on .ic { background:color-mix(in srgb, var(--accent) 22%, transparent); color:var(--accent); }

  };

  tolNote();
  $('measBox').querySelectorAll('.seg').forEach(box => box.onclick = e => {
    const b = e.target.closest('button[data-v]');

function runMeasure(o, onAccept) {
  startGps();
  loadGeoid().catch(() => toast('Модель геоида не загрузилась — отметки не посчитаются'));
  const fixes = [], t0 = Date.now(), tol = measTol(o);
  let lastTs = 0, timer = null, hdops = [], sawSpoof = false;
  const stop = () => { clearInterval(timer); measuring = null; holdGnss(false); };
  const live = () => {
    if (!$('measBox') || $('sheet').style.display === 'none') { stop(); return; }
    if (spoof) sawSpoof = true;     // лист закрыли — измерение отменено
    const sec = Math.min(o.sec, Math.floor((Date.now() - t0) / 1000));
    if (!fixes.length) { $('measLive').innerHTML = `<div class="meas-big">жду координаты…</div><div class="meas-sub">${sec} с</div>`; }
    else {
      const use = goodFixes(fixes, tol), dropped = fixes.length - use.length;
      const s = measStats(use), [cls0, text] = measVerdict(s.m, tol, o.scale), d = sats && sats.dop;
      const H = normalHeight(s.lat, s.lng, s.hEll), ht = heightTol(o.scale), hBad = s.hm != null && s.hm > ht;
      const cls = hBad && cls0 === 'ok' ? 'mid' : cls0;
      $('measLive').innerHTML = `<div class="meas-verdict ${cls}"><div class="meas-big">±${cmText(s.m)}</div>${text}</div>
        ${H != null ? `<div class="meas-h">H ${mText(H, 2)} м <span>±${cmText(s.hm)}${hgt.ref || hgt.dh ? '' : ', без привязки к реперу'}</span></div>
          <div class="meas-sub" style="${hBad ? 'color:var(--red)' : ''}">${hBad ? `Высота хуже допуска ${cmText(ht)} (¼ сечения рельефа) — для отметок не годится` : `Высота в допуске ${cmText(ht)}`}</div>` : ''}
        ${dropped ? `<div class="meas-sub" style="color:var(--red)">Отброшено отсчётов хуже допуска (FLOAT, без поправок): ${dropped}</div>` : ''}
        <div class="meas-sub">${sec} из ${o.sec} с · отсчётов ${s.n} · разброс ±${cmText(s.dev)} · по приёмнику ±${cmText(s.acc)}${d ? ' · HDOP ' + d.h.toFixed(1) : ''}</div>` +
        (d && d.h > 5 ? '<div class="meas-sub" style="color:var(--red)">Плохая геометрия спутников (HDOP больше 5) — лучше подождать.</div>' : '');
    }
    if (sec >= o.sec) finish();
  };
  const finish = () => {
    stop();
    if (spoof || sawSpoof) { $('measLive').textContent = (spoof ? 'Похоже на подмену GPS' : 'Во время измерения была подмена GPS') + ' — измерение не принято. Подробнее — нажмите красную плашку GPS вверху.'; cue('bad'); resetButtons(); return; }
    if (fixes.length < MEAS_MIN_FIXES) { $('measLive').textContent = `Мало отсчётов (${fixes.length}) — нужен хотя бы ${MEAS_MIN_FIXES}. Проверьте GPS и повторите.`; resetButtons(); return; }
    const use = goodFixes(fixes, tol), s = measStats(use), [cls0] = measVerdict(s.m, tol, o.scale);
    const cls = s.hm != null && s.hm > heightTol(o.scale) && cls0 === 'ok' ? 'mid' : cls0;
    const hd = hdops.length ? hdops.reduce((a, b) => a + b, 0) / hdops.length : null;
    const meas = { sec: Math.round((Date.now() - t0) / 1000), n: s.n, m: +s.m.toFixed(3), dev: +s.dev.toFixed(3), acc: +s.acc.toFixed(3),
      hdop: hd == null ? null : +hd.toFixed(1), hEll: s.hEll == null ? null : +s.hEll.toFixed(3), hm: s.hm == null ? null : +s.hm.toFixed(3), kind: o.kind, scale: o.scale, tol: +tol.toFixed(3), ok: cls, dropped: fixes.length - use.length, at: new Date().toISOString() };
    const go = $('measGo'), accept = () => { if (spoofBlocks()) return; closeSheet(); onAccept(L.latLng(s.lat, s.lng), meas); };
    cue(cls);
    if (o.auto && cls === 'ok' && !gpsNoSat()) { say(`${VERDICT_SPEECH.ok}, плюс-минус ${cmSpeech(s.m)}. Принято`); accept(); return; }
    say(`${VERDICT_SPEECH[cls]}, плюс-минус ${cmSpeech(s.m)}`);
    go.textContent = 'Принять'; go.disabled = false;
    go.onclick = accept;
    const back = go.previousElementSibling;
    back.removeAttribute('data-close'); back.textContent = 'Повторить';
    back.onclick = () => openMeasure(onAccept);
  };
  const resetButtons = () => { const go = $('measGo'); go.textContent = 'Начать'; go.disabled = false; go.onclick = () => runMeasure(o, onAccept); };
  holdGnss(true);
  measuring = { onFix(p) {
    if (p.timestamp === lastTs) return;                                // тот же отсчёт повторно
    lastTs = p.timestamp;
    fixes.push({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, alt: p.coords.altitude, altAcc: p.coords.altitudeAccuracy });

  go.textContent = 'Стоп — принять';
  go.onclick = () => finish();
  timer = setInterval(live, 500);

}

/* ───────────── Работа с занятыми руками: сигналы, озвучка, перчатки, дождь ───────────── */

let soundOn = pref('sound', true), voiceOn = pref('voice', true), gloveOn = pref('glove', false), rainOn = pref('rain', false);

// потеря FIX — три падающих, FIX вернулся — два восходящих. [частота Гц (0 — пауза), длительность мс]
const CUES = {
  tick: { tones: [[1200, 50]], vib: [30] },
  start: { tones: [[880, 120]], vib: [60] },
  ok: { tones: [[1320, 110], [0, 70], [1760, 170]], vib: [80, 80, 80] },
  mid: { tones: [[990, 320]], vib: [250] },
  bad: { tones: [[330, 650]], vib: [650] },
  fixLost: { tones: [[880, 150], [660, 150], [440, 320]], vib: [200, 100, 200, 100, 400] },

    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();

function say(text) {

/* ───────────── Обновление Android-приложения: плашка «Доступна новая версия» ───────────── */

const APP_BUILD = 111;
const UPDATE_URL = 'https://maximenkovdi-cloud.github.io/polevoy-plan/version.json';
const APK_BASE = 'https://maximenkovdi-cloud.github.io/polevoy-plan/';

    if (!r.ok) throw new Error('HTTP ' + r.status);

    if (!(v.build > APP_BUILD)) { if (manual) toast(`У вас последняя версия — сборка ${APP_BUILD}`); return; }
    if (manual) toast(`Есть новая сборка ${v.build} — кнопка «Обновить» вверху`);
    $('updVer').textContent = v.name || ('сборка ' + v.build);
    $('updLine').style.display = 'flex';

    const btn = $('updBtn');

    btn.onclick = async () => {
      if (busy) return;
      if (!apkOk(v.apk)) { toast('Ссылка на обновление не с сайта «Полевого плана» — не открываю'); return; }
      if (!U || !U.install) { if (U) U.open({ url: v.apk }); else window.open(v.apk, '_blank'); return; }   // старая сборка — через браузер

      busy = true; btn.disabled = true; btn.textContent = 'Скачиваю…';

      if (btn.textContent.startsWith('Скачиваю')) btn.textContent = 'Обновить';
    };

}

/* DOP — геометрический фактор (ESA GNSS Data Processing, т. I, § 6.1.3.2): Q = (GᵀG)⁻¹ в системе ВСВ (восток-север-верх).
   Строка G для спутника: [cos el·sin az, cos el·cos az, sin el, часы]. Часы приёмника для каждой системы свои —
   у GPS, ГЛОНАСС, Galileo, BeiDou разные шкалы времени, поэтому по столбцу «часов» на каждую систему в решении. */
const DOP_GRADES = [[1, 'отлично', 'ok'], [2, 'хорошо', 'ok'], [5, 'удовлетворительно', 'mid'], [Infinity, 'плохо — подождите', 'bad']];
function computeDop(list) {
  const used = list.filter(s => s.used && s.el >= 0 && isFinite(Number(s.az)) && isFinite(Number(s.el)));
  const systems = [...new Set(used.map(s => s.sys))];
  const n = 3 + systems.length;
  if (used.length < n) return null;                                     // неизвестных больше, чем спутников
  const N = Array.from({ length: n }, () => new Array(n).fill(0));
  for (const s of used) {
    const el = s.el * Math.PI / 180, az = s.az * Math.PI / 180;
    const g = new Array(n).fill(0);
    g[0] = Math.cos(el) * Math.sin(az); g[1] = Math.cos(el) * Math.cos(az); g[2] = Math.sin(el);
    g[3 + systems.indexOf(s.sys)] = 1;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) N[i][j] += g[i] * g[j];
  }
  const Q = invert(N);
  if (!Q) return null;
  const h = Math.sqrt(Q[0][0] + Q[1][1]), v = Math.sqrt(Q[2][2]);
  return { h, v, p: Math.sqrt(h * h + v * v), n: used.length };
}

function invert(M) {
  const n = M.length, A = M.map((row, i) => [...row, ...row.map((_, j) => (i === j ? 1 : 0))]);
  for (let c = 0; c < n; c++) {
    let p = c;
    for (let r = c + 1; r < n; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
    if (Math.abs(A[p][c]) < 1e-9) return null;
    [A[c], A[p]] = [A[p], A[c]];
    const d = A[c][c];
    A[c] = A[c].map(x => x / d);
    for (let r = 0; r < n; r++) if (r !== c) { const k = A[r][c]; A[r] = A[r].map((x, j) => x - k * A[c][j]); }
  }
  return A.map(row => row.slice(n));
}

/* Карта неба: центр — зенит, край — горизонт, север вверху. Закрашен — спутник в решении, кружок — только виден.

const SKY_MASK = 15;

function skyPlot(list, size) {
  const c = size / 2, R = c - 16, rr = el => R * (90 - el) / 90;
  let svg = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block;margin:0 auto">
    <g fill="none" stroke="var(--muted)" stroke-width=".8">
      <circle cx="${c}" cy="${c}" r="${R}"/><circle cx="${c}" cy="${c}" r="${rr(30)}"/><circle cx="${c}" cy="${c}" r="${rr(60)}"/>
      <circle cx="${c}" cy="${c}" r="${rr(SKY_MASK)}" stroke-dasharray="3 3"/>

      <text x="${c}" y="10">С</text><text x="${c}" y="${size - 2}">Ю</text><text x="${size - 6}" y="${c + 4}">В</text><text x="6" y="${c + 4}">З</text>
      <text x="${c + 3}" y="${c - rr(30) + 11}" text-anchor="start" font-size="9">30°</text><text x="${c + 3}" y="${c - rr(60) + 11}" text-anchor="start" font-size="9">60°</text></g>`;

      <text x="${(x + 8).toFixed(1)}" y="${(y + 3).toFixed(1)}" font-size="9" fill="var(--ink)">${esc(String(s.svid))}</text>`;
  }

/* ───────────── Вынос в натуру: цель — точка плана, вершина или координаты; показываем куда и сколько идти ───────────── */

const STAKE_OK_M = 0.02;                                               // ближе 2 см — «на месте»
let stake = null, stakeLayer = L.layerGroup().addTo(map);
function startStake(ll, name, so) {
  stake = { ll: L.latLng(ll), name, so };
  stakeLayer.clearLayers();
  L.circleMarker(stake.ll, { radius: 9, color: '#e65100', weight: 3, fill: false, interactive: false }).addTo(stakeLayer);
  startGps(); hideCard(); closeSheet(); updateStake();
  $('stake').style.display = 'block'; layoutStake(); syncVolKeys();
}
function stopStake() { const was = stake && stake.so; stake = null; stakeLayer.clearLayers(); $('stake').style.display = 'none'; $('stake').dataset.key = ''; syncVolKeys(); if (was) drawSo(); }
function layoutStake() { $('stake').style.bottom = ($('bar').offsetHeight + 8) + 'px'; }
function updateStake() {
  if (!stake) return;
  if (stake.axis) { updateAxis(); return; }
  const t = sk42(stake.ll.lat, stake.ll.lng);
  let body;
  if (spoof) body = '<div class="big" style="color:#c62828">Подмена GPS — направление неверно</div>';
  else if (!gps || Date.now() - gps.at > GPS_FRESH_MS) body = '<div class="big">жду GPS…</div>';
  else {
    const me = sk42(gps.lat, gps.lng), az = (Math.atan2(t.y - me.y, t.x - me.x) * 180 / Math.PI + 360) % 360;   // дирекционный угол на цель (от оси X — на север, по часовой)
    const m = gkScale(midLL(L.latLng(gps.lat, gps.lng), stake.ll)), dx = (t.x - me.x) / m, dy = (t.y - me.y) / m, d = Math.hypot(dx, dy);   // сколько идти — на местности
    const here = d <= Math.max(STAKE_OK_M, gps.acc);
    body = `<div class="row"><svg width="56" height="56" viewBox="-28 -28 56 56" style="flex:none;transform:rotate(${az}deg)"><path d="M0 -24L10 8L0 2L-10 8Z" fill="${here ? '#2e7d32' : '#e65100'}"/></svg>
      <div><div class="big ${here ? 'ok' : ''}">${here ? (d <= STAKE_OK_M ? 'На месте' : 'На месте ±' + cmText(gps.acc)) : cmText(d)}</div>
      <div>${dx >= 0 ? 'на север' : 'на юг'} ${cmText(Math.abs(dx))} · ${dy >= 0 ? 'на восток' : 'на запад'} ${cmText(Math.abs(dy))}</div>
      <div style="color:var(--muted);font-size:.85em">${angText(az, L.latLng(gps.lat, gps.lng))} · GPS ±${cmText(gps.acc)}</div></div></div>`;
  }
  const sp = stake.so && soById(stake.so.id), rp = stake.redo && data.points.find(p => p.id === stake.redo.id && p.wait);
  if (stake.redo && !rp) { stopStake(); return; }                          // точку уже досняли или удалили
  if (stake.so && !sp) { stopStake(); drawSo(); return; }               // точки больше нет (вернули, сменили объект)
  const box = $('stake'), key = sp ? 'so:' + sp.id : rp ? 'redo:' + rp.id : 'pt';
  if (box.dataset.key !== key || !$('stakeInfo')) {
    box.dataset.key = key;
    box.innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:4px"><b>Вынос: ${esc(stake.name)}</b><button class="x" id="stakeStop">×</button></div><div id="stakeInfo"></div>${sp ? soButtons() : rp ? redoButtons() : ''}`;
    $('stakeStop').onclick = stopStake;
    if (sp) soPanelWire(sp);
    if (rp) redoWire(rp);
  }
  $('stakeInfo').innerHTML = `${body}${sp ? soPanel(sp) : ''}${rp ? `<div style="margin-top:4px;color:var(--muted);font-size:.85em">Поставлена на глаз при подмене. Встаньте на место и «Измерить здесь». Осталось: ${waitList().length}</div>` : ''}
    <div style="color:var(--muted);font-size:.8em;margin-top:4px">X ${f2(t.x)} Y ${f2(t.y)} — стрелка показывает направление на карте (север вверху)</div>`;
}
setInterval(updateStake, 1000);

  openForm('Вынос по координатам', [
    { key: 'x', label: 'X (на север), м', type: 'number', placeholder: '6181590.47', half: true },

/* ───────────── Разбивка для стройки: проектные точки из файла → вынос по очереди → ведомость отклонений ───────────── */

    ['Категория земель', cat ? `${cat.name}, допуск Mt ${cat.mt.toFixed(2)} м` : 'не выбрана'], ['Система координат', planeName()], [],
    ['Обозначение характерной точки', 'X, м', 'Y, м', 'Mt, м', 'Метод определения координат', 'Описание закрепления точки', 'Mt в допуске']];
  const list = r ? r.V.map(c => ({ c, p: c.pt })) : data.points.filter(isCadPt).map(p => ({ p, c: sk42(p.lat, p.lng) }));
  for (const { c, p } of list) { const mt = p ? cadMt(p) : null;
    rows.push([p ? p.name || '' : `вершина ${c.i + 1}`, c.x.toFixed(2), c.y.toFixed(2), mt != null ? mt.toFixed(2) : '', p ? cadMethod(p) : '', p ? (p.attr || {}).fix || CAD_FIX[0] : '',

  if (r) rows.push([list[0].p ? list[0].p.name || '' : 'вершина 1', list[0].c.x.toFixed(2), list[0].c.y.toFixed(2)]);   // контур замыкается на первую точку
  return sheetJoin(rows);
}
function toCadSidesSheet(r) {
  const rows = [[`Участок ${r.name || ''}`.trim(), `S = ${Math.round(r.area)}${r.dP != null ? ' ± ' + Math.round(r.dP) : ''} м²`, `периметр ${r.perim.toFixed(2)} м`], [],
    ['Обозначение части границы', 'Горизонтальное проложение (S), м', 'Дирекционный угол', 'Описание прохождения части границы']];
  for (const s of r.sides) rows.push([`${ptName(s.from)} – ${ptName(s.to)}`, s.len.toFixed(2), dms(s.az), (LINES[(s.from.line || {}).type] || {}).name || '']);

// каталог для Полигон Про и ТехноКада: «Имя;X;Y;Mt;Закрепление», 1251, без шапки (её задают в шаблоне импорта)
function toCadCatalog() {

    return [field(p.name || '', ';'), c.x.toFixed(2), c.y.toFixed(2), mt != null ? mt.toFixed(2) : '', field((p.attr || {}).fix || CAD_FIX[0], ';')].join(';'); });

/* ───────────── «Доснять по GPS»: при подмене точки ставятся касанием и ждут; сигнал вернулся — по очереди к каждой ───────────── */

const REDO_JOIN_M = 0.01;                                               // вершины линий, сидящие на точке (до 1 см), едут вместе с ней
const waitList = () => data.points.filter(p => p.wait);
function redoSheet() {
  const L0 = waitList();
  if (!L0.length) { toast('Точек, ждущих GPS, нет'); return; }
  showSheet(`<div class="sh-head"><b>Доснять по GPS: ${L0.length}</b><button class="x" data-close>×</button></div>
    <div class="hint" style="margin:4px 0 8px">Эти точки поставлены касанием во время подмены GPS — на глаз. Встаньте на каждую и нажмите «Измерить здесь»: координаты и отметка заменятся настоящими.${spoof ? '<br><b style="color:#c62828">Подмена ещё идёт — дождитесь, пока плашка GPS перестанет быть красной.</b>' : ''}</div>
    <div id="redoRows" style="max-height:44vh;overflow:auto">${L0.map((p, i) => `<div class="meas-row" data-ri="${i}" style="cursor:pointer"><span style="flex:1;min-width:0"><b>${esc(pointLabel(p) || (POINTS[p.type] || POINTS.mark).name)}</b> · № ${esc(p.no || '')}<br><small style="color:var(--muted)">поставлена ${esc(new Date(p.wait).toLocaleString('ru-RU'))}</small></span><span style="flex:none;color:var(--muted)">◎</span></div>`).join('')}</div>
    <button class="btn primary" id="redoGo" style="width:100%;margin-top:10px">Начать с первой</button>`);
  $('redoRows').onclick = e => { const r = e.target.closest('[data-ri]'); if (r) redoGo(L0[r.dataset.ri]); };
  $('redoGo').onclick = () => redoGo(L0[0]);
}
function redoGo(p) { startStake([p.lat, p.lng], 'доснять: ' + (pointLabel(p) || (POINTS[p.type] || POINTS.mark).name), null); stake.redo = { id: p.id }; $('stake').dataset.key = ''; updateStake(); }
const redoButtons = () => '<div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px;margin-top:8px"><button class="btn primary" id="redoRec">Измерить здесь</button><button class="btn" id="redoSkip">Дальше →</button><button class="btn" id="redoMenu">Список</button></div>';
function redoWire(p) { $('redoRec').onclick = () => redoRecord(p.id); $('redoSkip').onclick = () => redoNext(p.id); $('redoMenu').onclick = () => redoSheet(); }
function redoNext(id) {
  const L0 = waitList(), i = L0.findIndex(x => x.id === id), n = L0.slice(i + 1)[0] || L0.find(x => x.id !== id);
  if (n) redoGo(n); else if (L0.length) { toast('Это последняя точка, ждущая GPS'); } else { stopStake(); toast('Все точки досняты'); say('Все точки досняты'); }
}
// измерить на месте: координаты, отметка и точность — настоящие; вершины линий на этой точке переезжают вместе с ней
function redoRecord(id) {
  openMeasure((ll, meas) => {
    const p = data.points.find(x => x.id === id); if (!p) { toast('Точку удалили'); return; }
    const old = sk42(p.lat, p.lng);
    if (!p.waitSnap) for (const l of data.lines) l.latlngs.forEach((a, i) => { const c = sk42(a[0], a[1]); if (Math.hypot(c.x - old.x, c.y - old.y) > REDO_JOIN_M) return;
      l.latlngs[i] = [ll.lat, ll.lng]; if (l.hs && l.hs[i]) l.hs[i] = null; });   // отметка вершины была «на глаз» — убрать
    const moved = L.latLng(p.lat, p.lng).distanceTo(ll);
    p.lat = ll.lat; p.lng = ll.lng; p.meas = meas;
    p.q = { acc: meas.m, fix: fixKind(meas.acc), at: meas.at, src: 'measure', redone: true };
    const hz = heightFor(ll, meas, 'measure', null);
    if (hz) { if (hz.h != null) p.h = hz.h; else delete p.h; p.hSrc = hz.src; p.hInfo = { acc: hz.acc, ref: hz.ref, from: hz.from, hEll: hz.hEll, ant: antH }; }
    else { delete p.h; delete p.hSrc; delete p.hInfo; }                 // приёмник не дал высоту — старая отметка («на глаз») неверна
    delete p.wait; delete p.waitSnap;
    save(); redrawAll(); cue('ok');
    say(`Точка ${p.no || ''} доснята, сдвиг ${cmSpeech(moved)}`); toast(`Доснято: сдвиг от точки «на глаз» ${cmText(moved)}`);
    redoNext(p.id);
  });
}

/* ───────────── Журнал съёмки: все точки таблицей — как снята, точность, отметка; фильтры — ошибки видны до отъезда ───────────── */

let lastPlacedId = null;                                               // для «отменить последнюю» кнопкой громкости
const HOW_NAME = { gps: 'по GPS', measure: 'Измерить', offset: 'смещение', center: 'перекрестье', tap: 'касанием', resect: 'засечка', axisoff: 'створ', coords: 'по координатам', polar: 'расстояние и угол' };

const JOURNAL_FILTERS = [
  ['all', 'Все', () => true],
  ['tap', 'Без GPS', p => !p.q],
  ['nofix', 'Не FIX', p => p.q && p.q.fix && p.q.fix !== 'FIX'],
  ['noh', 'Без отметки', p => pointH(p) == null && !(POINTS[p.type] || {}).svgFor],
  ['spoof', 'Рядом с подменой', p => !!(journalSn.has(p) ? journalSn.get(p) : pointSpoofNote(p))],

const JOURNAL_MAX = 300;                                               // больше строк телефон рисует медленно — остальные через фильтр
function journalSheet() {
  const f = JOURNAL_FILTERS.find(x => x[0] === journalFilter) || JOURNAL_FILTERS[0];
  const counts = Object.fromEntries(JOURNAL_FILTERS.map(x => [x[0], 0])), all = data.points.slice().reverse(), list = [];
  for (const p of all) { journalSn.set(p, pointSpoofNote(p)); for (const [id, , fn] of JOURNAL_FILTERS) if (fn(p)) counts[id]++; if (f[2](p)) list.push(p); }   // один проход

    <div class="seg" id="jrnF" style="display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 8px">${JOURNAL_FILTERS.map(([id, t]) => `<button data-f="${id}" class="${id === journalFilter ? 'on' : ''}">${t} ${count(id)}</button>`).join('')}</div>
    <div id="jrnRows" style="max-height:52vh;overflow:auto">${list.length ? shown.map(p => { const s = POINTS[p.type] || POINTS.mark, H = pointH(p);
      return `<div class="meas-row" data-jid="${esc(p.id)}" style="cursor:pointer;gap:8px">${symbolSvg(pointSvg(p), 24, objColor(p, 'point'))}
        <span style="flex:1;min-width:0"><b>${esc(String(p.no || ''))}</b> ${esc(pointLabel(p) || s.name)}<br>
        <small style="color:${bad(p) ? '#c62828' : 'var(--muted)'}">${time(p)} · ${pointHow(p)}${p.q ? ` · ±${cmText(p.q.acc)} · ${esc(fixText(p.q.fix))}` : ''}${p.wait ? ' · ждёт GPS' : ''}${journalSn.get(p) ? ' · рядом с подменой' : ''}</small></span>
        <span style="flex:none;text-align:right;font-variant-numeric:tabular-nums">${H != null ? mText(H, 2) : '—'}${(p.photos || []).length ? '<br>📷' : ''}</span></div>`; }).join('')
      : '<div class="hint">Таких точек нет.</div>'}${list.length > JOURNAL_MAX ? `<div class="hint" style="margin-top:6px">Показаны ${JOURNAL_MAX} последних из ${list.length} — остальные через фильтр.</div>` : ''}</div>
    <div class="hint" style="margin-top:6px;color:var(--muted)">Нажмите строку — точка на карте. Красным — что стоит переснять или проверить «✓ Контролем».</div>`);
  $('jrnF').onclick = e => { const b = e.target.closest('[data-f]'); if (b) { journalFilter = b.dataset.f; journalSheet(); } };
  $('jrnRows').onclick = e => { const r = e.target.closest('[data-jid]'); if (!r) return; const p = data.points.find(x => x.id === r.dataset.jid); if (!p) return;
    closeSheet(); map.setView([p.lat, p.lng], Math.max(map.getZoom(), 19)); showCard('point', p); };
}

/* Перенос свойств: следующий колодец, задвижка, участок сети того же вида — с диаметром, материалом, владельцем прошлого */

function carryFrom(list, obj, keys) {
  const prev = list.slice().reverse().find(o => o !== obj && o.type === obj.type && o.attr && keys.some(k => o.attr[k] !== undefined && o.attr[k] !== ''));
  if (!prev) return null;
  const add = {}; for (const k of keys) if (prev.attr[k] !== undefined && prev.attr[k] !== '') add[k] = prev.attr[k];
  obj.attr = { ...add, ...(obj.attr || {}) };
  return prev;
}

/* ───────────── Точка по расстоянию и углу от базы (смещение): база — GPS, если свежий, иначе последняя поставленная ───────────── */
// «Идти к цели» (как в «Тактической карте»): от крестика, своего места или последней точки — на расстояние и угол.
// Угол — в градусах (90, 43°18′), тысячных (7-50); какой — дирекционный, истинный или магнитный — по настройке «Угол на цель».
// Итог: поставить точку (вершину) или только перенести крестик туда — посмотреть и уточнить
function offsetBases() {
  const fresh = gps && Date.now() - gps.at < GPS_FRESH_MS && !spoof && !gpsNoSat();   // при подмене от GPS не строим
  const lastV = mode.kind === 'line' && mode.latlngs.length ? L.latLng(mode.latlngs[mode.latlngs.length - 1]) : null;
  const lp = mode.kind === 'point' ? data.points.find(p => p.id === lastPlacedId) : null, lastP = lp ? L.latLng(lp.lat, lp.lng) : null;   // только что поставленная, не последняя в списке (после загрузки там чужая)
  return { cross: map.getCenter(), ...(fresh ? { gps: L.latLng(gps.lat, gps.lng) } : {}), ...(lastV || lastP ? { last: lastV || lastP } : {}) };
}
const OFF_BASE_NAMES = { cross: 'от крестика', gps: 'от меня (GPS)', last: 'от последней точки' };
function offsetPoint() {
  const bases = offsetBases(), keys = Object.keys(bases), kind = angCfg.kind === 'mag' && !magDeclOk ? 'true' : angCfg.kind;
  const baseSel = keys.includes(pref('offBase', 'cross')) ? pref('offBase', 'cross') : 'cross';
  openForm('Идти к цели: расстояние и угол', [
    { key: 'base', label: 'Откуда', type: 'select', value: baseSel, options: keys.map(k => [k, OFF_BASE_NAMES[k]]), half: true },
    { key: 'act', label: 'Что сделать', type: 'select', value: pref('offAct', 'place'), options: [['place', mode.kind === 'line' ? 'поставить вершину' : 'поставить точку'], ['move', 'только перенести крестик']], half: true },
    { key: 'd', label: 'Расстояние на местности, м', type: 'number', placeholder: '35.50', half: true },
    { key: 'a', label: `Угол (${ANG_KINDS[kind].name})`, placeholder: '90 · 43°18′ · 7-50', half: true,
      hint: `0 — на север, 90 — на восток, 180 — на юг, 270 — на запад. Тысячные — через дефис: 15-00 = 90°. Какой угол — в «Настройках» → «Угол на цель».` }
  ], v => {
    const d = String(v.d).trim() === '' ? NaN : parseNum(v.d), a = parseAz(v.a), base = bases[v.base] || bases.cross;
    if (!(d >= 0) || a == null) { toast('Расстояние — число, угол — градусы (90, 43°18′) или тысячные (7-50)'); return false; }
    setPref('offBase', v.base); setPref('offAct', v.act);
    // в дирекционный: истинный A → α = A − γ; магнитный M → A = M + склонение
    const dir = (((kind === 'dir' ? a : (kind === 'mag' ? a + magDecl : a) - gammaAt(base)) % 360) + 360) % 360;
    const ll = planeForward(base, d * gkScale(base), dir);              // промер на местности → на плане
    const what = `${mText(d, 2)} м, ${ANG_KINDS[kind].short} ${v.a.trim()} ${OFF_BASE_NAMES[v.base] || ''}`;
    if (v.act === 'move') { map.setView(ll, Math.max(map.getZoom(), 18), { animate: false }); toast('Крестик перенесён: ' + what + '. «+» — поставить сюда'); return; }
    // точность: от GPS — его СКО; от последней точки — её; от крестика — неизвестна («приближённо»)
    const lastPt = v.base === 'last' && mode.kind === 'point' ? data.points.find(p => p.id === lastPlacedId) : null;
    const baseAcc = v.base === 'gps' ? gps.acc : lastPt ? (lastPt.approx != null ? lastPt.approx : lastPt.q && lastPt.q.acc != null ? lastPt.q.acc : null) : null;
    const polar = { d, ang: v.a.trim(), kind, dirAng: +dir.toFixed(4), from: v.base, baseLat: base.lat, baseLng: base.lng };
    setTimeout(() => {                                                  // после закрытия формы — иначе карточка свойств колодца/арматуры тут же закроется
      const pt = addAt(ll, null, 'offset');
      if (pt && pt.lat != null) { pt.polar = polar; if (baseAcc != null) pt.approx = +baseAcc.toFixed(3); else pt.rough = true; save(); }

// Окружность (как в «Тактической карте»): центр — крестик (липнет к точке, как «+»), моё место или последняя точка;
// радиус — на местности. Сохраняется замкнутой линией из CIRCLE_N отрезков, в свойствах — центр и радиус
const CIRCLE_N = 72;                                                    // через 5° — на 1:500 при R до 50 м отличие от дуги < 5 см
function circleForm() {
  const bases = offsetBases(), snap = snapOn ? snapTarget(map.getCenter()) : null;
  if (snap) bases.cross = snap.ll;
  const keys = Object.keys(bases);
  openForm('Окружность по радиусу', [
    { key: 'base', label: 'Центр', type: 'select', value: 'cross', options: keys.map(k => [k, k === 'cross' ? (snap ? 'крестик (привязан ' + snap.what + ')' : 'крестик') : OFF_BASE_NAMES[k].replace(/^от /, '')]), half: true },
    { key: 'r', label: 'Радиус на местности, м', type: 'number', placeholder: '10', half: true },
    { key: 'cap', label: 'Подпись', placeholder: 'например «охранная зона 10 м»', hint: 'Окружность сохранится линией: её видно в выгрузках DXF и KML, к её точкам липнет крестик.' }
  ], v => {
    const r = parseNum(v.r), c = bases[v.base] || bases.cross;
    if (!(r > 0) || r > 100000) { toast('Радиус — число больше нуля'); return false; }
    const rp = r * gkScale(c), latlngs = [];
    for (let i = 0; i <= CIRCLE_N; i++) { const p = planeForward(c, rp, (i % CIRCLE_N) * 360 / CIRCLE_N); latlngs.push([p.lat, p.lng]); }   // последняя = первая — замкнута
    const line = { id: uid(), no: nextNo(data.lines), type: GENERIC.line, latlngs, caption: v.cap || `R = ${mText(r, 2)} м`, count: 1, state: '', color: pref('color', VIS_COLOR),
      attr: { circle: { r, lat: c.lat, lng: c.lng } } };
    data.lines.push(line); save(); redrawAll();
    toast(`Окружность R ${mText(r, 2)} м поставлена`);
  }, 'Поставить');
}

/* ───────────── Ручная съёмка без GPS: засечка по двум промерам, створ и перпендикуляр, рулетка ───────────── */

// Выбор точек касанием: ближняя точка или вершина плана (до 30 px) — её координаты; мимо — место касания (с предупреждением)
const PICK_PX = 30;
let pickTool = null;                                                    // { kind: 'resect'|'line'|'tape', step, A, B, names }
const pickLayer = L.layerGroup().addTo(map);
function pickNearest(ll) {
  const c = map.latLngToContainerPoint(ll); let best = null, bd = PICK_PX;
  const take = (lat, lng, name) => { const q = map.latLngToContainerPoint([lat, lng]), d = Math.hypot(q.x - c.x, q.y - c.y); if (d < bd) { bd = d; best = { ll: L.latLng(lat, lng), name }; } };
  for (const p of data.points) take(p.lat, p.lng, pointLabel(p) || ((POINTS[p.type] || POINTS.mark).name + (p.no ? ' № ' + p.no : '')));
  for (const l of data.lines) l.latlngs.forEach((a, i) => take(a[0], a[1], `L${l.no || ''}.${i + 1}`));
  if (mode && mode.latlngs) mode.latlngs.forEach((a, i) => take(a[0], a[1], 'вершина ' + (i + 1)));
  return best || { ll: L.latLng(ll), name: 'место касания', free: true };
}
const PICK_TEXT = {
  resect: ['Засечка: нажмите первую известную точку (А)', 'Нажмите вторую известную точку (Б)'],
  line: ['Створ: нажмите точку А — начало створа', 'Нажмите точку Б — направление створа'],
  tape: ['Рулетка: нажмите первую точку', 'Нажмите вторую точку']
};
function pickStart(kind) {

}

function calSolve() {

    (warn ? ' Проверьте точки — или у чертежа другие единицы. Если чертёж точный и в метрах — лучше «1:1».' : '') +
    (c.opt.swap ? ' X и Y чертежа переставлены — если чертёж лёг зеркально, отмените и уберите «Поменять X↔Y».' : ''), true, warn);

function calResultHtml(text, ok, oneToOneFirst, checked, bad) {

    (ok ? `<button class="btn${pr(!oneToOneFirst)}" data-cal="place">Положить с растяжкой</button><button class="btn${pr(oneToOneFirst)}" data-cal="place1">Положить 1:1</button><button class="btn" data-cal="check">${checked ? 'Проверить ещё раз' : 'Проверить 3-й точкой'}</button>` : '') +

// подобие для укладки: «с растяжкой» — точно по двум точкам; «1:1» — масштаб чертежа (метры), поворот по точкам, середина между точками совпадает

    const ch = new DataView(new ArrayBuffer(46));
    [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [10, 0, 2], [12, dosTime, 2], [14, dosDate, 2], [16, crc, 4], [20, size, 4], [24, size, 4], [28, name.length, 2], [30, 0, 2], [32, 0, 2], [34, 0, 2], [36, 0, 2], [38, 0, 4], [42, offset, 4]]
      .forEach(([o, v, n]) => n === 4 ? ch.setUint32(o, v, true) : ch.setUint16(o, v, true));

}

    toast(`${what}: знаков ${add.points.length}, линий ${add.lines.length}` + (nPh ? `, фото ${nPh}` : '') + (add.bad ? `, пропущено повреждённых: ${add.bad}` : '') + (nDup && mode === 'new' ? `, уже были на плане: ${nDup}` : ''));
  };
  if (!nDup) { await done('new'); return; }
  showSheet(`<div class="sh-head"><b>${esc(what)}</b><button class="x" data-close>×</button></div>
    <div class="hint" style="margin:4px 0 12px">В файле объектов: ${total}. Из них уже есть на плане: <b>${nDup}</b> — видимо, этот файл уже загружали.</div>
    <div style="display:grid;gap:6px"><button class="btn primary" data-mode="new">Загрузить только новые (${total - nDup})</button>
    <button class="btn" data-mode="replace">Совпадающие заменить из файла</button>
    <button class="btn" data-mode="all">Загрузить всё — совпадающие копиями</button><button class="btn" data-close>Отмена</button></div>`);
  $('sheet').querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { closeSheet(); done(b.dataset.mode).catch(e => alert('Не удалось загрузить: ' + e.message)); });
}
// фото из архива — в базу фото телефона (только те, на которые ссылаются объекты)
async function putPhotos(add, photos) {
  if (!photos) return 0;
  let n = 0;
  for (const o of [...add.points, ...add.lines]) for (const id of o.photos || []) {
    const bytes = photos.files[id];
    if (!bytes) continue;
    const meta = (photos.meta && photos.meta[id]) || {};
    try { await photoPut({ at: new Date().toISOString(), lat: null, lng: null, heading: null, ...meta, id, obj: o.id, blob: new Blob([bytes], { type: 'image/jpeg' }) }); n++; } catch (e) { /* без этого фото */ }
  }
  return n;
}
// фото в архиве: …/photo_<id>.jpg → { files: { id → байты }, meta }
function zipPhotos(files) {
  const out = {};
  for (const [name, bytes] of Object.entries(files)) { const m = /(?:^|\/)photo_([\w-]+)\.jpe?g$/i.exec(name); if (m && m[1] !== '__proto__') out[m[1]] = bytes; }   // «__proto__» в имени не подменит прототип
  let meta = null;
  try { meta = files['photos.json'] ? JSON.parse(new TextDecoder().decode(files['photos.json'])) : null; } catch (e) { /* без подробностей о снимках */ }
  return { files: out, meta };
}
$('fileIn').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const u8 = new Uint8Array(await f.arrayBuffer());
    if (u8[0] === 0x50 && u8[1] === 0x4b) {                           // ZIP: KMZ или полная копия плана
      const files = await readZip(u8), dec = new TextDecoder();
      if (files['plan.json']) { await restoreBackup(JSON.parse(dec.decode(files['plan.json'])), zipPhotos(files)); return; }
      const kml = Object.keys(files).find(n => /\.kml$/i.test(n));
      if (!kml) throw new Error('в архиве нет KML');
      await importObjects(parseKml(dec.decode(files[kml])), zipPhotos(files), 'Загружено из KMZ');
      return;
    }
    const text = new TextDecoder().decode(u8).replace(/^﻿/, '');
    if (text.trimStart().startsWith('{')) { await restoreBackup(JSON.parse(text), null); return; }
    await importObjects(parseKml(text), null, 'Загружено из KML');
  } catch (err) { alert('Не удалось загрузить файл: ' + err.message); }
};

/* ───────────── Слой: сетка СК-42 (кресты, как на планшете) ───────────── */

const GRID_STEPS = [10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000];
const GRID_MIN_PX = 120;         // кресты не чаще, чем через 120 пикселей — чтобы поместились подписи
const GRID_ARM = 0.1;            // половина креста — 10 % шага сетки, кресты растут вместе с картой
const GRID_COLOR = '#2e7d32';    // кресты — зелёные
const GRID_LINE_COLOR = '#66bb6a';
const GRID_KEY = 'tk.grid';
const GRID_MAX_CROSSES = 400;    // предохранитель: больше крестов на экране не рисуем
const GridLayer = L.Layer.extend({
  onAdd(m) {
    this._group = L.layerGroup().addTo(m);
    // свой SVG-слой: Leaflet растягивает его при приближении пальцами — вместе с ним растут и кресты, и подписи
    this._renderer = this._renderer || L.svg({ padding: 0.5 });
    // перерисовка — из frame(), после знаков и линий: подписи сетки встают только на свободные места
    this._draw();
    try { localStorage.setItem(GRID_KEY, '1'); } catch (e) { /* не критично */ }
  },
  onRemove(m) {
    m.off('moveend zoomend resize', this._draw, this);
    m.removeLayer(this._group);
    if (this._labels) { this._labels.remove(); this._labels = null; }
    try { localStorage.setItem(GRID_KEY, '0'); } catch (e) { /* не критично */ }
  },
  _draw() {
    const m = this._map, size = m.getSize(), group = this._group;
    group.clearLayers();
    if (this._labels) { this._labels.remove(); this._labels = null; }
    const zone = zoneOf(m.getCenter().lng);
    const toGk = p => { const ll = m.containerPointToLatLng(p); const [y, x] = proj4('WGS84', gkDef(zone), [ll.lng, ll.lat]); return { x, y }; };
    const corners = [[0, 0], [size.x, 0], [0, size.y], [size.x, size.y]].map(toGk);
    const minX = Math.min(...corners.map(c => c.x)), maxX = Math.max(...corners.map(c => c.x));
    const minY = Math.min(...corners.map(c => c.y)), maxY = Math.max(...corners.map(c => c.y));
    const mPerPx = (maxY - minY) / size.x;
    const step = GRID_STEPS.find(s => s / mPerPx >= GRID_MIN_PX);
    if (!step) return;                                                   // мельче ~1:300 000 сетку не рисуем (и проекция зоны там уже неточна)
    if (((maxX - minX) / step + 2) * ((maxY - minY) / step + 2) > GRID_MAX_CROSSES) return;
    const spacingPx = step / mPerPx, arm = step * GRID_ARM, armPx = arm / mPerPx;
    const fontPx = Math.max(10.5, Math.min(13, spacingPx * 0.075));     // текст тоже растёт с масштабом, но остаётся «чертёжным»
    const fmt = v => String(Math.round(v));                             // слитно, как координаты сверху
    // как на планшетах: полная подпись — по одной линии X и Y (ближайшие к середине экрана), остальные — последние 5 цифр («…74700»)
    const mid = toGk(m.getSize().divideBy(2)), fullX = Math.round(mid.x / step) * step, fullY = Math.round(mid.y / step) * step;
    const lbl = (v, full) => step >= 100000 || v === full ? fmt(v) : "…" + (v < 0 ? "−" : "") + String(Math.abs(Math.round(v)) % 100000).padStart(5, "0");
    const ll = (x, y) => { const p = fromSk42(x, y, zone); return [p.lat, p.lng]; };
    const x0 = Math.floor(minX / step) * step, y0 = Math.floor(minY / step) * step;
    const x1 = Math.ceil(maxX / step) * step, y1 = Math.ceil(maxY / step) * step;
    const SAMPLES = 8, gridLines = [], segs = [];
    for (let x = x0; x <= x1; x += step) { const l = []; for (let i = 0; i <= SAMPLES; i++) l.push(ll(x, y0 + (y1 - y0) * i / SAMPLES)); gridLines.push(l); }
    for (let y = y0; y <= y1; y += step) { const l = []; for (let i = 0; i <= SAMPLES; i++) l.push(ll(x0 + (x1 - x0) * i / SAMPLES, y)); gridLines.push(l); }
    const gap = armPx + 4, labels = [];
    for (let x = Math.ceil(minX / step) * step; x <= maxX; x += step) {
      for (let y = Math.ceil(minY / step) * step; y <= maxY; y += step) {
        segs.push([ll(x, y - arm), ll(x, y + arm)], [ll(x - arm, y), ll(x + arm, y)]);
        // точка креста в координатах слоя и наклон креста (сближение меридианов) — подписи идут параллельно его чертам
        const c = m.latLngToLayerPoint(ll(x, y)), a = m.latLngToLayerPoint(ll(x, y - arm)), b = m.latLngToLayerPoint(ll(x, y + arm));
        labels.push({ c, deg: Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI, x, y });
      }
    }
    // линии и кресты — векторные линии в том же SVG-слое, что и подписи
    const night = document.body.classList.contains('night'), r = this._renderer;
    L.polyline(gridLines, { renderer: r, color: night ? '#4caf50' : GRID_LINE_COLOR, weight: 0.6, opacity: 0.22, interactive: false }).addTo(group);
    L.polyline(segs, { renderer: r, color: night ? '#81c784' : GRID_COLOR, weight: 1.3, opacity: 0.8, interactive: false }).addTo(group);
    // X — горизонтально над правой чертой креста; Y — вертикально над верхней чертой (читается снизу вверх, текст над линией)
    const g = this._labels = el('g', { class: 'gtxt', 'font-size': fontPx.toFixed(1) }, r._rootGroup);
    const t = (tr, str) => { el('text', { transform: tr, x: gap.toFixed(1), y: -3 }, g).textContent = str; };
    // подписи сетки — последними и только на свободные места: знаки, линии и их надписи важнее
    const fh = fontPx + 2;
    const PAD = 3;                                                     // запас на нижние выносные элементы букв и белую обводку
    const doneX = new Set(), doneY = new Set();
    // плашки поверх карты (верхняя строка, нижняя панель, масштаб, кнопки, авторство) — подпись под ними не видна, не ставим
    const mr = m.getContainer().getBoundingClientRect(), ui = [...document.querySelectorAll('#top, #bar, #scale, #fabs, .leaflet-control-zoom, .leaflet-control-attribution, #fabCompass, #fabUndo, #fabRedo, #fabPlus')]
      .map(e => e.getBoundingClientRect()).filter(b => b.width > 0 && b.height > 0).map(b => ({ x: b.left - mr.left, y: b.top - mr.top, w: b.width, h: b.height }));
    const underUi = q => ui.some(u => q.x < u.x + u.w && q.x + q.w > u.x && q.y < u.y + u.h && q.y + q.h > u.y);
    for (const { c, deg, x, y } of labels.slice().sort((p, q) => p.y - q.y)) {   // X — с запада (слева), одна на линию
      if (doneX.has(x)) continue;
      const cc = m.layerPointToContainerPoint(c), sx = 'X – ' + lbl(x, fullX), wx = textWidth(sx, fontPx, true) + 2;
      const bx = { x: cc.x + gap - PAD, y: cc.y - 3 - fh - PAD, w: wx + 2 * PAD, h: fh + 2 * PAD + 2 };
      if (cc.x < 0 || cc.x + gap + wx > size.x || cc.y < fh + 4 || underUi(bx) || hits(bx, null)) continue;
      t(`translate(${c.x.toFixed(1)} ${c.y.toFixed(1)}) rotate(${deg.toFixed(2)})`, sx); doneX.add(x);
    }
    for (const { c, deg, x, y } of labels.slice().sort((p, q) => p.x - q.x)) {   // Y — с юга (снизу), одна на линию
      if (doneY.has(y)) continue;
      const cc = m.layerPointToContainerPoint(c), sy = 'Y – ' + lbl(y, fullY), wy = textWidth(sy, fontPx, true) + 2;
      const by = { x: cc.x - 3 - fh - PAD, y: cc.y - gap - wy - PAD, w: fh + 2 * PAD + 2, h: wy + 2 * PAD };
      if (cc.y > size.y || cc.y - gap - wy < 0 || cc.x < fh + 4 || underUi(by) || hits(by, null)) continue;
      t(`translate(${c.x.toFixed(1)} ${c.y.toFixed(1)}) rotate(${(deg - 90).toFixed(2)})`, sy); doneY.add(y);
    }
  }
});
const gridLayer = new GridLayer();
layersControl.addOverlay(gridLayer, 'Сетка СК-42');
let gridWanted = true;           // сетка включена сразу, пока её не выключили
try { gridWanted = localStorage.getItem(GRID_KEY) !== '0'; } catch (e) { /* по умолчанию — включена */ }
if (gridWanted) gridLayer.addTo(map);

/* ───────────── Свои растры: план, ортофото, скан (по углам в СК-42) ───────────── */

map.createPane('rasterPane').style.zIndex = 300;
const RASTER_OPACITY = 0.7;
const RasterLayer = L.Layer.extend({
  initialize(r) { this.r = r; },                      // r: { id, name, blob, tl, tr, bl: [lat, lng], opacity }
  onAdd(m) {
    const img = this._img = document.createElement('img');
    img.style.cssText = 'position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;';
    img.style.opacity = this.r.opacity || RASTER_OPACITY;
    img.onload = () => this._place();
    img.src = this._url = URL.createObjectURL(this.r.blob);
    m.getPane('rasterPane').appendChild(img);
    m.on('zoomend viewreset resize', this._place, this);
    m.on('zoomanim', this._anim, this);
  },
  onRemove(m) {
    m.off('zoomend viewreset resize', this._place, this);
    m.off('zoomanim', this._anim, this);
    this._img.remove(); URL.revokeObjectURL(this._url);
  },
  setOpacity(o) { this.r.opacity = o; if (this._img) this._img.style.opacity = o; },
  _anim(e) { this._place(ll => this._map._latLngToNewLayerPoint(ll, e.zoom, e.center)); },
  _place(toPoint) {
    const img = this._img, m = this._map, w = img.naturalWidth, h = img.naturalHeight;
    if (!w || !h) return;
    const pt = typeof toPoint === 'function' ? toPoint : ll => m.latLngToLayerPoint(ll);
    const p0 = pt(this.r.tl), p1 = pt(this.r.tr), p2 = pt(this.r.bl);
    // аффинное преобразование: угол (0,0) → TL, (w,0) → TR, (0,h) → BL — учитывает поворот сетки СК-42 к меридиану
    img.style.transform = `matrix(${(p1.x - p0.x) / w},${(p1.y - p0.y) / w},${(p2.x - p0.x) / h},${(p2.y - p0.y) / h},${p0.x},${p0.y})`;
    img.style.visibility = 'visible';
  }
});

// Хранение растров в IndexedDB (картинки слишком велики для localStorage)
const rasterDb = new Promise(resolve => {
  try {
    const req = indexedDB.open('tk-rasters', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('rasters', { keyPath: 'id' });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
  } catch (e) { resolve(null); }
});
async function rasterStore(mode, fn) {
  const db = await rasterDb;
  if (!db) return null;
  return new Promise((resolve, reject) => {
    const tx = db.transaction('rasters', mode), req = fn(tx.objectStore('rasters'));
    tx.oncomplete = () => resolve(req && req.result);
    tx.onerror = tx.onabort = () => reject(tx.error || new Error('запись прервана'));
  });
}
const rasterLayers = {};
function showRaster(r) {
  const layer = rasterLayers[r.id] = new RasterLayer(r);
  layer.addTo(map);
  layersControl.addOverlay(layer, 'Растр: ' + esc(r.name));
}
async function loadRasters() {
  try { const all = await rasterStore('readonly', s => s.getAll()); (all || []).forEach(showRaster); }
  catch (e) { toast('Не удалось открыть сохранённые растры'); }
}
// «5892500 6662500» или «5 892 500; 6 662 500» (пробелы внутри числа — только с точкой с запятой между X и Y)
function parseXY(v) {
  const parts = v.includes(';') ? v.split(';') : v.trim().split(/\s+/);
  const nums = parts.filter(s => s.trim() !== '').map(parseNum);
  return nums.length === 2 && !nums.some(isNaN) ? nums : null;
}
const rasterInput = document.createElement('input');
rasterInput.type = 'file'; rasterInput.accept = 'image/png,image/jpeg,image/webp'; rasterInput.style.display = 'none';
document.body.appendChild(rasterInput);
rasterInput.onchange = e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  const c = sk42(map.getCenter().lat, map.getCenter().lng);
  openForm('Привязка растра: ' + f.name, [
    { key: 'tl', label: 'Левый верхний угол — X Y, м', value: `${Math.round(c.x)} ${Math.round(c.y)}`, hint: 'Два числа через пробел, например 5892500 6662500' },
    { key: 'br', label: 'Правый нижний угол — X Y, м', value: `${Math.round(c.x) - 500} ${Math.round(c.y) + 500}` },
    { key: 'zone', label: crs().zoned ? 'Зона ' + planeName() : 'Зона (для МСК не нужна)', type: 'number', value: c.zone, hint: `Картинка должна быть выровнена по сетке ${planeName()}: север вверху.` }
  ], v => {
    const tl = parseXY(v.tl), br = parseXY(v.br), zone = crs().zoned ? parseInt(v.zone, 10) : 0;
    if (!tl || !br) { toast('Нужно два числа: X и Y'); return false; }
    if (!(tl[0] > br[0] && br[1] > tl[1])) { toast('У левого верхнего угла X больше, а Y меньше, чем у правого нижнего'); return false; }
    if (crs().zoned && !(zone > 0 && zone < 61)) { toast('Зона — число от 1 до 60'); return false; }
    const ll = (x, y) => { const p = fromSk42(x, y, zone); return [p.lat, p.lng]; };
    const r = { id: uid(), name: f.name, blob: f, tl: ll(tl[0], tl[1]), tr: ll(tl[0], br[1]), bl: ll(br[0], tl[1]), opacity: RASTER_OPACITY };
    rasterStore('readwrite', s => s.put(r)).catch(() => toast('Растр показан, но не сохранён на телефоне'));
    showRaster(r);
    map.fitBounds([r.tl, r.tr, r.bl], { padding: [30, 30] });
    toast('Растр наложен. Включать и выключать — кнопкой «Слои»');
  }, 'Наложить');
};
function rasterMenu() {
  const ids = Object.keys(rasterLayers);
  if (!ids.length) { toast('Своих растров пока нет'); return; }
  openList('Свои растры', ids.flatMap(id => {
    const r = rasterLayers[id].r;
    return [{ header: r.name }, { id: 'op:' + id, icon: '◐', text: `Прозрачность ${Math.round((1 - (r.opacity || RASTER_OPACITY)) * 100)} % — нажмите, чтобы изменить` },
      { id: 'del:' + id, icon: '🗑', text: 'Удалить растр' }];
  }), async pick => {
    const [act, id] = pick.split(':'), layer = rasterLayers[id];
    if (!layer) return;
    if (act === 'op') {
      const o = { 0.5: 0.7, 0.7: 0.9, 0.9: 1, 1: 0.5 }[layer.r.opacity || RASTER_OPACITY] || RASTER_OPACITY;
      layer.setOpacity(o);
      try { await rasterStore('readwrite', s => s.put(layer.r)); } catch (e) { /* не критично */ }
      toast('Прозрачность ' + Math.round((1 - o) * 100) + ' %');
      rasterMenu();
    }
    if (act === 'del' && confirm('Удалить растр «' + layer.r.name + '»?')) {
      map.removeLayer(layer); layersControl.removeLayer(layer); delete rasterLayers[id];
      try { await rasterStore('readwrite', s => s.delete(id)); } catch (e) { /* уже убран с карты */ }
    }
  });
}

/* ───────────── Старт ───────────── */

ready = true; updateAim();                                            // вторая строка вверху — сразу, не дожидаясь движения карты
loadGeoid().catch(() => { /* без сети и кэша — попробуем при съёмке */ });
if (NATIVE) { startGnss(); startGps(); checkUpdate(); if (RX && rxCfg.auto) rxConnect(); }   // в Android-приложении спутники и GPS включаются сразу, проверяется обновление
// вернулись в приложение (из другого окна, после сна телефона) — ещё раз проверить обновление, перезапускать не нужно
if (NATIVE) document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
if (NATIVE) { setInterval(checkUpdate, UPDATE_EVERY_MS); addEventListener('online', () => checkUpdate()); }
// на сайте — фоновый помощник, чтобы приложение открывалось без интернета (в Android-приложении всё и так внутри)
if (!NATIVE && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { /* без него просто нужен интернет */ });
redrawAll();
updateInfo();
layout();                                            // после updateInfo: плашка уже с координатами и своей настоящей высотой
window.addEventListener('resize', layout);
// плашка меняет высоту (WGS / СК-42 / оба, длинная строка GPS) — кнопки и подсказки сдвигаются следом
if (window.ResizeObserver) new ResizeObserver(layout).observe($('top'));
loadRasters();
if (data.points.length || data.lines.length) MENU.fit();
</script>
