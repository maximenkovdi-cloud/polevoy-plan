<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1f5fbf">
<title>Полевой план</title>
<!-- библиотеки лежат рядом (lib/), чтобы приложение открывалось без интернета: Leaflet 1.9.4 (BSD-2), proj4 2.11.0 (MIT) -->
<link rel="stylesheet" href="lib/leaflet.min.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,400;0,500;1,400;1,500&display=swap">
<script src="lib/leaflet.min.js"></script>
<script src="lib/proj4.js"></script>
<style>
  /* ── темы: день / солнце / ночь ── */
  body.day   { --bg:#f4f1e8; --panel:#ffffff; --ink:#151515; --muted:#5d5d5d; --line:#d9d6cc; --accent:#1f5fbf; --accentInk:#fff; --red:#c62828; --sym:#111111; --symBg:#ffffff; --halo:#ffffff; --shadow:0 1px 6px rgba(0,0,0,.18); --fs:14px; }
  body.sun   { --bg:#ffffff; --panel:#ffffff; --ink:#000000; --muted:#222222; --line:#000000; --accent:#0039a6; --accentInk:#fff; --red:#b00000; --sym:#000000; --symBg:#ffffff; --halo:#ffffff; --shadow:0 0 0 2px #000; --fs:15.5px; }
  body.night { --bg:#1c2127; --panel:#262c33; --ink:#e9edf1; --muted:#9aa5b1; --line:#38414b; --accent:#5aa2ff; --accentInk:#0d1117; --red:#ff6b6b; --sym:#e9edf1; --symBg:#1c2127; --halo:#1c2127; --shadow:0 1px 8px rgba(0,0,0,.5); --fs:14px; }
  /* традиционные цвета сетей («Правила начертания…», п. 6 — по дополнительным требованиям) */
  /* чертёжный шрифт подписей на плане: узкий наклонный, как по ГОСТ 2.304 */
  body { --draft:"Roboto Condensed","Arial Narrow",Arial,sans-serif; }
  body { --c-water:#1565c0; --c-sewer:#6d4c41; --c-heat:#8e24aa; --c-gas:#ef8f00; --c-el:#d32f2f; --c-comm:#2e7d32; --c-own:#7b1fa2; }
  body.night { --c-water:#64b5f6; --c-sewer:#bcaaa4; --c-heat:#ce93d8; --c-gas:#ffb74d; --c-el:#ff6b6b; --c-comm:#81c784; --c-own:#ce93d8; }
  /* рельеф по ГКИНП — коричневым (горизонтали, откосы, обрывы); ночью светлее, на солнце темнее */
  body { --rel:#8a4b1c; } body.sun { --rel:#5e2e0c; } body.night { --rel:#d6a06e; }
  body { --veg:#2e7d32; } body.sun { --veg:#1b5e20; } body.night { --veg:#81c784; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; background:var(--bg); font:var(--fs)/1.35 system-ui, "Segoe UI", Roboto, sans-serif; color:var(--ink); }
  #map { position:absolute; inset:0; background:var(--bg); }
  .leaflet-tile-pane { opacity:var(--baseOp, .7); }
  body.day .leaflet-tile-pane { filter: saturate(.6); }
  body.night .leaflet-tile-pane { filter: brightness(.55) contrast(1.15) saturate(.55); }
  body.sun .leaflet-tile-pane { filter: contrast(1.2) saturate(1.1); }
  button { font:inherit; color:inherit; }

  /* ── верхняя плашка координат ── */
  #top { position:absolute; left:8px; right:8px; top:8px; z-index:1000; background:var(--panel); color:var(--ink); border-radius:14px; padding:6px 8px; box-shadow:var(--shadow); font-variant-numeric:tabular-nums;
    display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
  #top .r1 { display:none; }                                         /* система координат — касанием по координатам */
  #coords { flex:1 1 130px; min-width:0; cursor:pointer; }
  #coords .xy .nw { white-space:nowrap; }
  #coords .xy { margin:0; font-size:14px; line-height:1.25; white-space:normal; }
  #top > #updLine { flex-basis:100%; }
  .seg { display:flex; background:var(--line); border-radius:9px; padding:2px; }
  body.sun .seg { background:#fff; border:2px solid #000; }
  .seg button { border:0; background:none; padding:7px 12px; min-height:36px; border-radius:7px; color:var(--muted); font-size:14px; }
  .seg button.on { background:var(--panel); color:var(--ink); font-weight:700; }
  body.sun .seg button.on { background:#000; color:#fff; }
  #zone { font-size:12px; color:var(--muted); }
  .xy { font-size:1.08em; font-weight:700; margin-top:4px; letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .xy small { font-weight:400; color:var(--muted); font-size:.75em; }
  #gpsRow { display:flex; align-items:stretch; gap:6px; flex:0 1 auto; min-width:0; }
  #gpsLine { min-width:0; max-width:190px; min-height:44px; display:flex; align-items:center; gap:6px; font-size:14px; font-weight:700; padding:4px 10px; border-radius:10px; background:var(--line); color:var(--ink); cursor:pointer; }
  #antChip { min-height:44px; }
  body.glove #gpsLine, body.glove #antChip { min-height:56px; }
  #gpsLine #gpsText { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #gpsLine[data-st=fix] { background:#2e7d32; color:#fff; } #gpsLine[data-st=float] { background:#f9a825; color:#1b1b1b; }
  #gpsLine[data-st=phone] { background:#cfd8dc; color:#1b1b1b; } #gpsLine[data-st=bad], #gpsLine[data-st=spoof] { background:#c62828; color:#fff; }
  #gpsLine[data-st=fix] .dot, #gpsLine[data-st=bad] .dot, #gpsLine[data-st=spoof] .dot { background:#fff; }
  #antChip { flex:none; min-width:64px; border:2px solid var(--line); border-radius:9px; background:var(--panel); font-weight:700; font-size:14px; padding:4px 8px; }
  body.night #gpsLine[data-st=phone] { background:#455a64; color:#fff; }
  #updLine { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:6px; padding:6px 8px; border-radius:10px;
    background:color-mix(in srgb, var(--accent) 14%, transparent); font-size:13px; }
  #updLine .btn { min-height:34px; padding:6px 14px; }
  #spoofLine { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:6px; padding:6px 8px; border-radius:10px; background:#c62828; color:#fff; font-size:13px; font-weight:600; }
  #spoofLine .btn { min-height:34px; padding:6px 12px; flex:none; }
  #spoofLine { display:none !important; }                           /* подмена — красной плашкой GPS, подробности по касанию */
  #satLine { display:none !important; }                             /* спутники — внутри плашки GPS, таблица по касанию */
  #satLine.unused { display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink); margin-top:3px; cursor:pointer; white-space:nowrap; overflow:hidden; }
  #satLine #satText { overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
  #satLine .more { color:var(--muted); margin-left:auto; }
  .sat-tab { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; margin-top:4px; }
  .sat-tab th, .sat-tab td { padding:9px 6px; border-bottom:1px solid var(--line); text-align:right; }
  .sat-tab th:first-child, .sat-tab td:first-child { text-align:left; }
  .sat-tab th { color:var(--muted); font-weight:500; font-size:12.5px; }
  .sat-tab tr.sum td { font-weight:700; }
  .dop { display:flex; align-items:center; gap:7px; margin:2px 0 8px; font-variant-numeric:tabular-nums; }
  .meas-big { font-size:2em; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.1; }
  .meas-live { min-height:84px; }
  .meas-sub { color:var(--muted); font-size:.85em; margin-top:4px; }
  .meas-h { font-size:1.15em; font-weight:700; margin-top:6px; } .meas-h span { font-weight:400; color:var(--muted); font-size:.85em; }
  .meas-sum { width:100%; text-align:left; border:1px solid var(--line); background:none; color:var(--ink); border-radius:12px; padding:10px 12px; margin-top:8px; min-height:44px; font-size:.95em; }
  .meas-sum .pen { float:right; color:var(--accent); }
  .meas-verdict { border-radius:12px; padding:10px 12px; margin:6px 0; font-weight:600; }
  .meas-verdict.ok { background:color-mix(in srgb, #2e7d32 15%, transparent); }
  .meas-verdict.mid { background:color-mix(in srgb, #f9a825 20%, transparent); }
  .meas-verdict.bad { background:color-mix(in srgb, #c62828 15%, transparent); }
  .meas-row { display:flex; gap:8px; align-items:center; margin:8px 0; flex-wrap:wrap; }
  .meas-row > span { color:var(--muted); font-size:13px; min-width:92px; }
  .meas-row .seg { flex-wrap:wrap; }
  .dot { width:9px; height:9px; border-radius:50%; background:#9e9e9e; flex:none; }
  .dot.ok { background:#2e7d32; } .dot.mid { background:#f9a825; } .dot.bad { background:#c62828; }

  /* ── перекрестье ── */
  #cross { position:absolute; left:50%; top:50%; width:34px; height:34px; margin:-17px 0 0 -17px; z-index:900; pointer-events:none; }

  /* ── круглые кнопки справа ── */
  #fabs { position:absolute; right:10px; z-index:1000; display:flex; flex-direction:column; gap:10px; }
  .fab { width:50px; height:50px; border-radius:50%; border:0; background:var(--panel); color:var(--ink); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow); }
  .fab svg { width:26px; height:26px; }
  .fab.on { background:var(--accent); color:var(--accentInk); }

  /* ── масштаб ── */
  #scale { position:absolute; left:10px; z-index:1000; background:var(--panel); color:var(--ink); border-radius:10px; padding:7px 11px 7px; font-size:13px; font-weight:700; box-shadow:var(--shadow); cursor:pointer; }
  #scale i { display:block; height:5px; border:2px solid var(--ink); border-top:0; margin-top:3px; }

  /* ── нижняя панель ── */
  #bar { position:absolute; left:0; right:0; bottom:0; z-index:1000; background:var(--panel); display:flex; justify-content:space-around; padding:8px 4px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); }
  body.sun #bar { border-top:2px solid #000; }
  #bar button { border:0; background:none; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--muted); font-size:12.5px; width:72px; padding:0; }
  #bar .ic { width:56px; height:36px; border-radius:18px; display:flex; align-items:center; justify-content:center; }
  #bar svg { width:26px; height:26px; }
  #bar button.on { color:var(--ink); font-weight:700; }
  #bar button.on .ic { background:color-mix(in srgb, var(--accent) 22%, transparent); color:var(--accent); }

  /* ── панель режима (ставим знак / рисуем линию) ── */
  #mode { position:absolute; left:8px; right:8px; z-index:1000; background:var(--panel); color:var(--ink); border-radius:16px; box-shadow:var(--shadow); padding:10px 12px; display:none; }
  #mode { padding:8px 8px 10px; }
  #mode .hd { display:flex; align-items:center; gap:6px; margin-bottom:8px; min-width:0; }
  #mode .title { display:flex; align-items:center; gap:6px; font-weight:700; flex:none; white-space:nowrap; }
  #mode .mx { flex:none; width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:var(--panel); color:var(--ink); font-size:22px; line-height:1; }
  body.glove #mode .mx { width:52px; height:52px; }
  #mode .btn.off { opacity:.45; }
  #mode .title svg { flex:none; }
  #mode .btns { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
  #mode .quick { display:flex; gap:6px; overflow-x:auto; flex:1; min-width:0; }
  #mode .quick button { flex:none; display:flex; align-items:center; gap:4px; min-height:40px; padding:4px 10px; border:1px solid var(--line); border-radius:22px; background:var(--panel); color:var(--ink); font-size:12px; max-width:150px; }
  #mode .quick button span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #mode .quick button.on { border:2px solid var(--accent); font-weight:700; }
  #stake { position:absolute; left:8px; right:8px; z-index:1000; background:var(--panel); color:var(--ink); border-radius:16px; box-shadow:var(--shadow); padding:10px 12px; display:none; }
  #pick { position:absolute; left:8px; right:8px; z-index:1001; background:var(--panel); color:var(--ink); border-radius:16px; box-shadow:var(--shadow); padding:10px 12px; display:none; }
  #pick .row { display:flex; align-items:center; }
  .pick-mk { position:relative; } .pick-mk svg { position:absolute; left:0; top:0; } .pick-mk span { position:absolute; left:24px; top:4px; font:700 15px system-ui; color:#e65100; text-shadow:0 0 3px #fff, 0 0 3px #fff; white-space:nowrap; }
  #stake .big { font-size:1.9em; font-weight:700; font-variant-numeric:tabular-nums; }
  #stake .row { display:flex; gap:10px; align-items:center; }
  #stake .ok { color:#2e7d32; }
  .btn { border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:12px; padding:11px 6px; font-weight:600; font-size:.95em; min-height:46px; }
  body.sun .btn { border:2px solid #000; }
  .btn.primary { background:var(--accent); color:var(--accentInk); border-color:var(--accent); }
  .btn.danger { color:var(--red); }
  .btn.on { border-color:var(--accent); color:var(--accent); }
  .rubber-lbl span { position:absolute; transform:translate(-50%, -150%); white-space:nowrap; font:700 14px/1 var(--draft); color:var(--ink); background:var(--panel); border:1px solid var(--ink); padding:3px 6px; border-radius:10px; }

  /* ── нижние листы ── */
  #sheet { position:absolute; inset:0; z-index:2000; background:rgba(0,0,0,.38); display:none; }
  #sheet .panel { position:absolute; left:0; right:0; bottom:0; max-height:82%; overflow:auto; background:var(--panel); color:var(--ink); border-radius:18px 18px 0 0; padding:10px 12px calc(20px + env(safe-area-inset-bottom)); }
  .grab { width:40px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 10px; }
  .sh-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .sh-head b { font-size:1.1em; }
  /* масштаб «+/−» — крупно и в том же стиле, что круглые кнопки справа */
  .leaflet-control-zoom { border:0 !important; box-shadow:var(--shadow) !important; border-radius:14px !important; overflow:hidden; }
  .leaflet-control-zoom a { width:50px !important; height:50px !important; line-height:50px !important; font-size:26px !important; background:var(--panel) !important; color:var(--ink) !important; }
  .x { border:0; background:var(--line); color:var(--ink); width:44px; height:44px; border-radius:50%; font-size:20px; line-height:1; flex:none; }
  body.sun .x { background:#fff; color:#000; border:2px solid #000; }
  .search { display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:12px; padding:0 10px; color:var(--muted); }
  body.sun .search { border:2px solid #000; }
  .search input { flex:1; border:0; outline:0; background:none; color:var(--ink); font:inherit; padding:11px 0; }
  .tabs { display:flex; gap:6px; margin:10px 0 6px; overflow-x:auto; padding-bottom:2px; }
  .tabs button { flex:none; border:1px solid var(--line); background:none; color:var(--muted); font-size:13px; padding:7px 12px; border-radius:16px; }
  .tabs button.on { background:var(--accent); color:var(--accentInk); border-color:var(--accent); font-weight:700; }
  .h { font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:12px 2px 6px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill, minmax(78px, 1fr)); gap:7px; }
  .tile { border:1px solid var(--line); background:none; color:var(--ink); border-radius:13px; padding:9px 3px 7px; display:flex; flex-direction:column; align-items:center; gap:5px; text-align:center; font-size:11px; line-height:1.15; min-height:84px; min-width:0; }
  .tile span { max-width:100%; hyphens:manual; -webkit-hyphens:manual; }   /* длинные слова переносятся по мягким переносам из tileName() */
  #modeTitle span, #card .name, #card .sub { overflow-wrap:anywhere; hyphens:auto; -webkit-hyphens:auto; }
  body.sun .tile { border:2px solid #000; }
  .tile:active { background:color-mix(in srgb, var(--accent) 15%, transparent); }
  .tile svg { flex:none; }
  .empty { color:var(--muted); font-size:13px; padding:8px 2px; }
  .list .item { display:flex; align-items:center; gap:12px; padding:13px 6px; border-bottom:1px solid var(--line); }
  .list .item:active { background:color-mix(in srgb, var(--accent) 12%, transparent); }
  .list .item .i { width:26px; text-align:center; font-size:18px; flex:none; }
  .list .item.on { font-weight:600; }
  .list .item.danger { color:#c62828; font-weight:600; }
  .list .h { font-weight:700; color:var(--ink); opacity:.75; }
  .list .item .sw { margin-left:auto; flex:none; width:44px; height:26px; border-radius:13px; background:var(--line); position:relative; transition:background .15s; }
  .list .item .sw::after { content:''; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.35); transition:left .15s; }
  .list .item .sw.on { background:var(--accent); }
  .list .item .sw.on::after { left:21px; }
  .list .item .chk { margin-left:auto; font-size:18px; color:var(--accent); }

  /* ── формы ── */
  .form label { display:block; font-size:12.5px; color:var(--muted); margin:10px 2px 4px; }
  .form input, .form select { width:100%; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:11px; padding:11px 12px; font:inherit; }
  body.sun .form input, body.sun .form select { border:2px solid #000; }
  .form .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .form .hint { font-size:12px; color:var(--muted); margin:6px 2px 0; }
  .form .acts { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:16px; }

  /* ── карточка объекта ── */
  #card { position:absolute; left:8px; right:8px; z-index:1100; background:var(--panel); color:var(--ink); border-radius:16px; padding:12px; box-shadow:var(--shadow); display:none; }
  #card .t { display:flex; align-items:center; gap:10px; }
  #mode .title .cnt { font-variant-numeric:tabular-nums; }
  details.more { margin-top:10px; } details.more summary { color:var(--accent); padding:10px 0; min-height:44px; cursor:pointer; }
  #card .photos { display:flex; gap:6px; overflow-x:auto; margin:4px 0 8px; }
  #card .photos button { flex:none; width:64px; height:64px; border-radius:10px; border:1px solid var(--line); padding:0; overflow:hidden; background:var(--line); color:var(--muted); font-size:11px; }
  #card .photos img { width:100%; height:100%; object-fit:cover; display:block; }
  .ai-btn { width:100%; margin:0 0 8px; }
  .ai-cand { display:flex; gap:12px; align-items:center; width:100%; text-align:left; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:12px; padding:10px 12px; margin-bottom:6px; min-height:56px; }
  .ai-cand:first-of-type { border:2px solid var(--accent); }
  .ai-cand svg { flex:none; } .ai-cand small { color:var(--muted); }
  .photo-big { width:100%; max-height:60vh; object-fit:contain; border-radius:10px; background:#000; display:block; }
  #card .x.trash { background:none; color:var(--red); border:1px solid var(--line); }
  #card .t > div { flex:1; min-width:0; }
  #card .name { font-weight:700; font-size:1.08em; }
  #card .sub { color:var(--muted); font-size:12.5px; }
  #card .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 10px; margin:10px 0; font-size:13.5px; font-variant-numeric:tabular-nums; }
  #card .kv span:nth-child(odd) { color:var(--muted); }
  #card .acts { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; }
  #card .x.trash-h { margin-left:auto; margin-right:16px; color:#c62828; }
  #card .sw-wrap { margin:2px 0 8px; } #card .sw-wrap summary { cursor:pointer; color:var(--muted); font-size:.9em; padding:6px 2px; list-style:none; }
  #card .sw-wrap summary::-webkit-details-marker { display:none; }
  #card .btn.trash { color:var(--red); padding:0; margin-left:6px; }
  #card .swatches { display:flex; align-items:center; gap:8px; margin:2px 0 10px; overflow-x:auto; padding:3px 2px; }
  .meas-row .seg button { min-height:44px; font-size:15px; padding:8px 12px; }
  /* режим «перчатки»: всё, что нажимают в поле, — не меньше 60 px */
  body.glove .btn { min-height:62px; font-size:1.08em; }
  body.glove .fab { width:62px; height:62px; }
  body.glove .fab svg { width:32px; height:32px; }
  body.glove #bar button { width:84px; font-size:14px; }
  body.glove .seg button, body.glove .meas-row .seg button { min-height:54px; padding:10px 14px; font-size:15px; }
  body.glove #modeQuick button { min-height:58px; }
  body.glove .x { min-width:52px; min-height:52px; }
  .tabs button { min-height:40px; }

  .sym { background:none; border:0; color:var(--sym); display:flex; align-items:center; justify-content:center; }   /* знак — в центре зоны касания */
  svg [fill="#fff"] { fill:var(--symBg); }                              /* белая заливка знаков — ночью тёмная, чтобы светлые черты были видны */
  .sym .lbl { position:absolute; left:24px; top:-2px; white-space:nowrap; font:italic 12.5px/1 var(--draft); color:var(--sym); letter-spacing:.01em;

  .sym .lbl.frac { display:flex; flex-direction:column; align-items:center; line-height:1.05; }
  .sym .lbl.frac .t { border-bottom:1px solid currentColor; padding:0 1px; font-style:italic; }
  .sym .lbl.frac .b { font-style:italic; }                                        /* места нет — подпись появится при приближении */
  .sym.sel svg { filter: drop-shadow(0 0 3px var(--accent)) drop-shadow(0 0 3px var(--accent)); }
  .sym.wait::after { content:''; position:absolute; left:50%; top:50%; width:30px; height:30px; margin:-15px 0 0 -15px; border:2px dashed #ef6c00; border-radius:50%; pointer-events:none; }
  .sym.sel::before { content:''; position:absolute; left:50%; top:50%; width:38px; height:38px; margin:-19px 0 0 -19px; border:3px solid var(--accent); border-radius:50%; animation:selRing 1.4s ease-in-out infinite; pointer-events:none; }
  @keyframes selRing { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.45; transform:scale(1.12); } }
  .gtxt { pointer-events:none; fill:#1b5e20; font-weight:400; font-style:italic; font-family:var(--draft); font-variant-numeric: tabular-nums;
    paint-order: stroke; stroke:var(--halo); stroke-width:3.5px; stroke-linejoin:round; }
  body.night .gtxt { fill:#a5d6a7; }
  .gridlbl { background:none; border:0; pointer-events:none; }
  .gridlbl .glw { position:absolute; left:0; top:0; transform-origin:0 0; }
  .gridlbl .gx, .gridlbl .gy { position:absolute; white-space:nowrap; line-height:1; color:#1b5e20; font-weight:600;

  body.night .gridlbl .gx, body.night .gridlbl .gy { color:#a5d6a7; }
  .gridlbl .gx { top:-3px; transform:translateY(-100%); }               /* над горизонтальной чертой, справа */
  .gridlbl .gyw { position:absolute; left:0; top:0; transform:rotate(-90deg); transform-origin:0 0; }
  .gridlbl .gy { top:-3px; transform:translateY(-100%); }               /* после поворота — над вертикальной чертой (слева от неё) */
  .netlines { overflow:visible; pointer-events:none; }
  .netlines text { font-family:var(--draft); paint-order: stroke; stroke:var(--halo); stroke-width:2.6px; stroke-linejoin:round; }

</style>

/* ───────────── Координаты: WGS-84 → плоская система (ГСК-2011, СК-42 или своя МСК) ───────────── */

// ГСК-2011 — государственная система с 2017 г. (пост. № 1463), СК-42 для новых работ — только до 01.01.2021 (пост. № 1240).
// Переход ГСК-2011 → WGS-84: через ПЗ-90.11, параметры по ГОСТ 32453-2017 (расхождение систем — сантиметры–дециметры).
const TOWGS84_SK42 = '+towgs84=23.57,-140.95,-79.8,0,0.35,0.79,-0.22';
const TOWGS84_GSK = '+towgs84=-0.013,0.120,0.014,-0.002862,0.003559,-0.004263,-0.0086';
const CRS = {
  gsk: { name: 'ГСК-2011', zoned: true,
    def: zone => `+proj=tmerc +lat_0=0 +lon_0=${zone * 6 - 3} +k=1 +x_0=${zone * 1e6 + 500000} +y_0=0 +a=6378136.5 +rf=298.2564151 ${TOWGS84_GSK} +units=m +no_defs` },
  sk42: { name: 'СК-42', zoned: true,
    def: zone => `+proj=tmerc +lat_0=0 +lon_0=${zone * 6 - 3} +k=1 +x_0=${zone * 1e6 + 500000} +y_0=0 +ellps=krass ${TOWGS84_SK42} +units=m +no_defs` }
};
let crsId = pref('crs', 'gsk'), msk = pref('msk', null);   // msk: { name, lon0, lat0, k, x0, y0, towgs84 } — вводит сам пользователь
function crs() {
  if (crsId === 'msk' && msk) return { name: msk.name || 'МСК', zoned: false,
    def: () => `+proj=tmerc +lat_0=${msk.lat0 || 0} +lon_0=${msk.lon0} +k=${msk.k || 1} +x_0=${msk.x0 || 0} +y_0=${msk.y0 || 0} +ellps=krass +towgs84=${msk.towgs84 || TOWGS84_SK42.slice(9)} +units=m +no_defs` };
  return CRS[crsId] || CRS.gsk;
}
const planeName = () => crs().name;
const zoneOf = lng => crs().zoned ? Math.floor(lng / 6) + 1 : 0;
const gkDef = zone => crs().def(zone);
// Имена sk42/fromSk42 оставлены для краткости: считают в выбранной плоской системе
function sk42(lat, lng) {
  const zone = zoneOf(lng);
  const [y, x] = proj4('WGS84', gkDef(zone), [lng, lat]);
  return { zone, x, y };       // x — на север, y — на восток (с номером зоны впереди), как принято в геодезии
}
function fromSk42(x, y, zone) {   // обратный пересчёт плоской системы → WGS-84 (L.LatLng)
  const [lng, lat] = proj4(gkDef(zone), 'WGS84', [y, x]);
  return L.latLng(lat, lng);
}
const f2 = v => v.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const f6 = v => v.toFixed(6);
function coordText(ll) {
  const s = sk42(ll.lat, ll.lng);
  return { wgs: `${f6(ll.lat)}°  ${f6(ll.lng)}°`, sk: `X ${f2(s.x)}  Y ${f2(s.y)}`, s };
}

// План хранится в двух местах: в базе телефона (IndexedDB «tk-plan», без предела ~5 МБ) и, пока помещается, в localStorage —
// для мгновенного запуска. При запуске берётся более свежая из двух записей.
const STORE_KEY = 'tk.plan.v1', STORE_AT = 'tk.plan.at';
let data = { points: [], lines: [] }, dataAt = 0;
try { const raw = localStorage.getItem(STORE_KEY); if (raw) { data = JSON.parse(raw); dataAt = Number(localStorage.getItem(STORE_AT)) || 0; } } catch (e) { /* хранилище недоступно — возьмём из базы */ }
const planDb = new Promise(resolve => {
  try {
    const req = indexedDB.open('tk-plan', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('plan', { keyPath: 'id' });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
  } catch (e) { resolve(null); }
});
async function planTx(mode, fn) {
  const db = await planDb;
  if (!db) throw new Error('база плана недоступна');
  return new Promise((ok, bad) => { const tx = db.transaction('plan', mode), r = fn(tx.objectStore('plan')); tx.oncomplete = () => ok(r && r.result); tx.onerror = tx.onabort = () => bad(tx.error || new Error('запись прервана')); });
}
// История для «Вернуть»: перед каждым сохранением запоминаем прежнее состояние (до 50 шагов и не больше ~40 млн знаков — иначе большой план переполнит память)

const AUTO_EVERY_MS = 3 * 60 * 1000, AUTO_KEEP = 20;

function pushUndo(json) {

function persist(json) {

}

// Пересчёт отметок, снятых по ГНСС (по сохранённой высоте над эллипсоидом): onlyMissing — только тем, у кого отметки ещё нет

function measTol(o) { return (MEAS_KINDS.find(k => k.id === o.kind) || MEAS_KINDS[0]).mm * o.scale / 1000; }   // м на местности
function cmText(m) { return m < 1 ? Math.round(m * 100) + ' см' : m.toLocaleString('ru-RU', { maximumFractionDigits: 1 }) + ' м'; }

// Среднее и разброс отсчётов. Отсчёты телефона идут подряд и похожи друг на друга, поэтому разброс бывает
// меньше настоящей ошибки — за оценку берём большее из разброса и точности, которую сообщает приёмник.
function measStats(fixes) {
  const lat0 = fixes[0].lat, lng0 = fixes[0].lng, k = Math.cos(lat0 * Math.PI / 180);
  const pts = fixes.map(f => ({ n: (f.lat - lat0) * M_PER_DEG, e: (f.lng - lng0) * M_PER_DEG * k }));
  const mean = a => a.reduce((s, x) => s + x, 0) / a.length;
  const mn = mean(pts.map(p => p.n)), me = mean(pts.map(p => p.e));
  const dev = fixes.length > 1 ? Math.sqrt(pts.reduce((s, p) => s + (p.n - mn) ** 2 + (p.e - me) ** 2, 0) / (fixes.length - 1)) : 0;
  const acc = mean(fixes.map(f => f.acc));
  const res = { lat: lat0 + mn / M_PER_DEG, lng: lng0 + me / (M_PER_DEG * k), dev, acc, m: Math.max(dev, acc), n: fixes.length, hEll: null, hm: null };
  const alts = fixes.filter(f => f.alt != null && !isNaN(f.alt));
  if (alts.length) {                                                  // высота — так же: среднее, оценка — большее из разброса и точности приёмника
    const ha = mean(alts.map(f => f.alt));
    const hdev = alts.length > 1 ? Math.sqrt(alts.reduce((s, f) => s + (f.alt - ha) ** 2, 0) / (alts.length - 1)) : 0;
    const vacc = alts.filter(f => f.altAcc != null);
    res.hEll = ha;
    res.hm = Math.max(hdev, vacc.length ? mean(vacc.map(f => f.altAcc)) : 0);
  }

}
// допуск по высоте: ¼ сечения рельефа (СП 47.13330, п. 5.1.19); сечение для 1:500–1:1000 — 0,5 м, для 1:2000 — 1 м
function heightTol(scale) { return (scale <= 1000 ? 0.5 : 1) / 4; }

  if (m <= tol) return ['ok', `Годится для 1:${scale} — ошибка в пределах допуска ${cmText(tol)}`];
  if (m <= 2 * tol) return ['mid', `На пределе для 1:${scale}: больше средней (${cmText(tol)}), но меньше предельной (${cmText(2 * tol)})`];
  return ['bad', `Не годится для 1:${scale}: допуск ${cmText(tol)}, предельная ${cmText(2 * tol)}`];
}

// Контрольное измерение: повторно встать на точку, сравнить с записанным — координаты точки не меняются.
// Оценка по СП 47.13330: до средней ошибки — хорошо, до удвоенной (предельной) — на пределе, больше — брак

function ctrlVerdict(d, tol) { return d == null ? null : d <= tol ? 'ok' : d <= 2 * tol ? 'mid' : 'bad'; }

  openMeasure((ll, meas) => {
    const a = sk42(p.lat, p.lng), b = sk42(ll.lat, ll.lng), H0 = pointH(p), H1 = normalHeight(ll.lat, ll.lng, meas.hEll);
    const dS = Math.hypot(b.x - a.x, b.y - a.y), dH = H0 != null && H1 != null ? H1 - H0 : null, hTol = heightTol(meas.scale);
    const vs = ctrlVerdict(dS, meas.tol), vh = ctrlVerdict(dH == null ? null : Math.abs(dH), hTol);
    const ok = [vs, vh].includes('bad') ? 'bad' : [vs, vh].includes('mid') ? 'mid' : 'ok';
    const rec = { at: meas.at, dS: +dS.toFixed(3), dH: dH == null ? null : +dH.toFixed(3), dx: +(b.x - a.x).toFixed(3), dy: +(b.y - a.y).toFixed(3),
      m: meas.m, hm: meas.hm, scale: meas.scale, tol: meas.tol, hTol, ok };
    p.ctrl = [...(p.ctrl || []), rec];
    save();
    showSheet(`<div class="sh-head"><b>Контроль точки${p.no ? ' № ' + p.no : ''}</b><button class="x" data-close>×</button></div>
      <div class="meas-verdict ${ok}"><div class="meas-big">в плане ${cmText(dS)}</div>${CTRL_MARK[vs]} (средняя ${cmText(meas.tol)}, предельная ${cmText(2 * meas.tol)} для 1:${meas.scale})</div>
      ${dH != null ? `<div class="meas-h">по высоте ${dH >= 0 ? '+' : '−'}${cmText(Math.abs(dH))} <span>${CTRL_MARK[vh]} (допуск ${cmText(hTol)})</span></div>`
        : `<div class="meas-sub">${H0 == null ? 'У точки нет отметки — высоту сравнить не с чем' : 'Приёмник не дал высоту — сравнение только в плане'}</div>`}
      <div class="meas-sub">ΔX ${mText(rec.dx, 3)} м · ΔY ${mText(rec.dy, 3)} м · новое измерение ±${cmText(meas.m)}. Координаты точки не изменены, контроль записан в карточку и в выгрузки.</div>
      <button class="btn primary" data-close style="width:100%;margin-top:10px">Готово</button>`);
    if (selected && selected.obj === p) showCard('point', p);

}
function ctrlText(p) {
  const c = p.ctrl && p.ctrl[p.ctrl.length - 1];
  if (!c) return '';
  return `${cmText(c.dS)} в плане${c.dH != null ? `, ${c.dH >= 0 ? '+' : '−'}${cmText(Math.abs(c.dH))} по высоте` : ''} · ${CTRL_MARK[c.ok]}` +
    `<br><span style="color:var(--muted)">${new Date(c.at).toLocaleString('ru-RU')}${p.ctrl.length > 1 ? ` · всего контролей ${p.ctrl.length}` : ''}</span>`;
}

function openMeasure(onAccept) {
  if (spoofBlocks()) return;
  const o = { auto: 1, ...pref('meas', { sec: 30, kind: 'clear', scale: 500 }) };
  const seg = (key, items, label) => `<div class="seg" data-key="${key}">${items.map(([v, t]) =>
    `<button data-v="${v}" class="${String(o[key]) === String(v) ? 'on' : ''}">${t}</button>`).join('')}</div>`;
  // результат — первым и крупно; настройки (меняются редко) — одной строкой «30 с · Чёткий контур · 1:500 ✎», по нажатию раскрываются

    <div id="measLive" class="meas-live"></div>
    <button class="meas-sum" id="measSum"></button>
    <div id="measOpts" style="display:none">

      <div class="meas-row"><span>Что снимаем</span>${seg('kind', MEAS_KINDS.map(k => [k.id, k.name]))}</div>
      <div class="meas-row"><span>Масштаб плана</span>${seg('scale', MEAS_SCALES.map(s => [s, '1:' + s]))}</div>

      <button class="btn" data-close>Отмена</button><button class="btn primary" id="measGo">Начать</button></div></div>`);
  const tolNote = () => {
    const k = MEAS_KINDS.find(x => x.id === o.kind);
    $('measSum').innerHTML = `${o.sec < 60 ? o.sec + ' с' : o.sec / 60 + ' мин'} · ${esc(k.name)} · 1:${o.scale}${o.auto ? ' · автоприём' : ''} <span class="pen">✎ изменить</span>`;
    if (!measuring) $('measLive').innerHTML = `<div class="meas-big">допуск ${cmText(measTol(o))}</div>
      <div class="meas-sub">${String(k.mm).replace('.', ',')} мм на плане, ${k.hint} СП 47.13330. Стойте неподвижно, веха — по уровню, затем «Начать».</div>`;
  };
  $('measSum').onclick = () => { const b = $('measOpts'); b.style.display = b.style.display === 'none' ? 'block' : 'none'; };

    const key = box.dataset.key;

    box.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    setPref('meas', o); tolNote();
  });

}

function runMeasure(o, onAccept) {
  startGps();
  loadGeoid().catch(() => toast('Модель геоида не загрузилась — отметки не посчитаются'));
  const fixes = [], t0 = Date.now(), tol = measTol(o);
  let lastTs = 0, timer = null, hdops = [];
  const stop = () => { clearInterval(timer); measuring = null; holdGnss(false); };
  const live = () => {
    if (!$('measBox') || $('sheet').style.display === 'none') { stop(); return; }     // лист закрыли — измерение отменено
    const sec = Math.min(o.sec, Math.round((Date.now() - t0) / 1000));
    if (!fixes.length) { $('measLive').innerHTML = `<div class="meas-big">жду координаты…</div><div class="meas-sub">${sec} с</div>`; }
    else {
      const use = goodFixes(fixes, tol), dropped = fixes.length - use.length;
      const s = measStats(use), [cls0, text] = measVerdict(s.m, tol, o.scale), d = sats && sats.dop;
      const H = normalHeight(s.lat, s.lng, s.hEll), ht = heightTol(o.scale), hBad = s.hm != null && s.hm > ht;
      const cls = hBad && cls0 === 'ok' ? 'mid' : cls0;
      $('measLive').innerHTML = `<div class="meas-verdict ${cls}"><div class="meas-big">±${cmText(s.m)}</div>${text}</div>
        ${H != null ? `<div class="meas-h">H ${mText(H, 2)} м <span>±${cmText(s.hm)}${hgt.ref || hgt.dh ? '' : ', без привязки к реперу'}</span></div>
          <div class="meas-sub" style="${hBad ? 'color:var(--red)' : ''}">${hBad ? `Высота хуже допуска ${cmText(ht)} (¼ сечения рельефа) — для отметок не годится` : `Высота в допуске ${cmText(ht)}`}</div>` : ''}
        ${dropped ? `<div class="meas-sub" style="color:var(--red)">Отброшено отсчётов хуже допуска (FLOAT, без поправок): ${dropped}</div>` : ''}
        <div class="meas-sub">${sec} из ${o.sec} с · отсчётов ${s.n} · разброс ±${cmText(s.dev)} · по приёмнику ±${cmText(s.acc)}${d ? ' · HDOP ' + d.h.toFixed(1) : ''}</div>` +
        (d && d.h > 5 ? '<div class="meas-sub" style="color:var(--red)">Плохая геометрия спутников (HDOP больше 5) — лучше подождать.</div>' : '');
    }

    stop();

    if (fixes.length < MEAS_MIN_FIXES) { $('measLive').textContent = `Мало отсчётов (${fixes.length}) — нужен хотя бы ${MEAS_MIN_FIXES}. Проверьте GPS и повторите.`; resetButtons(); return; }
    const use = goodFixes(fixes, tol), s = measStats(use), [cls0] = measVerdict(s.m, tol, o.scale);
    const cls = s.hm != null && s.hm > heightTol(o.scale) && cls0 === 'ok' ? 'mid' : cls0;
    const hd = hdops.length ? hdops.reduce((a, b) => a + b, 0) / hdops.length : null;
    const meas = { sec: Math.round((Date.now() - t0) / 1000), n: s.n, m: +s.m.toFixed(3), dev: +s.dev.toFixed(3), acc: +s.acc.toFixed(3),
      hdop: hd == null ? null : +hd.toFixed(1), hEll: s.hEll == null ? null : +s.hEll.toFixed(3), hm: s.hm == null ? null : +s.hm.toFixed(3), kind: o.kind, scale: o.scale, tol: +tol.toFixed(3), ok: cls, dropped: fixes.length - use.length, at: new Date().toISOString() };

    cue(cls);
    if (o.auto && cls === 'ok') { say(`${VERDICT_SPEECH.ok}, плюс-минус ${cmSpeech(s.m)}. Принято`); accept(); return; }
    say(`${VERDICT_SPEECH[cls]}, плюс-минус ${cmSpeech(s.m)}`);
    go.textContent = 'Принять'; go.disabled = false;
    go.onclick = accept;
    const back = go.previousElementSibling;
    back.removeAttribute('data-close'); back.textContent = 'Повторить';
    back.onclick = () => openMeasure(onAccept);
  };
  const resetButtons = () => { const go = $('measGo'); go.textContent = 'Начать'; go.disabled = false; go.onclick = () => runMeasure(o, onAccept); };
  holdGnss(true);
  measuring = { onFix(p) {
    if (p.timestamp === lastTs) return;                                // тот же отсчёт повторно
    lastTs = p.timestamp;
    fixes.push({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, alt: p.coords.altitude, altAcc: p.coords.altitudeAccuracy });
    if (sats && sats.dop) hdops.push(sats.dop.h);
  } };
  cue('start');
  const go = $('measGo');
  go.textContent = 'Стоп — принять';
  go.onclick = () => finish();
  timer = setInterval(live, 500);
  live();
}

/* ───────────── Работа с занятыми руками: сигналы, озвучка, перчатки, дождь ───────────── */

let soundOn = pref('sound', true), voiceOn = pref('voice', true), gloveOn = pref('glove', false), rainOn = pref('rain', false);
document.body.classList.toggle('glove', gloveOn);
// сигналы различаются на слух и в кармане: в допуске — два высоких, на пределе — один средний, брак — низкий длинный,
// потеря FIX — три падающих, FIX вернулся — два восходящих. [частота Гц (0 — пауза), длительность мс]
const CUES = {
  tick: { tones: [[1200, 50]], vib: [30] },
  start: { tones: [[880, 120]], vib: [60] },
  ok: { tones: [[1320, 110], [0, 70], [1760, 170]], vib: [80, 80, 80] },
  mid: { tones: [[990, 320]], vib: [250] },
  bad: { tones: [[330, 650]], vib: [650] },
  fixLost: { tones: [[880, 150], [660, 150], [440, 320]], vib: [200, 100, 200, 100, 400] },
  fixBack: { tones: [[660, 120], [990, 180]], vib: [60, 60, 60] }
};
let audioCtx = null;
function cue(kind) {
  const c = CUES[kind];
  if (!c) return;
  if (navigator.vibrate) navigator.vibrate(c.vib);
  if (!soundOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    let t = audioCtx.currentTime + 0.02;
    for (const [hz, ms] of c.tones) {
      if (hz) {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'square'; o.frequency.value = hz;
        g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + ms / 1000);
        o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + ms / 1000);
      }
      t += ms / 1000;
    }
  } catch (e) { /* без звука — вибрация уже была */ }
}
// озвучка: в приложении — голосом Android, в браузере — встроенным синтезом речи
function say(text) {
  if (!voiceOn) return;
  const web = () => { try { const u = new SpeechSynthesisUtterance(text); u.lang = 'ru-RU'; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) { /* без голоса */ } };
  if (GNSS && GNSS.speak) GNSS.speak({ text }).catch(web); else web();
}
function cmSpeech(m) {
  if (m >= 1) return m.toLocaleString('ru-RU', { maximumFractionDigits: 1 }) + ' метра';
  const n = Math.max(1, Math.round(m * 100));
  return n + ' ' + plural(n, 'сантиметр', 'сантиметра', 'сантиметров');
}
const VERDICT_SPEECH = { ok: 'В допуске', mid: 'На пределе', bad: 'Не годится' };
// потеря и возврат FIX — сигналом, пока идёт съёмка (не чаще раза в 5 секунд)
const FIX_ALERT_MS = 5000;
let lastFix = null, lastFixAlert = 0;
function fixWatch(acc) {
  const k = fixKind(acc), busy = mode || measuring, now = Date.now();
  const changed = lastFix && (lastFix === 'FIX') !== (k === 'FIX');
  if (!busy || !changed) { lastFix = k; return; }
  if (now - lastFixAlert <= FIX_ALERT_MS) return;                    // сообщим на следующем отсчёте, если смена удержится
  lastFixAlert = now; lastFix = k;
  if (k === 'FIX') { cue('fixBack'); say('Фикс'); }
  else { cue('fixLost'); say('Потерян фикс'); toast(`Потерян FIX — сейчас ${k}, ±${cmText(acc)}`); }
}
// вопрос крупными кнопками вместо системного окна; громкость «+» — да, «−» — нет
let askClosedAt = 0;
const VOL_AFTER_ASK_MS = 500;
function ask(text, yes, danger) {
  return new Promise(resolve => {
    showSheet(`<div class="hint" style="margin:6px 0 14px;font-size:1.05em;color:var(--ink);line-height:1.45">${text}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn" id="askNo">Нет</button><button class="btn ${danger ? 'danger' : 'primary'}" id="askYes">${esc(yes)}</button></div>`);
    let done = false;
    const end = v => { if (done) return; done = true; askClosedAt = Date.now(); closeSheet(); resolve(v); };
    $('askYes').onclick = () => end(true);
    $('askNo').onclick = () => end(false);
    $('sheet').onclick = e => { if (e.target === $('sheet')) end(false); };
  });
}
// кнопки громкости перехватываются, пока идёт съёмка или открыто измерение / вопрос
let volCap = null;                                                   // null — ещё не сообщали телефону: первая же проверка выключит перехват
function syncVolKeys() {
  try {
    const open = $('sheet').style.display === 'block' && !!($('measBox') || $('askYes'));
    const on = pref('volKeys', true) && (!!mode || open || !!(stake && (stake.so || stake.redo) && $('sheet').style.display !== 'block'));
    if (on === volCap || !GNSS || !GNSS.volumeKeys) return;
    GNSS.volumeKeys({ on }).then(() => { volCap = on; }).catch(() => {});
  } catch (e) { /* ещё идёт запуск — режима съёмки нет */ }
}
setTimeout(syncVolKeys, 0);                                          // после запуска: сбросить перехват громкости

/* ───────────── Обновление Android-приложения: плашка «Доступна новая версия» ───────────── */

// APP_BUILD меняет скрипт выпуска (release.ps1); на сайте лежит version.json с номером последней сборки и ссылкой на APK
const APP_BUILD = 51;
const UPDATE_URL = 'https://maximenkovdi-cloud.github.io/polevoy-plan/version.json';
// manual — из меню: сказать, чем кончилась проверка (нет связи, последняя версия, есть новая)
async function checkUpdate(manual) {
  if (!NATIVE) { if (manual) toast(`Сборка ${APP_BUILD}. Обновления проверяются в Android-приложении`); return; }
  if (!navigator.onLine) { if (manual) toast('Нет интернета — проверю, когда появится связь'); return; }
  try {
    const r = await fetch(UPDATE_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const v = await r.json();
    if (!(v.build > APP_BUILD)) { if (manual) toast(`У вас последняя версия — сборка ${APP_BUILD}`); return; }
    if (manual) toast(`Есть новая сборка ${v.build} — кнопка «Обновить» вверху`);
    $('updVer').textContent = v.name || ('сборка ' + v.build);
    $('updLine').style.display = 'flex';
    const U = window.Capacitor.Plugins && window.Capacitor.Plugins.Updater || (window.Capacitor.registerPlugin && window.Capacitor.registerPlugin('Updater'));
    const btn = $('updBtn');
    let busy = false;
    btn.onclick = async () => {
      if (busy) return;
      if (!U || !U.install) { if (U) U.open({ url: v.apk }); else window.open(v.apk, '_blank'); return; }   // старая сборка — через браузер
      busy = true; btn.disabled = true; btn.textContent = 'Скачиваю…';
      const sub = await U.addListener('progress', p => { btn.textContent = p.percent >= 0 ? `Скачиваю ${p.percent}%` : 'Скачиваю…'; });
      try {
        const r = await U.install({ url: v.apk });
        if (r && r.needPermission) toast('Включите «Разрешить установку» для «Полевого плана», вернитесь и нажмите «Обновить» ещё раз');
        else btn.textContent = 'Установите в окне Android';
      } catch (e) { toast((e && e.message) || 'Не удалось скачать обновление'); }
      if (sub && sub.remove) sub.remove();
      busy = false; btn.disabled = false;

    if (Math.max(...pts.map(p => p[0])) < CAD_BOX.x || Math.min(...pts.map(p => p[0])) > CAD_BOX.x + CAD_BOX.w || Math.max(...pts.map(p => p[1])) < CAD_BOX.y || Math.min(...pts.map(p => p[1])) > CAD_BOX.y + CAD_BOX.h) continue;

  }

  out.push(`<text x="${f(C[0])}" y="${f(C[1])}" font-size="3.5" text-anchor="middle" font-weight="bold">${esc(r.name || ':ЗУ')}</text>`);

    ...[...usedPt].map(t => { const s = POINTS[t], col = s.cadNew ? CAD_RED : '#000'; return [`<circle cx="6" cy="0" r="0.75" fill="${t === 'c_pt_q' ? '#fff' : col}" stroke="${col}" stroke-width="0.2"/>`, s.name]; })];
  const cat = landCat(), m = meta(), day = new Date().toLocaleDateString('ru-RU');

    `Категория земель: ${cat ? esc(cat.name) + `, Mt ${cat.mt.toFixed(2)} м` : 'не выбрана'}`, `Система координат: ${esc(planeName())}`,
    [m.object ? 'Объект: ' + esc(m.object) : '', m.contractor ? esc(m.contractor) : '', m.performer ? 'исполнитель ' + esc(m.performer) : '', day].filter(Boolean).join(' · ')];
  const infoY = legY + 8 + Math.ceil(leg.length / 2) * 5;
  return `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" font-family="'GOST type A', 'ISOCPEUR', Arial, sans-serif">

}
// «Сведения о характерных точках границы»: обозначение, X, Y, Mt, метод, закрепление (r — участок; null — все точки плана)

function toCadSidesSheet(r) {

/* ───────────── «Доснять по GPS»: при подмене точки ставятся касанием и ждут; сигнал вернулся — по очереди к каждой ───────────── */

const REDO_JOIN_M = 0.01;                                               // вершины линий, сидящие на точке (до 1 см), едут вместе с ней

  showSheet(`<div class="sh-head"><b>Доснять по GPS: ${L0.length}</b><button class="x" data-close>×</button></div>
    <div class="hint" style="margin:4px 0 8px">Эти точки поставлены касанием во время подмены GPS — на глаз. Встаньте на каждую и нажмите «Измерить здесь»: координаты и отметка заменятся настоящими.${spoof ? '<br><b style="color:#c62828">Подмена ещё идёт — дождитесь, пока плашка GPS перестанет быть красной.</b>' : ''}</div>
    <div id="redoRows" style="max-height:44vh;overflow:auto">${L0.map((p, i) => `<div class="meas-row" data-ri="${i}" style="cursor:pointer"><span style="flex:1;min-width:0"><b>${esc(pointLabel(p) || (POINTS[p.type] || POINTS.mark).name)}</b> · № ${esc(p.no || '')}<br><small style="color:var(--muted)">поставлена ${esc(new Date(p.wait).toLocaleString('ru-RU'))}</small></span><span style="flex:none;color:var(--muted)">◎</span></div>`).join('')}</div>

  $('redoGo').onclick = () => redoGo(L0[0]);
}
function redoGo(p) { startStake([p.lat, p.lng], 'доснять: ' + (pointLabel(p) || (POINTS[p.type] || POINTS.mark).name), null); stake.redo = { id: p.id }; $('stake').dataset.key = ''; updateStake(); }
const redoButtons = () => '<div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px;margin-top:8px"><button class="btn primary" id="redoRec">Измерить здесь</button><button class="btn" id="redoSkip">Дальше →</button><button class="btn" id="redoMenu">Список</button></div>';

}
// измерить на месте: координаты, отметка и точность — настоящие; вершины линий на этой точке переезжают вместе с ней
function redoRecord(id) {
  openMeasure((ll, meas) => {
    const p = data.points.find(x => x.id === id); if (!p) { toast('Точку удалили'); return; }
    const old = sk42(p.lat, p.lng);
    if (!p.waitSnap) for (const l of data.lines) l.latlngs.forEach((a, i) => { const c = sk42(a[0], a[1]); if (Math.hypot(c.x - old.x, c.y - old.y) > REDO_JOIN_M) return;
      l.latlngs[i] = [ll.lat, ll.lng]; if (l.hs && l.hs[i]) l.hs[i] = null; });   // отметка вершины была «на глаз» — убрать
    const moved = L.latLng(p.lat, p.lng).distanceTo(ll);
    p.lat = ll.lat; p.lng = ll.lng; p.meas = meas;
    p.q = { acc: meas.m, fix: fixKind(meas.acc), at: meas.at, src: 'measure', redone: true };
    const hz = heightFor(ll, meas, 'measure', null);
    if (hz) { if (hz.h != null) p.h = hz.h; else delete p.h; p.hSrc = hz.src; p.hInfo = { acc: hz.acc, ref: hz.ref, from: hz.from, hEll: hz.hEll, ant: antH }; }
    else { delete p.h; delete p.hSrc; delete p.hInfo; }                 // приёмник не дал высоту — старая отметка («на глаз») неверна
    delete p.wait; delete p.waitSnap;
    save(); redrawAll(); cue('ok');
    say(`Точка ${p.no || ''} доснята, сдвиг ${cmSpeech(moved)}`); toast(`Доснято: сдвиг от точки «на глаз» ${cmText(moved)}`);
    redoNext(p.id);
  });
}

/* ───────────── Журнал съёмки: все точки таблицей — как снята, точность, отметка; фильтры — ошибки видны до отъезда ───────────── */

let lastPlacedId = null;                                               // для «отменить последнюю» кнопкой громкости
const HOW_NAME = { gps: 'по GPS', measure: 'Измерить', offset: 'смещение', center: 'перекрестье', tap: 'касанием', resect: 'засечка', axisoff: 'створ' };

        <span style="flex:none;text-align:right;font-variant-numeric:tabular-nums">${H != null ? mText(H, 2) : '—'}${(p.photos || []).length ? '<br>📷' : ''}</span></div>`; }).join('')
      : '<div class="hint">Таких точек нет.</div>'}${list.length > JOURNAL_MAX ? `<div class="hint" style="margin-top:6px">Показаны ${JOURNAL_MAX} последних из ${list.length} — остальные через фильтр.</div>` : ''}</div>

/* Перенос свойств: следующий колодец, задвижка, участок сети того же вида — с диаметром, материалом, владельцем прошлого */

  if (!prev) return null;

/* ───────────── Точка по расстоянию и углу от базы (смещение): база — GPS, если свежий, иначе последняя поставленная ───────────── */
function offsetPoint() {
  const fresh = gps && Date.now() - gps.at < GPS_FRESH_MS && !spoof;   // при подмене база — последняя точка, не GPS
  const last = mode.kind === 'point' ? data.points[data.points.length - 1] : null;
  const base = fresh ? L.latLng(gps.lat, gps.lng) : mode.kind === 'line' && mode.latlngs.length ? L.latLng(mode.latlngs[mode.latlngs.length - 1]) : last ? L.latLng(last.lat, last.lng) : null;
  if (!base) { toast('Нет базы: включите GPS или сначала поставьте точку'); return; }
  openForm('Точка по расстоянию и углу', [
    { key: 'd', label: 'Расстояние, м', type: 'number', placeholder: '3.50', half: true },
    { key: 'a', label: 'Дирекционный угол, °', type: 'number', placeholder: '90 — на восток', half: true,
      hint: `От ${fresh ? 'текущего положения по GPS' : 'последней точки'}. 0° — на север, 90° — на восток, 180° — на юг, 270° — на запад.` }
  ], v => {
    const d = parseNum(v.d), a = parseNum(v.a);
    if (!(d >= 0) || isNaN(a)) { toast('Расстояние и угол — числа'); return false; }
    const b = sk42(base.lat, base.lng), r = a * Math.PI / 180;
    const ll = fromSk42(b.x + d * Math.cos(r), b.y + d * Math.sin(r), b.zone);
    addAt(ll, null, 'offset');
    toast(`Точка на ${mText(d, 2)} м под углом ${mText(a, 1)}°`);
  }, 'Поставить');
}

/* ───────────── Ручная съёмка без GPS: засечка по двум промерам, створ и перпендикуляр, рулетка ───────────── */

// Выбор точек касанием: ближняя точка или вершина плана (до 30 px) — её координаты; мимо — место касания (с предупреждением)
const PICK_PX = 30;

const pickLayer = L.layerGroup().addTo(map);
function pickNearest(ll) {
  const c = map.latLngToContainerPoint(ll); let best = null, bd = PICK_PX;
  const take = (lat, lng, name) => { const q = map.latLngToContainerPoint([lat, lng]), d = Math.hypot(q.x - c.x, q.y - c.y); if (d < bd) { bd = d; best = { ll: L.latLng(lat, lng), name }; } };
  for (const p of data.points) take(p.lat, p.lng, pointLabel(p) || ((POINTS[p.type] || POINTS.mark).name + (p.no ? ' № ' + p.no : '')));
  for (const l of data.lines) l.latlngs.forEach((a, i) => take(a[0], a[1], `L${l.no || ''}.${i + 1}`));

/* ── Сохранить участок заранее (для работы без интернета) ── */
const TILE_KB = 18;                  // средний размер куска карты — для оценки объёма
const PREFETCH_MAX_TILES = 4000;     // больше за раз не качаем: бережём и телефон, и сервер карты
const PREFETCH_PARALLEL = 3;         // одновременно не больше трёх запросов — так просит политика OSM
function tileRange(b, z) {
  const n = 2 ** z, tx = lng => Math.floor((lng + 180) / 360 * n);
  const ty = lat => { const r = lat * Math.PI / 180; return Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n); };
  return { x0: tx(b.getWest()), x1: tx(b.getEast()), y0: ty(b.getNorth()), y1: ty(b.getSouth()) };
}
function tileUrl(layer, z, x, y) {
  const sub = layer.options.subdomains, s = sub && sub.length ? sub[Math.abs(x + y) % sub.length] : '';
  return L.Util.template(layer._url, { s, z, x, y, r: '' });
}
let prefetching = false;
async function saveArea() {
  if (prefetching) { toast('Уже сохраняю — подождите'); return; }
  const layer = bases[baseName], o = layer.options;
  if (!o.cache || !o.prefetch) { alert(`«${baseName}» по условиям поставщика нельзя сохранять в телефон.\nВыберите в слоях схему OSM, рельеф или Sentinel-2.`); return; }
  const b = map.getBounds(), zMax = o.prefetch, zMin = Math.max(8, Math.min(zMax, Math.floor(map.getZoom()) - 3)), jobs = [];
  for (let z = zMin; z <= zMax; z++) { const r = tileRange(b, z); for (let x = r.x0; x <= r.x1; x++) for (let y = r.y0; y <= r.y1; y++) jobs.push({ z, x, y }); }
  if (jobs.length > PREFETCH_MAX_TILES) { alert(`Район слишком большой: ${jobs.length} кусков карты (можно до ${PREFETCH_MAX_TILES}).\nПриблизьте карту к своему участку и повторите.`); return; }
  if (!confirm(`Сохранить видимый участок для работы без интернета?\n\nПодложка: ${baseName}\nКусков карты: ${jobs.length}, примерно ${Math.max(1, Math.round(jobs.length * TILE_KB / 1024))} МБ\n\nЗаранее сохраняется до масштаба около 1:8000 (так требуют правила OpenStreetMap). Крупнее — карта сохраняется сама, когда вы просматриваете участок при интернете.`)) return;
  prefetching = true;
  let done = 0, failed = 0;
  const next = async () => {
    while (jobs.length) {
      const j = jobs.shift(), key = `${o.cacheId}/${j.z}/${j.x}/${j.y}`;
      if (!(await tileStore('readonly', s => s.count(key)))) {
        try {
          const r = await fetch(tileUrl(layer, j.z, j.x, j.y), { mode: 'cors' });
          if (!r.ok) throw new Error(r.status);
          const blob = await r.blob();                                // сначала целиком получаем кусок, потом сохраняем
          await tileStore('readwrite', s => s.put(blob, key));
        }
        catch (e) { failed++; }
      }
      if (++done % 40 === 0) toast(`Сохраняю карту: ${done} из ${done + jobs.length}`);
    }
  };
  await Promise.all(Array.from({ length: PREFETCH_PARALLEL }, next));
  prefetching = false;
  toast(failed ? `Сохранено, но ${failed} кусков не скачались — проверьте интернет и повторите` : 'Участок сохранён — можно работать без интернета');
}

function parseDeg(s) {
  const m = String(s).trim().replace(',', '.').match(/^(-?\d+(?:\.\d+)?)(?:\s*[°º\s]\s*(\d+(?:\.\d+)?)?\s*['′]?\s*(\d+(?:\.\d+)?)?\s*["″]?)?$/);
  if (!m) return NaN;
  const d = Number(m[1]), sign = d < 0 ? -1 : 1;
  return d + sign * ((Number(m[2]) || 0) / 60 + (Number(m[3]) || 0) / 3600);
}

  if (typeof fileSlug === 'function' && fileSlug()) name = fileSlug() + '_' + name;   // название объекта — в имени файла
  const blob = text instanceof Blob ? text : new Blob([text], { type });
  if (FILES && FILES.save) {
    try {
      const data = await blobBase64(blob);
      const r = await FILES.save({ name, mime: type, data });
      showSheet(`<div class="sh-head"><b>Файл сохранён</b><button class="x" data-close>×</button></div>
        <div class="hint" style="margin:4px 0 12px">${esc(r.path)} (${Math.max(1, Math.round(blob.size / 1024))} КБ)</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><button class="btn" data-close>Готово</button><button class="btn primary" id="shareFile">Отправить…</button></div>`);
      $('shareFile').onclick = () => { closeSheet(); FILES.share({ name, mime: type, data }).catch(e => toast(e.message || 'Не удалось отправить')); };
    } catch (e) { toast((e && e.message) || 'Не удалось сохранить файл'); }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name; document.body.appendChild(a); a.click(); a.remove();

}

  return new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = () => bad(new Error('файл не прочитан')); r.readAsDataURL(blob); });
}

/* ───────────── Фото к объектам: съёмка, хранение в телефоне (IndexedDB «tk-photos»), просмотр ───────────── */

const PHOTO_MAX_PX = 1600, PHOTO_Q = 0.82;                           // ≈ 300–500 КБ: надпись на люке читается
const photoDb = new Promise(resolve => {
  try {
    const req = indexedDB.open('tk-photos', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('photos', { keyPath: 'id' });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
  } catch (e) { resolve(null); }
});
async function photoTx(mode, fn) {
  const db = await photoDb;
  if (!db) throw new Error('память для фото недоступна');
  return new Promise((ok, bad) => { const tx = db.transaction('photos', mode), r = fn(tx.objectStore('photos')); tx.oncomplete = () => ok(r && r.result); tx.onerror = () => bad(tx.error); });
}
const photoGet = id => photoTx('readonly', st => st.get(id));
const photoPut = rec => photoTx('readwrite', st => st.put(rec));
// направление съёмки — по компасу телефона, если он есть
let heading = null;
addEventListener('deviceorientationabsolute', e => { if (e.alpha != null) heading = Math.round((360 - e.alpha) % 360); });
const photoInput = document.createElement('input');
photoInput.type = 'file'; photoInput.accept = 'image/*'; photoInput.setAttribute('capture', 'environment'); photoInput.style.display = 'none';
document.body.appendChild(photoInput);
// открыть камеру; вернёт сжатый JPEG или null, если сняли отмену
function takePhoto() {
  return new Promise(resolve => {
    photoInput.value = '';
    photoInput.onchange = async () => {
      const file = photoInput.files[0];
      if (!file) { resolve(null); return; }
      try { resolve(await shrinkPhoto(file)); } catch (e) { toast('Не удалось обработать фото'); resolve(null); }
    };
    photoInput.click();
  });
}
async function shrinkPhoto(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  const k = Math.min(1, PHOTO_MAX_PX / Math.max(bmp.width, bmp.height)), w = Math.round(bmp.width * k), h = Math.round(bmp.height * k);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  cv.getContext('2d').drawImage(bmp, 0, 0, w, h);
  return new Promise(ok => cv.toBlob(b => ok(b), 'image/jpeg', PHOTO_Q));
}
// снять и прикрепить фото к объекту
async function addPhoto(kind, obj, blob) {
  blob = blob || await takePhoto();
  if (!blob) return false;
  const fresh = gps && Date.now() - gps.at < GPS_FRESH_MS && !spoof;
  const at = kind === 'point' ? [obj.lat, obj.lng] : obj.latlngs[0];
  const rec = { id: uid(), blob, at: new Date().toISOString(), lat: fresh ? gps.lat : at[0], lng: fresh ? gps.lng : at[1], heading, obj: obj.id };
  try { await photoPut(rec); } catch (e) { toast('Фото не сохранилось: ' + e.message); return false; }
  obj.photos = (obj.photos || []).concat(rec.id);
  save(); toast(`Фото прикреплено${heading != null ? `, съёмка на ${heading}°` : ''}`);
  if (selected && selected.obj === obj) showCard(kind, obj);
  return true;
}
// миниатюры в карточке подгружаются после её показа
const photoUrls = new Map();
async function photoUrl(id) {
  if (photoUrls.has(id)) return photoUrls.get(id);
  const rec = await photoGet(id).catch(() => null);
  const url = rec ? URL.createObjectURL(rec.blob) : null;
  photoUrls.set(id, url);
  return url;
}
function fillThumbs(kind, obj) {
  const box = document.getElementById('cardPhotos');
  if (!box || !obj.photos || !obj.photos.length) return;
  obj.photos.forEach(async id => {
    const url = await photoUrl(id), b = box.querySelector(`[data-photo="${id}"]`);
    if (b) b.innerHTML = url ? `<img src="${url}" alt="">` : '<span>нет</span>';
  });
  box.onclick = e => { const b = e.target.closest('[data-photo]'); if (b) showPhoto(kind, obj, b.dataset.photo); };
}
async function showPhoto(kind, obj, id) {
  const rec = await photoGet(id).catch(() => null), url = await photoUrl(id);
  if (!rec || !url) { toast('Фото не найдено в памяти телефона'); return; }
  const when = new Date(rec.at), c = sk42(rec.lat, rec.lng);
  showSheet(`<div class="sh-head"><b>Фото ${obj.photos.indexOf(id) + 1} из ${obj.photos.length}</b><button class="x" data-close>×</button></div>
    <img src="${url}" class="photo-big" alt="">
    <div class="hint" style="margin:6px 0 10px;color:var(--muted)">${when.toLocaleString('ru-RU')}${rec.heading != null ? ` · съёмка на ${rec.heading}°` : ''} · X ${f2(c.x)} Y ${f2(c.y)}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><button class="btn danger" id="photoDel">Открепить фото</button><button class="btn primary" data-close>Готово</button></div>`);
  $('photoDel').onclick = () => {                                     // само фото остаётся в памяти — «Вернуть» прикрепит его обратно
    obj.photos = obj.photos.filter(x => x !== id);
    if (!obj.photos.length) delete obj.photos;
    save(); closeSheet(); showCard(kind, obj); toast('Фото откреплено — кнопка ↶ вернёт');
  };
}

/* ───────────── Подсказка знака по фото: Яндекс AI Studio, мультимодальная модель (OpenAI-совместимый API) ───────────── */

// Ключ и каталог вводит сам пользователь, они хранятся только в этом телефоне (настройка 'ai')
const AI_URL = 'https://ai.api.cloud.yandex.net/v1/chat/completions', AI_MODEL = 'qwen3.6-35b-a3b', AI_PHOTO_PX = 1024, AI_TIMEOUT_MS = 90000;

// запрос: в приложении — через системный модуль (WebView не пускает к чужому сайту), в браузере — напрямую
async function aiPost(messages, maxTokens) {
  const body = JSON.stringify({ model: `gpt://${aiCfg.folder}/${aiCfg.model || AI_MODEL}`, messages, temperature: 0.1, max_tokens: maxTokens || 600 });
  const headers = { 'Content-Type': 'application/json', Authorization: 'Api-Key ' + aiCfg.key, 'OpenAI-Project': aiCfg.folder };
  let status, text;
  if (NET && NET.post) ({ status, text } = await NET.post({ url: AI_URL, headers, body, timeout: AI_TIMEOUT_MS }));
  else { const r = await fetch(AI_URL, { method: 'POST', headers, body }); status = r.status; text = await r.text(); }
  if (status === 401 || status === 403) throw new Error('ключ или каталог не подходят — проверьте их в «Подсказка знака по фото»');
  if (status === 429) throw new Error('слишком часто или закончились средства на счёте Яндекс Облака');
  if (status >= 400) throw new Error(`сервер ответил ${status}: ${String(text).slice(0, 160)}`);
  const j = JSON.parse(text), msg = j.choices && j.choices[0] && j.choices[0].message;
  if (!msg || !msg.content) throw new Error('пустой ответ');
  return String(msg.content);
}

// фото для запроса — поменьше (1024 px), этого хватает, чтобы прочитать надпись на люке
async function aiPhotoBase64(blob) {
  const bmp = await createImageBitmap(blob), k = Math.min(1, AI_PHOTO_PX / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  return blobBase64(await new Promise(ok => cv.toBlob(ok, 'image/jpeg', 0.85)));
}
// список знаков, из которых выбирает модель: «код — название (группа)»
function signCatalog(kind) {
  return (kind === 'point' ? POINT_GROUPS : LINE_GROUPS).flatMap(g => g.items.filter(i => i.id !== GENERIC[kind]).map(i => `${i.id} — ${i.name} (${g.title})`)).join('\n');
}
// Запрос к модели: { text, cands } по последним (до 3) фото объекта; ошибка связи — err.offline
async function aiRequest(kind, obj) {
  const recs = (await Promise.all((obj.photos || []).slice(-3).map(id => photoGet(id).catch(() => null)))).filter(Boolean);
  if (!recs.length) throw new Error('фото не найдено в памяти телефона');
  const ask = `Ты помогаешь инженеру-геодезисту на топографической съёмке 1:500 (Россия, условные знаки ГКИНП 02-049-86). На фото — объект, который он снимает${kind === 'line' ? ' (линейный: сеть, забор, край дороги, откос и т. п.)' : ''}.
Внимательно прочитай надписи и буквы на крышках люков, табличках, шкафах (например В, К, Г, ГАЗ, ТС, ГТС, ВК, ЛК, ГОРТЕЛ, МГТС, Д) — они определяют вид сети.
Выбери до 3 наиболее подходящих знаков СТРОГО из списка (код — название):
${signCatalog(kind)}
Ответь только JSON без пояснений вокруг: {"text":"надписи, которые видно на фото, или пусто","candidates":[{"id":"код из списка","why":"кратко по-русски, почему"}]}. Самый вероятный — первым. Если ничего не подходит — пустой список.`;
  const content = [{ type: 'text', text: ask }];
  for (const r of recs) content.push({ type: 'image_url', image_url: { url: 'data:image/jpeg;base64,' + await aiPhotoBase64(r.blob) } });
  let answer;
  try { answer = await aiPost([{ role: 'user', content }], 700); }
  catch (e) { if (!navigator.onLine || /Нет связи|Failed to fetch|NetworkError|timeout/i.test(e.message)) e.offline = true; throw e; }
  let parsed = null;
  try { parsed = JSON.parse(answer.replace(/^[\s\S]*?(\{[\s\S]*\})[\s\S]*$/, '$1')); } catch (e) { parsed = null; }
  const all = kind === 'point' ? POINTS : LINES;
  return { text: (parsed && parsed.text) || '', cands: ((parsed && parsed.candidates) || []).filter(c => c && all[c.id]).slice(0, 3), at: new Date().toISOString() };
}
async function suggestSign(kind, obj) {

  showSheet(`<div class="sh-head"><b>Подсказка знака</b><button class="x" data-close>×</button></div><div class="meas-big" style="font-size:1.3em">Смотрю фото…</div><div class="meas-sub">обычно 5–20 секунд, нужен интернет</div>`);

  showSuggestion(kind, obj, res);
}
function showSuggestion(kind, obj, res) {

/* Очередь без интернета: объекты ждут связи; появилась сеть (или вернулись в приложение) — подсказки запрашиваются сами */
const AI_RETRY_MS = 60000;
function queueAi(kind, obj) { const q = pref('aiQueue', []).filter(x => x.id !== obj.id); q.push({ kind, id: obj.id }); setPref('aiQueue', q); }
let aiBusy = false;
async function runAiQueue() {
  const q = pref('aiQueue', []);
  if (aiBusy || !q.length || !aiReady() || !navigator.onLine) return;
  aiBusy = true;
  let done = 0; const left = [];
  for (const it of q) {
    const obj = (it.kind === 'point' ? data.points : data.lines).find(o => o.id === it.id);
    if (!obj) continue;                                               // объект удалили — из очереди убираем
    try { obj.ai = await aiRequest(it.kind, obj); done++; }
    catch (e) { if (e.offline) { left.push(it); break; } }            // связь снова пропала — остальное потом
  }
  const rest = q.slice(q.findIndex(x => left[0] && x.id === left[0].id));
  setPref('aiQueue', left.length ? rest : []);
  aiBusy = false;
  if (done) { save(); if (selected) showCard(selected.kind, selected.obj); toast(`Готовы подсказки знаков: ${done} — откройте объект, кнопка «✨ Подсказка готова»`); }
}
addEventListener('online', runAiQueue);
document.addEventListener('visibilitychange', () => { if (!document.hidden) runAiQueue(); });
setInterval(runAiQueue, AI_RETRY_MS);

/* ───────────── DXF R12: X на восток (Y плоской системы), Y на север (X), Z — отметка; кириллица в кодировке 1251 ───────────── */

const DXF_TEXT_M = 1.0;                                                 // высота подписей — 1 м = 2 мм на плане 1:500
const NET_GROUPS = new Set(['water', 'sewer', 'gas', 'heat', 'cables', 'comm', 'special', 'air']);
const DXF_COLOR = { water: 5, sewer: 34, gas: 30, heat: 6, el: 1, own: 6, relief: 34, veg: 3, comm: 3 };
const LINE_GROUP_OF = Object.fromEntries(LINE_GROUPS.flatMap(g => g.items.map(i => [i.id, g])));
const layerName = (prefix, title) => (prefix + title).toUpperCase().replace(/[^A-ZА-ЯЁ0-9_]+/g, '_').replace(/_+$/, '');
function dxfLayerOfLine(l) { const g = LINE_GROUP_OF[l.type] || { id: 'own', title: 'Прочее' }; return layerName(NET_GROUPS.has(g.id) ? 'СЕТИ_' : 'ТОПО_', g.title); }
function dxfLayerOfPoint(p) { const g = POINT_GROUPS.find(x => x.items.some(i => i.id === p.type)) || { title: 'Прочее' }; return layerName('ТОЧКИ_', g.title); }
function dxfColorOfLayer(name, kind) { if (kind && DXF_COLOR[kind]) return DXF_COLOR[kind]; return /ДЕФЕКТ/i.test(name) ? 1 : /РЕЛЬЕФ/.test(name) ? 34 : /РАСТИТ|ДЕРЕВ/.test(name) ? 3 : 7; }
// кодировка Windows-1251 для кириллицы в DXF R12, каталоге и MIF; dxf — символы вне 1251 кодом \U+XXXX (AutoCAD его понимает), иначе «?»
function cp1251(str, dxf) {
  const extra = { 0x401: 0xA8, 0x451: 0xB8, 0x2116: 0xB9, 0x2013: 0x96, 0x2014: 0x97, 0x2026: 0x85, 0xAB: 0xAB, 0xBB: 0xBB, 0xB0: 0xB0, 0xB1: 0xB1 };
  const out = [];
  for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i);
    const b = c < 128 ? c : c >= 0x410 && c <= 0x44F ? c - 0x350 : extra[c];
    if (b != null) out.push(b);
    else if (dxf) for (const ch of '\\U+' + c.toString(16).toUpperCase().padStart(4, '0')) out.push(ch.charCodeAt(0));
    else out.push(0x3F); }
  return new Uint8Array(out);
}
// отметки вершин линии для 3D: известные — как есть, между ними — по длине, на концах — ближайшая; ни одной — null (линия 2D)
function lineZs(l) {
  const hs = l.latlngs.map((a, i) => { const z = l.hs && l.hs[i]; return z && hasH(z.h) ? Number(z.h) : null; });
  if (hs.every(h => h == null)) return null;
  const pts = l.latlngs.map(a => sk42(a[0], a[1])), d = [0];
  for (let i = 1; i < pts.length; i++) d.push(d[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
  const known = hs.map((h, i) => h == null ? -1 : i).filter(i => i >= 0);

  setOpacity(o) { this.r.opacity = o; if (this._img) this._img.style.opacity = o; },
  _anim(e) { this._place(ll => this._map._latLngToNewLayerPoint(ll, e.zoom, e.center)); },
  _place(toPoint) {
    const img = this._img, m = this._map, w = img.naturalWidth, h = img.naturalHeight;
    if (!w || !h) return;
    const pt = typeof toPoint === 'function' ? toPoint : ll => m.latLngToLayerPoint(ll);
    const p0 = pt(this.r.tl), p1 = pt(this.r.tr), p2 = pt(this.r.bl);
    // аффинное преобразование: угол (0,0) → TL, (w,0) → TR, (0,h) → BL — учитывает поворот сетки СК-42 к меридиану
    img.style.transform = `matrix(${(p1.x - p0.x) / w},${(p1.y - p0.y) / w},${(p2.x - p0.x) / h},${(p2.y - p0.y) / h},${p0.x},${p0.y})`;
    img.style.visibility = 'visible';
  }
});

// Хранение растров в IndexedDB (картинки слишком велики для localStorage)
const rasterDb = new Promise(resolve => {
  try {
    const req = indexedDB.open('tk-rasters', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('rasters', { keyPath: 'id' });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
  } catch (e) { resolve(null); }
});
async function rasterStore(mode, fn) {
  const db = await rasterDb;
  if (!db) return null;
  return new Promise((resolve, reject) => {
    const tx = db.transaction('rasters', mode), req = fn(tx.objectStore('rasters'));
    tx.oncomplete = () => resolve(req && req.result);
    tx.onerror = () => reject(tx.error);
  });
}
const rasterLayers = {};
function showRaster(r) {
  const layer = rasterLayers[r.id] = new RasterLayer(r);
  layer.addTo(map);
  layersControl.addOverlay(layer, 'Растр: ' + esc(r.name));
}
async function loadRasters() {
  try { const all = await rasterStore('readonly', s => s.getAll()); (all || []).forEach(showRaster); }
  catch (e) { toast('Не удалось открыть сохранённые растры'); }
}
// «5892500 6662500» или «5 892 500; 6 662 500» (пробелы внутри числа — только с точкой с запятой между X и Y)
function parseXY(v) {
  const parts = v.includes(';') ? v.split(';') : v.trim().split(/\s+/);
  const nums = parts.filter(s => s.trim() !== '').map(parseNum);
  return nums.length === 2 && !nums.some(isNaN) ? nums : null;
}
const rasterInput = document.createElement('input');
rasterInput.type = 'file'; rasterInput.accept = 'image/png,image/jpeg,image/webp'; rasterInput.style.display = 'none';
document.body.appendChild(rasterInput);
rasterInput.onchange = e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  const c = sk42(map.getCenter().lat, map.getCenter().lng);
  openForm('Привязка растра: ' + f.name, [
    { key: 'tl', label: 'Левый верхний угол — X Y, м', value: `${Math.round(c.x)} ${Math.round(c.y)}`, hint: 'Два числа через пробел, например 5892500 6662500' },
    { key: 'br', label: 'Правый нижний угол — X Y, м', value: `${Math.round(c.x) - 500} ${Math.round(c.y) + 500}` },
    { key: 'zone', label: crs().zoned ? 'Зона ' + planeName() : 'Зона (для МСК не нужна)', type: 'number', value: c.zone, hint: `Картинка должна быть выровнена по сетке ${planeName()}: север вверху.` }
  ], v => {
    const tl = parseXY(v.tl), br = parseXY(v.br), zone = crs().zoned ? parseInt(v.zone, 10) : 0;
    if (!tl || !br) { toast('Нужно два числа: X и Y'); return false; }
    if (!(tl[0] > br[0] && br[1] > tl[1])) { toast('У левого верхнего угла X больше, а Y меньше, чем у правого нижнего'); return false; }
    if (crs().zoned && !(zone > 0 && zone < 61)) { toast('Зона — число от 1 до 60'); return false; }
    const ll = (x, y) => { const p = fromSk42(x, y, zone); return [p.lat, p.lng]; };
    const r = { id: uid(), name: f.name, blob: f, tl: ll(tl[0], tl[1]), tr: ll(tl[0], br[1]), bl: ll(br[0], tl[1]), opacity: RASTER_OPACITY };
    rasterStore('readwrite', s => s.put(r)).catch(() => toast('Растр показан, но не сохранён на телефоне'));
    showRaster(r);
    map.fitBounds([r.tl, r.tr, r.bl], { padding: [30, 30] });
    toast('Растр наложен. Включать и выключать — кнопкой «Слои»');
  }, 'Наложить');
};
function rasterMenu() {
  const ids = Object.keys(rasterLayers);
  if (!ids.length) { toast('Своих растров пока нет'); return; }
  openList('Свои растры', ids.flatMap(id => {
    const r = rasterLayers[id].r;
    return [{ header: r.name }, { id: 'op:' + id, icon: '◐', text: `Прозрачность ${Math.round((1 - (r.opacity || RASTER_OPACITY)) * 100)} % — нажмите, чтобы изменить` },
      { id: 'del:' + id, icon: '🗑', text: 'Удалить растр' }];
  }), async pick => {
    const [act, id] = pick.split(':'), layer = rasterLayers[id];
    if (!layer) return;
    if (act === 'op') {
      const o = { 0.5: 0.7, 0.7: 0.9, 0.9: 1, 1: 0.5 }[layer.r.opacity || RASTER_OPACITY] || RASTER_OPACITY;
      layer.setOpacity(o);
      try { await rasterStore('readwrite', s => s.put(layer.r)); } catch (e) { /* не критично */ }
      toast('Прозрачность ' + Math.round((1 - o) * 100) + ' %');
      rasterMenu();
    }
    if (act === 'del' && confirm('Удалить растр «' + layer.r.name + '»?')) {
      map.removeLayer(layer); layersControl.removeLayer(layer); delete rasterLayers[id];
      try { await rasterStore('readwrite', s => s.delete(id)); } catch (e) { /* уже убран с карты */ }
    }
  });
}

/* ───────────── Старт ───────────── */

ready = true;
loadGeoid().catch(() => { /* без сети и кэша — попробуем при съёмке */ });
if (NATIVE) { startGnss(); startGps(); checkUpdate(); }   // в Android-приложении спутники и GPS включаются сразу, проверяется обновление
// вернулись в приложение (из другого окна, после сна телефона) — ещё раз проверить обновление, перезапускать не нужно
if (NATIVE) document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
if (NATIVE) { setInterval(checkUpdate, UPDATE_EVERY_MS); addEventListener('online', () => checkUpdate()); }
// на сайте — фоновый помощник, чтобы приложение открывалось без интернета (в Android-приложении всё и так внутри)
if (!NATIVE && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { /* без него просто нужен интернет */ });
redrawAll();
updateInfo();
layout();                                            // после updateInfo: плашка уже с координатами и своей настоящей высотой
window.addEventListener('resize', layout);
// плашка меняет высоту (WGS / СК-42 / оба, длинная строка GPS) — кнопки и подсказки сдвигаются следом
if (window.ResizeObserver) new ResizeObserver(layout).observe($('top'));
loadRasters();
if (data.points.length || data.lines.length) MENU.fit();
</script>
