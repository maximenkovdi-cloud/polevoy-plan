<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1f5fbf">
<title>Полевой план</title>
<!-- библиотеки лежат рядом (lib/), чтобы приложение открывалось без интернета: Leaflet 1.9.4 (BSD-2), proj4 2.11.0 (MIT) -->
<link rel="stylesheet" href="lib/leaflet.min.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,400;0,500;1,400;1,500&display=swap">
<script src="lib/leaflet.min.js"></script>
<script src="lib/proj4.js"></script>
<style>
  /* ── темы: день / солнце / ночь ── */
  body.day   { --bg:#f4f1e8; --panel:#ffffff; --ink:#151515; --muted:#5d5d5d; --line:#d9d6cc; --accent:#1f5fbf; --accentInk:#fff; --red:#c62828; --sym:#111111; --symBg:#ffffff; --halo:#ffffff; --shadow:0 1px 6px rgba(0,0,0,.18); --fs:14px; }
  body.sun   { --bg:#ffffff; --panel:#ffffff; --ink:#000000; --muted:#222222; --line:#000000; --accent:#0039a6; --accentInk:#fff; --red:#b00000; --sym:#000000; --symBg:#ffffff; --halo:#ffffff; --shadow:0 0 0 2px #000; --fs:15.5px; }
  body.night { --bg:#1c2127; --panel:#262c33; --ink:#e9edf1; --muted:#9aa5b1; --line:#38414b; --accent:#5aa2ff; --accentInk:#0d1117; --red:#ff6b6b; --sym:#e9edf1; --symBg:#1c2127; --halo:#1c2127; --shadow:0 1px 8px rgba(0,0,0,.5); --fs:14px; }
  /* традиционные цвета сетей («Правила начертания…», п. 6 — по дополнительным требованиям) */
  /* чертёжный шрифт подписей на плане: узкий наклонный, как по ГОСТ 2.304 */
  body { --draft:"Roboto Condensed","Arial Narrow",Arial,sans-serif; }
  body { --c-water:#1b8a3a; --c-sewer:#8d5524; --c-heat:#1f4fbf; --c-gas:#1aa3d9; --c-el:#d32f2f; --c-own:#7b1fa2; }
  body.night { --c-water:#4caf50; --c-sewer:#c49a6c; --c-heat:#6f9cff; --c-gas:#4fc3f7; --c-el:#ff6b6b; --c-own:#ce93d8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; background:var(--bg); font:var(--fs)/1.35 system-ui, "Segoe UI", Roboto, sans-serif; color:var(--ink); }
  #map { position:absolute; inset:0; background:var(--bg); }
  body.night .leaflet-tile-pane { filter: brightness(.55) contrast(1.15) saturate(.55); }
  body.sun .leaflet-tile-pane { filter: contrast(1.2) saturate(1.1); }
  button { font:inherit; color:inherit; }

  /* ── верхняя плашка координат ── */
  #top { position:absolute; left:8px; right:8px; top:8px; z-index:1000; background:var(--panel); color:var(--ink); border-radius:14px; padding:8px 10px; box-shadow:var(--shadow); font-variant-numeric:tabular-nums; }
  #top .r1 { display:flex; justify-content:space-between; align-items:center; gap:6px; }
  .seg { display:flex; background:var(--line); border-radius:9px; padding:2px; }
  body.sun .seg { background:#fff; border:2px solid #000; }
  .seg button { border:0; background:none; padding:5px 10px; border-radius:7px; color:var(--muted); font-size:12.5px; }
  .seg button.on { background:var(--panel); color:var(--ink); font-weight:700; }
  body.sun .seg button.on { background:#000; color:#fff; }
  #zone { font-size:12px; color:var(--muted); }
  .xy { font-size:1.08em; font-weight:700; margin-top:4px; letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .xy small { font-weight:400; color:var(--muted); font-size:.75em; }
  #gpsLine { display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); margin-top:3px; }
  #updLine { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:6px; padding:6px 8px; border-radius:10px;
    background:color-mix(in srgb, var(--accent) 14%, transparent); font-size:13px; }
  #updLine .btn { min-height:34px; padding:6px 14px; }
  #satLine { display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink); margin-top:3px; cursor:pointer; white-space:nowrap; overflow:hidden; }
  #satLine #satText { overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
  #satLine .more { color:var(--muted); margin-left:auto; }
  .sat-tab { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; margin-top:4px; }
  .sat-tab th, .sat-tab td { padding:9px 6px; border-bottom:1px solid var(--line); text-align:right; }
  .sat-tab th:first-child, .sat-tab td:first-child { text-align:left; }
  .sat-tab th { color:var(--muted); font-weight:500; font-size:12.5px; }
  .sat-tab tr.sum td { font-weight:700; }
  .dop { display:flex; align-items:center; gap:7px; margin:2px 0 8px; font-variant-numeric:tabular-nums; }
  .meas-big { font-size:1.6em; font-weight:700; font-variant-numeric:tabular-nums; margin:6px 0 2px; }
  .meas-verdict { border-radius:10px; padding:8px 10px; margin:8px 0; font-weight:600; }
  .meas-verdict.ok { background:color-mix(in srgb, #2e7d32 15%, transparent); }
  .meas-verdict.mid { background:color-mix(in srgb, #f9a825 20%, transparent); }
  .meas-verdict.bad { background:color-mix(in srgb, #c62828 15%, transparent); }
  .meas-row { display:flex; gap:8px; align-items:center; margin:8px 0; flex-wrap:wrap; }
  .meas-row > span { color:var(--muted); font-size:13px; min-width:92px; }
  .meas-row .seg { flex-wrap:wrap; }
  .dot { width:9px; height:9px; border-radius:50%; background:#9e9e9e; flex:none; }
  .dot.ok { background:#2e7d32; } .dot.mid { background:#f9a825; } .dot.bad { background:#c62828; }

  /* ── перекрестье ── */
  #cross { position:absolute; left:50%; top:50%; width:34px; height:34px; margin:-17px 0 0 -17px; z-index:900; pointer-events:none; }

  /* ── круглые кнопки справа ── */
  #fabs { position:absolute; right:10px; z-index:1000; display:flex; flex-direction:column; gap:10px; }
  .fab { width:50px; height:50px; border-radius:50%; border:0; background:var(--panel); color:var(--ink); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow); }
  .fab svg { width:26px; height:26px; }
  .fab.on { background:var(--accent); color:var(--accentInk); }

  /* ── масштаб ── */
  #scale { position:absolute; left:10px; z-index:1000; background:var(--panel); color:var(--ink); border-radius:10px; padding:7px 11px 7px; font-size:13px; font-weight:700; box-shadow:var(--shadow); cursor:pointer; }
  #scale i { display:block; height:5px; border:2px solid var(--ink); border-top:0; margin-top:3px; }

  /* ── нижняя панель ── */
  #bar { position:absolute; left:0; right:0; bottom:0; z-index:1000; background:var(--panel); display:flex; justify-content:space-around; padding:8px 4px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); }
  body.sun #bar { border-top:2px solid #000; }
  #bar button { border:0; background:none; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--muted); font-size:12.5px; width:72px; padding:0; }
  #bar .ic { width:56px; height:36px; border-radius:18px; display:flex; align-items:center; justify-content:center; }
  #bar svg { width:26px; height:26px; }
  #bar button.on { color:var(--ink); font-weight:700; }
  #bar button.on .ic { background:color-mix(in srgb, var(--accent) 22%, transparent); color:var(--accent); }

  /* ── панель режима (ставим знак / рисуем линию) ── */
  #mode { position:absolute; left:8px; right:8px; z-index:1000; background:var(--panel); color:var(--ink); border-radius:16px; box-shadow:var(--shadow); padding:10px 12px; display:none; }
  #mode .title { display:flex; align-items:center; gap:8px; font-weight:700; margin-bottom:8px; }
  #mode .title svg { flex:none; }
  #mode .btns { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
  .btn { border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:12px; padding:11px 6px; font-weight:600; font-size:.95em; min-height:46px; }
  body.sun .btn { border:2px solid #000; }
  .btn.primary { background:var(--accent); color:var(--accentInk); border-color:var(--accent); }
  .btn.danger { color:var(--red); }

  /* ── нижние листы ── */
  #sheet { position:absolute; inset:0; z-index:2000; background:rgba(0,0,0,.38); display:none; }
  #sheet .panel { position:absolute; left:0; right:0; bottom:0; max-height:82%; overflow:auto; background:var(--panel); color:var(--ink); border-radius:18px 18px 0 0; padding:10px 12px calc(20px + env(safe-area-inset-bottom)); }
  .grab { width:40px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 10px; }
  .sh-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .sh-head b { font-size:1.1em; }
  .x { border:0; background:var(--line); color:var(--ink); width:36px; height:36px; border-radius:50%; font-size:18px; line-height:1; }
  .search { display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:12px; padding:0 10px; color:var(--muted); }
  body.sun .search { border:2px solid #000; }
  .search input { flex:1; border:0; outline:0; background:none; color:var(--ink); font:inherit; padding:11px 0; }
  .tabs { display:flex; gap:6px; margin:10px 0 6px; overflow-x:auto; padding-bottom:2px; }
  .tabs button { flex:none; border:1px solid var(--line); background:none; color:var(--muted); font-size:13px; padding:7px 12px; border-radius:16px; }
  .tabs button.on { background:var(--accent); color:var(--accentInk); border-color:var(--accent); font-weight:700; }
  .h { font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:12px 2px 6px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill, minmax(78px, 1fr)); gap:7px; }
  .tile { border:1px solid var(--line); background:none; color:var(--ink); border-radius:13px; padding:9px 3px 7px; display:flex; flex-direction:column; align-items:center; gap:5px; text-align:center; font-size:11px; line-height:1.15; min-height:84px; min-width:0; }
  .tile span { max-width:100%; hyphens:manual; -webkit-hyphens:manual; }   /* длинные слова переносятся по мягким переносам из tileName() */
  #modeTitle span, #card .name, #card .sub { overflow-wrap:anywhere; hyphens:auto; -webkit-hyphens:auto; }
  body.sun .tile { border:2px solid #000; }
  .tile:active { background:color-mix(in srgb, var(--accent) 15%, transparent); }
  .tile svg { flex:none; }
  .empty { color:var(--muted); font-size:13px; padding:8px 2px; }
  .list .item { display:flex; align-items:center; gap:12px; padding:13px 6px; border-bottom:1px solid var(--line); }
  .list .item:active { background:color-mix(in srgb, var(--accent) 12%, transparent); }
  .list .item .i { width:26px; text-align:center; font-size:18px; flex:none; }
  .list .item.on { font-weight:700; color:var(--accent); }
  .list .item .chk { margin-left:auto; font-size:18px; color:var(--accent); }

  /* ── формы ── */
  .form label { display:block; font-size:12.5px; color:var(--muted); margin:10px 2px 4px; }
  .form input, .form select { width:100%; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:11px; padding:11px 12px; font:inherit; }
  body.sun .form input, body.sun .form select { border:2px solid #000; }
  .form .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .form .hint { font-size:12px; color:var(--muted); margin:6px 2px 0; }
  .form .acts { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:16px; }

  /* ── карточка объекта ── */
  #card { position:absolute; left:8px; right:8px; z-index:1100; background:var(--panel); color:var(--ink); border-radius:16px; padding:12px; box-shadow:var(--shadow); display:none; }
  #card .t { display:flex; align-items:center; gap:10px; }
  #card .t > div { flex:1; min-width:0; }
  #card .name { font-weight:700; font-size:1.08em; }
  #card .sub { color:var(--muted); font-size:12.5px; }
  #card .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 10px; margin:10px 0; font-size:13.5px; font-variant-numeric:tabular-nums; }
  #card .kv span:nth-child(odd) { color:var(--muted); }
  #card .acts { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }

  /* ── знаки и подписи на карте ── */
  .sym { background:none; border:0; color:var(--sym); }
  svg [fill="#fff"] { fill:var(--symBg); }                              /* белая заливка знаков — ночью тёмная, чтобы светлые черты были видны */
  .sym .lbl { position:absolute; left:24px; top:-2px; white-space:nowrap; font:italic 12.5px/1 var(--draft); color:var(--sym); letter-spacing:.01em;
    text-shadow:0 0 2px var(--halo), 0 0 2px var(--halo), 0 0 3px var(--halo); }
  .sym .lbl.off { display:none; }                                        /* места нет — подпись появится при приближении */
  .sym.sel svg { filter: drop-shadow(0 0 3px var(--accent)) drop-shadow(0 0 3px var(--accent)); }
  .gtxt { pointer-events:none; fill:#1b5e20; font-weight:400; font-style:italic; font-family:var(--draft); font-variant-numeric: tabular-nums;
    paint-order: stroke; stroke:var(--halo); stroke-width:3.5px; stroke-linejoin:round; }
  body.night .gtxt { fill:#a5d6a7; }
  .gridlbl { background:none; border:0; pointer-events:none; }
  .gridlbl .glw { position:absolute; left:0; top:0; transform-origin:0 0; }
  .gridlbl .gx, .gridlbl .gy { position:absolute; white-space:nowrap; line-height:1; color:#1b5e20; font-weight:600;
    font-family: system-ui, "Segoe UI", Roboto, sans-serif; font-variant-numeric: tabular-nums;
    text-shadow: 0 0 2px var(--halo), 0 0 2px var(--halo), 0 0 3px var(--halo), 0 0 4px var(--halo); }
  body.night .gridlbl .gx, body.night .gridlbl .gy { color:#a5d6a7; }
  .gridlbl .gx { top:-3px; transform:translateY(-100%); }               /* над горизонтальной чертой, справа */
  .gridlbl .gyw { position:absolute; left:0; top:0; transform:rotate(-90deg); transform-origin:0 0; }
  .gridlbl .gy { top:-3px; transform:translateY(-100%); }               /* после поворота — над вертикальной чертой (слева от неё) */
  .netlines { overflow:visible; pointer-events:none; }
  .netlines text { font-family:var(--draft); paint-order: stroke; stroke:var(--halo); stroke-width:2.6px; stroke-linejoin:round; }

  /* ── Leaflet: свой список слоёв и масштаб, кнопки +/− под плашкой ── */
  .leaflet-control-layers, .leaflet-control-scale { display:none !important; }
  .leaflet-top.leaflet-left { top:var(--topH, 92px); }
  .leaflet-top.leaflet-left .leaflet-control { margin-top:0; }          /* отступ уже учтён в --topH */
  .leaflet-control-zoom a { width:40px !important; height:40px !important; line-height:40px !important; font-size:20px !important; background:var(--panel) !important; color:var(--ink) !important; border-color:var(--line) !important; }
  .leaflet-bottom { bottom:var(--barH, 70px); }
  .leaflet-control-attribution { background:color-mix(in srgb, var(--panel) 80%, transparent) !important; color:var(--muted) !important; }
  .leaflet-control-attribution a { color:var(--accent) !important; }

  #toast { position:absolute; left:50%; transform:translateX(-50%); z-index:3000; background:#222; color:#fff; padding:9px 15px; border-radius:18px; font-size:14px; display:none; max-width:90%; text-align:center; }
</style>
</head>
<body class="day">
<div id="map"></div>

<div id="top">
  <div class="r1">
    <div class="seg" id="coordSeg"><button data-c="wgs">WGS-84</button><button data-c="sk" id="segPlane">ГСК-2011</button><button data-c="both">оба</button></div>
    <span id="zone"></span>
  </div>
  <div id="coords"></div>
  <div id="gpsLine"><span class="dot" id="gpsDot"></span><span id="gpsText">GPS выключен — нажмите ◎</span></div>
  <div id="updLine" style="display:none"><span>⬆ Доступна новая версия <b id="updVer"></b></span><button class="btn primary" id="updBtn">Обновить</button></div>
  <div id="satLine" style="display:none"><span class="sat-ic">🛰</span><span id="satText"></span><span class="more">▾</span></div>
</div>

<svg id="cross" viewBox="0 0 34 34"><path d="M17 3v10M17 21v10M3 17h10M21 17h10" stroke="#c62828" stroke-width="2.4" stroke-linecap="round" paint-order="stroke"/><circle cx="17" cy="17" r="2" fill="#c62828"/></svg>

<div id="fabs">
  <button class="fab" id="fabLayers" aria-label="Слои"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5z"/><path d="m3 13 9 5 9-5"/></svg></button>
  <button class="fab" id="fabTheme" aria-label="Яркость"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button>
  <button class="fab" id="fabMe" aria-label="Где я"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg></button>
</div>

<div id="scale"><span id="scaleText"></span><i id="scaleBar"></i></div>

<div id="mode"><div class="title" id="modeTitle"></div><div class="btns" id="modeBtns"></div></div>
<div id="card"></div>

<div id="bar">
  <button id="btnMap" class="on"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg></span>Карта</button>
  <button id="btnPoint"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M4 12h16"/></svg></span>Знак</button>
  <button id="btnLine"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 18 9 9l5 5 7-9"/><circle cx="3" cy="18" r="1.4"/><circle cx="9" cy="9" r="1.4"/><circle cx="14" cy="14" r="1.4"/><circle cx="21" cy="5" r="1.4"/></svg></span>Линия</button>
  <button id="btnMenu"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></span>Меню</button>
</div>

<div id="sheet"><div class="panel" id="sheetPanel"></div></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".kml,application/vnd.google-earth.kml+xml,text/xml" style="display:none">

<script>
'use strict';

/* ───────────── Условные знаки (ГКИНП 02-049-86, 1:1000–1:500; сверены 28.10.2026) ───────────── */

const R = '<circle cx="12" cy="12" r="9" fill="#fff" stroke="currentColor" stroke-width="1.6"/>';
const Ln = (x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>`;
const DOT = '<circle cx="12" cy="12" r="1.6" fill="currentColor"/>';
const BENCHMARK = '<circle cx="12" cy="12" r="8" fill="currentColor"/><rect x="5.5" y="10.6" width="13" height="2.8" fill="#fff"/>';

// Молния — жирный зигзаг с залитой стрелкой (читается и на мелком знаке); рамка с буквой — для газовых сооружений
const BOLT = '<path d="M15.2 3.2 8.4 12.8h6.4l-4.5 6.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="miter" stroke-miterlimit="6"/><path d="M9.2 21.4 12.4 20.1 8.7 17.6Z" fill="currentColor"/>';
const BOXK = t => `<rect x="2.5" y="5" width="19" height="14" fill="#fff" stroke="currentColor" stroke-width="1.6"/><text x="12" y="16.3" font-size="10.5" text-anchor="middle" font-style="italic" font-family="Roboto Condensed, Arial Narrow, Arial, sans-serif" fill="currentColor">${t}</text>`;

const POINT_GROUPS = [
  { id: 'geo', title: 'Геодезия', items: [

// Переход ГСК-2011 → WGS-84: через ПЗ-90.11, параметры по ГОСТ 32453-2017 (расхождение систем — сантиметры–дециметры).
const TOWGS84_SK42 = '+towgs84=23.57,-140.95,-79.8,0,0.35,0.79,-0.22';
const TOWGS84_GSK = '+towgs84=-0.013,0.120,0.014,-0.002862,0.003559,-0.004263,-0.0086';

  gsk: { name: 'ГСК-2011', zoned: true,

  sk42: { name: 'СК-42', zoned: true,
    def: zone => `+proj=tmerc +lat_0=0 +lon_0=${zone * 6 - 3} +k=1 +x_0=${zone * 1e6 + 500000} +y_0=0 +ellps=krass ${TOWGS84_SK42} +units=m +no_defs` }
};
let crsId = pref('crs', 'gsk'), msk = pref('msk', null);   // msk: { name, lon0, lat0, k, x0, y0, towgs84 } — вводит сам пользователь
function crs() {
  if (crsId === 'msk' && msk) return { name: msk.name || 'МСК', zoned: false,
    def: () => `+proj=tmerc +lat_0=${msk.lat0 || 0} +lon_0=${msk.lon0} +k=${msk.k || 1} +x_0=${msk.x0 || 0} +y_0=${msk.y0 || 0} +ellps=krass +towgs84=${msk.towgs84 || TOWGS84_SK42.slice(9)} +units=m +no_defs` };

}
const planeName = () => crs().name;
const zoneOf = lng => crs().zoned ? Math.floor(lng / 6) + 1 : 0;

function sk42(lat, lng) {
  const zone = zoneOf(lng);
  const [y, x] = proj4('WGS84', gkDef(zone), [lng, lat]);

}
function fromSk42(x, y, zone) {   // обратный пересчёт плоской системы → WGS-84 (L.LatLng)
  const [lng, lat] = proj4(gkDef(zone), 'WGS84', [y, x]);
  return L.latLng(lat, lng);
}
const f2 = v => v.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const f6 = v => v.toFixed(6);
function coordText(ll) {
  const s = sk42(ll.lat, ll.lng);
  return { wgs: `${f6(ll.lat)}°  ${f6(ll.lng)}°`, sk: `X ${f2(s.x)}  Y ${f2(s.y)}`, s };
}

// zoomSnap: 0 — масштаб меняется плавно, без шагов «ровно вдвое»: так можно встать точно на 1:500
const map = L.map('map', { zoomControl: true, attributionControl: true, zoomSnap: 0, zoomDelta: 1, wheelPxPerZoomLevel: 120 }).setView([55.75, 37.62], 5);

/* ── Карта без интернета: куски подложки хранятся в телефоне (IndexedDB) ── */
const tileDb = new Promise(resolve => {
  try {
    const req = indexedDB.open('tk-tiles', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('t');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
  } catch (e) { resolve(null); }
});
async function tileStore(mode, fn) {
  const db = await tileDb;
  if (!db) return null;
  return new Promise(resolve => {
    try {
      const tx = db.transaction('t', mode), req = fn(tx.objectStore('t'));
      tx.oncomplete = () => resolve(req && req.result);
      tx.onerror = () => resolve(null);
    } catch (e) { resolve(null); }
  });
}
// Подложка, которая сначала берёт кусок из телефона, а скачанный из сети — запоминает (если поставщик разрешает)
const CachedTiles = L.TileLayer.extend({
  createTile(coords, done) {
    const img = document.createElement('img'), url = this.getTileUrl(coords), opt = this.options;
    const key = opt.cacheId + '/' + coords.z + '/' + coords.x + '/' + coords.y;
    img.alt = ''; img.setAttribute('role', 'presentation');
    const show = (src, revoke) => { img.onload = () => { if (revoke) URL.revokeObjectURL(src); done(null, img); }; img.onerror = e => done(e, img); img.src = src; };
    if (!opt.cache) { show(url); return img; }
    tileStore('readonly', s => s.get(key)).then(blob => {
      if (blob) { show(URL.createObjectURL(blob), true); return; }
      fetch(url, { mode: 'cors' })
        .then(r => { if (!r.ok) throw new Error(r.status); return r.blob(); })
        .then(b => { tileStore('readwrite', s => s.put(b, key)); show(URL.createObjectURL(b), true); })
        .catch(() => show(url));                                   // без сети и без сохранённого куска — пустое место
    });
    return img;
  }
});
// cache — можно ли запоминать куски; prefetch — до какого уровня можно скачивать участок заранее (политики поставщиков)
const cachedTiles = (id, url, o) => new CachedTiles(url, Object.assign({ cacheId: id, cache: true }, o));
const OSM = '© участники OpenStreetMap';
const MAX_ZOOM = 22;           // глубже, чем дают подложки (их снимки растягиваются), — чтобы 1:200 и 1:500 помещались на любом экране
const bases = {

  'Схема контрастная (HOT)': cachedTiles('hot','https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', { maxZoom: MAX_ZOOM, maxNativeZoom: 19, subdomains: 'abc', attribution: OSM + ', стиль HOT / OSM France', prefetch: 16 }),
  'Тропы и грунтовки (CyclOSM)': cachedTiles('cyclosm','https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png', { maxZoom: MAX_ZOOM, maxNativeZoom: 20, subdomains: 'abc', attribution: OSM + ', CyclOSM', prefetch: 16 }),
  'Рельеф (OpenTopoMap)': cachedTiles('topo','https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: MAX_ZOOM, maxNativeZoom: 17, subdomains: 'abc', attribution: OSM + ', SRTM | © OpenTopoMap (CC-BY-SA)', prefetch: 16 }),
  'Спутник подробный (Esri)': cachedTiles('esri','https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: MAX_ZOOM, maxNativeZoom: 18, attribution: 'Снимки © Esri, Maxar, Earthstar Geographics', cache: false }),   // условия Esri: без сохранения в телефон
  'Спутник обзорный (Sentinel-2)': cachedTiles('s2','https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2023_3857/default/g/{z}/{y}/{x}.jpg', { maxZoom: MAX_ZOOM, maxNativeZoom: 14, attribution: 'Sentinel-2 cloudless — s2maps.eu, EOX IT Services GmbH (модиф. данные Copernicus Sentinel 2023), CC BY-NC-SA 4.0', prefetch: 14 })
};
let baseName = pref('base', 'Схема (OSM)');
if (!bases[baseName]) baseName = 'Схема (OSM)';
bases[baseName].addTo(map);

let coordMode = pref('coords', 'sk');

// Масштаб «1:N»: размер экранного пикселя — ~0,16 мм на телефоне и ~0,26 мм на компьютере; точнее — калибровкой по линейке
const PX_MM_DEFAULT = matchMedia('(pointer: coarse)').matches ? 0.159 : 0.2646;
let PX_MM = pref('pxmm', PX_MM_DEFAULT);
const NICE_M = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000];
const SCALES = [200, 500, 1000, 2000, 5000, 10000, 25000];
function metersPerPx() {
  const y = map.getSize().y / 2, a = map.containerPointToLatLng([0, y]), b = map.containerPointToLatLng([100, y]);
  return a.distanceTo(b) / 100;
}
function setScale(denom) {
  const cur = metersPerPx(), target = denom * PX_MM / 1000;
  if (!cur || !target) return;
  map.setZoom(map.getZoom() + Math.log2(cur / target));
}
function updateScale() {
  const mPerPx = metersPerPx();
  if (!mPerPx) return;
  const denom = mPerPx * 1000 / PX_MM, p = Math.pow(10, Math.floor(Math.log10(denom)) - 1);
  const preset = SCALES.find(s => Math.abs(denom / s - 1) < 0.01);      // стоим на стандартном масштабе — пишем его ровно
  const round = preset || Math.round(denom / p) * p;
  const meters = NICE_M.find(m => m / mPerPx >= 50) || NICE_M[NICE_M.length - 1];
  $('scaleText').textContent = `1:${round.toLocaleString('ru-RU')} · ${meters >= 1000 ? meters / 1000 + ' км' : meters + ' м'} ▾`;
  $('scaleBar').style.width = Math.round(meters / mPerPx) + 'px';
}
$('scale').onclick = () => openList('Масштаб', [
  { header: 'Встать в масштаб' },
  ...SCALES.map(s => ({ id: String(s), icon: '⤢', text: '1:' + s.toLocaleString('ru-RU') + (s === 500 ? ' — исполнительная съёмка' : '') })),
  { header: 'Точность' },
  { id: 'cal', icon: '📏', text: PX_MM === PX_MM_DEFAULT ? 'Откалибровать экран по линейке' : 'Калибровка экрана: сделана — повторить или сбросить' }
], pick => pick === 'cal' ? calibrate() : setScale(Number(pick)));

// Калибровка: на экране полоса известной длины в пикселях, геодезист меряет её линейкой
const CAL_PX = 240;
function calibrate() {
  showSheet(`<div class="sh-head"><b>Калибровка экрана</b><button class="x" data-close>×</button></div><div class="form">
    <div class="hint" style="font-size:13.5px">Приложите линейку к полосе ниже и измерьте её длину в миллиметрах — от левого края до правого.</div>
    <div style="margin:16px 0 6px;height:22px;width:${CAL_PX}px;border:2px solid var(--ink);border-top:0;position:relative">
      <div style="position:absolute;left:0;right:0;top:9px;height:3px;background:var(--accent)"></div></div>
    <label for="f_mm">Длина полосы, мм</label><input id="f_mm" inputmode="decimal" placeholder="например 38,5" autocomplete="off">
    <div class="hint">Сейчас: 1 точка экрана = ${PX_MM.toFixed(4).replace('.', ',')} мм${PX_MM === PX_MM_DEFAULT ? ' (примерно, без калибровки)' : ' (по калибровке)'}.</div>
    <div class="acts"><button class="btn" id="calReset">Сбросить</button><button class="btn primary" id="calSave">Сохранить</button></div></div>`);
  $('calSave').onclick = () => {
    const mm = parseNum($('f_mm').value);
    const px = mm / CAL_PX;
    if (!(px > 0.05 && px < 0.6)) { toast('Проверьте длину: обычно это от 20 до 100 мм'); return; }
    PX_MM = px; setPref('pxmm', px); closeSheet(); updateScale(); toast('Готово: масштаб на экране теперь по линейке');
  };
  $('calReset').onclick = () => { PX_MM = PX_MM_DEFAULT; setPref('pxmm', PX_MM_DEFAULT); closeSheet(); updateScale(); toast('Калибровка сброшена'); };
}

/* ───────────── GPS ───────────── */

let gps = null, gpsMarker = null, gpsCircle = null, gpsWatch = null;
const RTK_FIX_M = 0.05;          // точность до 5 см — почти наверняка фиксированное решение RTK
function startGps() {
  startGnss();                                       // в Android-приложении — заодно и спутники
  if (!navigator.geolocation) { toast('В этом браузере нет GPS'); return; }
  if (gpsWatch != null) return;
  $('gpsText').textContent = 'Ищу спутники…'; $('gpsDot').className = 'dot mid';
  gpsWatch = navigator.geolocation.watchPosition(p => {
    const first = !gps;
    gps = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, at: Date.now() };
    if (measuring) measuring.onFix(p);
    const ll = [gps.lat, gps.lng];
    if (!gpsMarker) {
      gpsCircle = L.circle(ll, { radius: gps.acc, color: '#1e88e5', weight: 1, fillOpacity: .12, interactive: false }).addTo(map);
      gpsMarker = L.circleMarker(ll, { radius: 7, color: '#fff', weight: 2, fillColor: '#1e88e5', fillOpacity: 1, interactive: false }).addTo(map);
    } else { gpsMarker.setLatLng(ll); gpsCircle.setLatLng(ll).setRadius(gps.acc); }
    if (first) map.setView(ll, 18);
    const acc = gps.acc;
    // RTK-приёмник через «фиктивное местоположение» даёт сантиметры — показываем их, а не округлённые метры
    const accText = acc < 1 ? acc.toLocaleString('ru-RU', { minimumFractionDigits: 3, maximumFractionDigits: 3 }) : Math.round(acc);
    const rtk = acc <= RTK_FIX_M ? ' · RTK (похоже на FIX)' : acc < 1 ? ' · RTK (похоже на FLOAT)' : '';
    $('gpsDot').className = 'dot ' + (acc <= 5 ? 'ok' : acc <= 15 ? 'mid' : 'bad');
    $('gpsText').textContent = `GPS ±${accText} м${rtk}` + (acc > 15 ? ' — подождите на открытом месте' : '');
    $('fabMe').classList.add('on');
  }, err => {
    gpsWatch = null;
    $('gpsDot').className = 'dot bad';
    $('gpsText').textContent = 'GPS: нет доступа — ' + err.message;
  }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
}
/* ───────────── Измерение точки с усреднением и проверкой допуска ───────────── */

// Допуски — СП 47.13330.2016, п. 5.1.17–5.1.18: средние погрешности планового положения в мм масштаба плана;
// предельные (п. 5.1.22) — вдвое больше средних.
const MEAS_KINDS = [
  { id: 'clear', name: 'Чёткий контур', mm: 0.5, hint: 'открытая местность, п. 5.1.17' },
  { id: 'wood', name: 'Горы, лес', mm: 0.7, hint: 'горные и залесённые районы, п. 5.1.17' },
  { id: 'under', name: 'Подземная сеть', mm: 0.7, hint: 'скрытые точки по трассоискателю, п. 5.1.18' }
];
const MEAS_SCALES = [500, 1000, 2000];
const MEAS_SECONDS = [10, 30, 60, 120];
const MEAS_MIN_FIXES = 5;
const M_PER_DEG = 111320;
let measuring = null;
function measTol(o) { return (MEAS_KINDS.find(k => k.id === o.kind) || MEAS_KINDS[0]).mm * o.scale / 1000; }   // м на местности
function cmText(m) { return m < 1 ? Math.round(m * 100) + ' см' : m.toLocaleString('ru-RU', { maximumFractionDigits: 1 }) + ' м'; }

// Среднее и разброс отсчётов. Отсчёты телефона идут подряд и похожи друг на друга, поэтому разброс бывает
// меньше настоящей ошибки — за оценку берём большее из разброса и точности, которую сообщает приёмник.
function measStats(fixes) {
  const lat0 = fixes[0].lat, lng0 = fixes[0].lng, k = Math.cos(lat0 * Math.PI / 180);
  const pts = fixes.map(f => ({ n: (f.lat - lat0) * M_PER_DEG, e: (f.lng - lng0) * M_PER_DEG * k }));
  const mean = a => a.reduce((s, x) => s + x, 0) / a.length;
  const mn = mean(pts.map(p => p.n)), me = mean(pts.map(p => p.e));
  const dev = fixes.length > 1 ? Math.sqrt(pts.reduce((s, p) => s + (p.n - mn) ** 2 + (p.e - me) ** 2, 0) / (fixes.length - 1)) : 0;
  const acc = mean(fixes.map(f => f.acc));
  return { lat: lat0 + mn / M_PER_DEG, lng: lng0 + me / (M_PER_DEG * k), dev, acc, m: Math.max(dev, acc), n: fixes.length };
}
function measVerdict(m, tol, scale) {
  if (m <= tol) return ['ok', `Годится для 1:${scale} — ошибка в пределах допуска ${cmText(tol)}`];
  if (m <= 2 * tol) return ['mid', `На пределе для 1:${scale}: больше средней (${cmText(tol)}), но меньше предельной (${cmText(2 * tol)})`];
  return ['bad', `Не годится для 1:${scale}: допуск ${cmText(tol)}, предельная ${cmText(2 * tol)}`];
}

function openMeasure(onAccept) {
  const o = pref('meas', { sec: 30, kind: 'clear', scale: 500 });
  const seg = (key, items, label) => `<div class="seg" data-key="${key}">${items.map(([v, t]) =>
    `<button data-v="${v}" class="${String(o[key]) === String(v) ? 'on' : ''}">${t}</button>`).join('')}</div>`;
  showSheet(`<div class="sh-head"><b>Измерение точки</b><button class="x" data-close>×</button></div><div id="measBox">
    <div class="meas-row"><span>Время</span>${seg('sec', MEAS_SECONDS.map(s => [s, s < 60 ? s + ' с' : s / 60 + ' мин']))}</div>
    <div class="meas-row"><span>Что снимаем</span>${seg('kind', MEAS_KINDS.map(k => [k.id, k.name]))}</div>
    <div class="meas-row"><span>Масштаб плана</span>${seg('scale', MEAS_SCALES.map(s => [s, '1:' + s]))}</div>
    <div id="measLive" class="hint" style="color:var(--muted);font-size:12.5px"></div>
    <div class="acts" style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px">
      <button class="btn" data-close>Отмена</button><button class="btn primary" id="measGo">Начать</button></div></div>`);
  const tolNote = () => { const k = MEAS_KINDS.find(x => x.id === o.kind); $('measLive').textContent =
    `Допуск ${cmText(measTol(o))} (${String(k.mm).replace('.', ',')} мм на плане, ${k.hint} СП 47.13330). Стойте неподвижно, веха — по уровню.`; };
  tolNote();
  $('measBox').querySelectorAll('.seg').forEach(box => box.onclick = e => {
    const b = e.target.closest('button[data-v]');
    if (!b || measuring) return;
    const key = box.dataset.key;
    o[key] = key === 'kind' ? b.dataset.v : Number(b.dataset.v);
    box.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    setPref('meas', o); tolNote();
  });
  $('measGo').onclick = () => runMeasure(o, onAccept);
}

function runMeasure(o, onAccept) {
  startGps();
  const fixes = [], t0 = Date.now(), tol = measTol(o);
  let lastTs = 0, timer = null, hdops = [];
  const stop = () => { clearInterval(timer); measuring = null; };
  const live = () => {
    if (!$('measBox') || $('sheet').style.display === 'none') { stop(); return; }     // лист закрыли — измерение отменено
    const sec = Math.min(o.sec, Math.round((Date.now() - t0) / 1000));
    if (!fixes.length) { $('measLive').textContent = `Жду координаты… ${sec} с`; }
    else {
      const s = measStats(fixes), [cls, text] = measVerdict(s.m, tol, o.scale), d = sats && sats.dop;
      $('measLive').innerHTML = `<div class="meas-big">±${cmText(s.m)}</div>
        <div>Отсчётов ${s.n} · ${sec} из ${o.sec} с · разброс ±${cmText(s.dev)} · по приёмнику ±${cmText(s.acc)}${d ? ' · HDOP ' + d.h.toFixed(1) : ''}</div>
        <div class="meas-verdict ${cls}">${text}</div>` + (d && d.h > 5 ? '<div>Плохая геометрия спутников (HDOP больше 5) — лучше подождать.</div>' : '');
    }
    if (sec >= o.sec) finish();
  };
  const finish = () => {
    stop();
    if (fixes.length < MEAS_MIN_FIXES) { $('measLive').textContent = `Мало отсчётов (${fixes.length}) — нужен хотя бы ${MEAS_MIN_FIXES}. Проверьте GPS и повторите.`; resetButtons(); return; }
    const s = measStats(fixes), [cls] = measVerdict(s.m, tol, o.scale);
    const hd = hdops.length ? hdops.reduce((a, b) => a + b, 0) / hdops.length : null;
    const meas = { sec: Math.round((Date.now() - t0) / 1000), n: s.n, m: +s.m.toFixed(3), dev: +s.dev.toFixed(3), acc: +s.acc.toFixed(3),
      hdop: hd == null ? null : +hd.toFixed(1), kind: o.kind, scale: o.scale, tol: +tol.toFixed(3), ok: cls, at: new Date().toISOString() };
    const go = $('measGo');
    go.textContent = 'Принять'; go.disabled = false;
    go.onclick = () => { closeSheet(); onAccept(L.latLng(s.lat, s.lng), meas); };
    const back = go.previousElementSibling;
    back.removeAttribute('data-close'); back.textContent = 'Повторить';
    back.onclick = () => openMeasure(onAccept);
  };
  const resetButtons = () => { const go = $('measGo'); go.textContent = 'Начать'; go.disabled = false; go.onclick = () => runMeasure(o, onAccept); };
  measuring = { onFix(p) {
    if (p.timestamp === lastTs) return;                                // тот же отсчёт повторно
    lastTs = p.timestamp;
    fixes.push({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy });
    if (sats && sats.dop) hdops.push(sats.dop.h);
  } };
  const go = $('measGo');
  go.textContent = 'Стоп — принять';
  go.onclick = () => finish();
  timer = setInterval(live, 500);
  live();
}

/* ───────────── Обновление Android-приложения: плашка «Доступна новая версия» ───────────── */

// APP_BUILD меняет скрипт выпуска (release.ps1); на сайте лежит version.json с номером последней сборки и ссылкой на APK
const APP_BUILD = 4;
const UPDATE_URL = 'https://maximenkovdi-cloud.github.io/polevoy-plan/version.json';
async function checkUpdate() {
  if (!NATIVE || !navigator.onLine) return;
  try {
    const v = await fetch(UPDATE_URL + '?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json());
    if (!(v.build > APP_BUILD)) return;
    $('updVer').textContent = v.name || ('сборка ' + v.build);
    $('updLine').style.display = 'flex';
    const U = window.Capacitor.Plugins && window.Capacitor.Plugins.Updater || (window.Capacitor.registerPlugin && window.Capacitor.registerPlugin('Updater'));
    const btn = $('updBtn');
    let busy = false;
    btn.onclick = async () => {
      if (busy) return;
      if (!U || !U.install) { if (U) U.open({ url: v.apk }); else window.open(v.apk, '_blank'); return; }   // старая сборка — через браузер
      busy = true; btn.disabled = true; btn.textContent = 'Скачиваю…';
      const sub = await U.addListener('progress', p => { btn.textContent = p.percent >= 0 ? `Скачиваю ${p.percent}%` : 'Скачиваю…'; });
      try {
        const r = await U.install({ url: v.apk });
        if (r && r.needPermission) toast('Включите «Разрешить установку» для «Полевого плана», вернитесь и нажмите «Обновить» ещё раз');
        else btn.textContent = 'Установите в окне Android';
      } catch (e) { toast((e && e.message) || 'Не удалось скачать обновление'); }
      if (sub && sub.remove) sub.remove();
      busy = false; btn.disabled = false;
      if (btn.textContent.startsWith('Скачиваю')) btn.textContent = 'Обновить';
    };
  } catch (e) { /* нет связи с сайтом — проверим в другой раз */ }
}

/* ───────────── Спутники ГНСС — только в Android-приложении (браузер этих данных не даёт) ───────────── */

const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const GNSS = NATIVE && ((window.Capacitor.Plugins && window.Capacitor.Plugins.Gnss) ||
  (window.Capacitor.registerPlugin && window.Capacitor.registerPlugin('Gnss')));   // Capacitor 6: registerPlugin, запасной путь — Plugins
const SAT_SHORT = { 'GPS': 'GPS', 'ГЛОНАСС': 'ГЛН', 'Galileo': 'GAL', 'BeiDou': 'BDS', 'QZSS': 'QZS', 'SBAS': 'SBAS', 'NavIC': 'NavIC', 'Прочие': 'проч.' };
let sats = null, gnssOn = false;
function showSats(st) {
  sats = st;
  sats.dop = st.sats ? computeDop(st.sats) : null;
  if (!st.total) { satMessage('Спутники: пока не видно ни одного — выйдите на открытое место'); return; }
  $('satLine').style.display = 'flex';
  $('satText').textContent = `Спутники ${st.used}/${st.total} · ` + (sats.dop ? `HDOP ${sats.dop.h.toFixed(1)} · ` : '') +
    (st.systems || []).map(s => `${SAT_SHORT[s.name] || s.name} ${s.used}/${s.seen}`).join(' · ');
  if ($('satBody')) $('satBody').innerHTML = satSheetBody();            // лист «Спутники» открыт — обновляем вживую
}

/* DOP — геометрический фактор (ESA GNSS Data Processing, т. I, § 6.1.3.2): Q = (GᵀG)⁻¹ в системе ВСВ (восток-север-верх).
   Строка G для спутника: [cos el·sin az, cos el·cos az, sin el, часы]. Часы приёмника для каждой системы свои —
   у GPS, ГЛОНАСС, Galileo, BeiDou разные шкалы времени, поэтому по столбцу «часов» на каждую систему в решении. */
const DOP_GRADES = [[1, 'отлично', 'ok'], [2, 'хорошо', 'ok'], [5, 'удовлетворительно', 'mid'], [Infinity, 'плохо — подождите', 'bad']];
function computeDop(list) {
  const used = list.filter(s => s.used && s.el >= 0);
  const systems = [...new Set(used.map(s => s.sys))];
  const n = 3 + systems.length;
  if (used.length < n) return null;                                     // неизвестных больше, чем спутников
  const N = Array.from({ length: n }, () => new Array(n).fill(0));
  for (const s of used) {
    const el = s.el * Math.PI / 180, az = s.az * Math.PI / 180;
    const g = new Array(n).fill(0);
    g[0] = Math.cos(el) * Math.sin(az); g[1] = Math.cos(el) * Math.cos(az); g[2] = Math.sin(el);
    g[3 + systems.indexOf(s.sys)] = 1;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) N[i][j] += g[i] * g[j];
  }
  const Q = invert(N);
  if (!Q) return null;
  const h = Math.sqrt(Q[0][0] + Q[1][1]), v = Math.sqrt(Q[2][2]);
  return { h, v, p: Math.sqrt(h * h + v * v), n: used.length };
}
function dopGrade(h) { return DOP_GRADES.find(([max]) => h <= max); }
// обращение небольшой симметричной матрицы методом Гаусса — Жордана; null, если геометрия вырождена
function invert(M) {
  const n = M.length, A = M.map((row, i) => [...row, ...row.map((_, j) => (i === j ? 1 : 0))]);
  for (let c = 0; c < n; c++) {
    let p = c;
    for (let r = c + 1; r < n; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
    if (Math.abs(A[p][c]) < 1e-9) return null;
    [A[c], A[p]] = [A[p], A[c]];
    const d = A[c][c];
    A[c] = A[c].map(x => x / d);
    for (let r = 0; r < n; r++) if (r !== c) { const k = A[r][c]; A[r] = A[r].map((x, j) => x - k * A[c][j]); }
  }
  return A.map(row => row.slice(n));
}

/* Карта неба: центр — зенит, край — горизонт, север вверху. Закрашен — спутник в решении, кружок — только виден.

const SKY_MASK = 15;

  const c = size / 2, R = c - 16, rr = el => R * (90 - el) / 90;
  let svg = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block;margin:0 auto">
    <g fill="none" stroke="var(--muted)" stroke-width=".8">
      <circle cx="${c}" cy="${c}" r="${R}"/><circle cx="${c}" cy="${c}" r="${rr(30)}"/><circle cx="${c}" cy="${c}" r="${rr(60)}"/>
      <circle cx="${c}" cy="${c}" r="${rr(SKY_MASK)}" stroke-dasharray="3 3"/>
      <path d="M${c} ${c - R}V${c + R}M${c - R} ${c}H${c + R}"/></g>
    <g font-size="11" fill="var(--muted)" text-anchor="middle">
      <text x="${c}" y="10">С</text><text x="${c}" y="${size - 2}">Ю</text><text x="${size - 6}" y="${c + 4}">В</text><text x="6" y="${c + 4}">З</text>
      <text x="${c + 3}" y="${c - rr(30) + 11}" text-anchor="start" font-size="9">30°</text><text x="${c + 3}" y="${c - rr(60) + 11}" text-anchor="start" font-size="9">60°</text></g>`;

      <text x="${(x + 8).toFixed(1)}" y="${(y + 3).toFixed(1)}" font-size="9" fill="var(--ink)">${s.svid}</text>`;

}

    ? `<div class="dop"><span class="dot ${g[2]}"></span><b>HDOP ${d.h.toFixed(1)}</b> — ${g[1]} · PDOP ${d.p.toFixed(1)} · VDOP ${d.v.toFixed(1)}</div>`

  return dopLine + (sats.sats ? skyPlot(sats.sats, 240) : '') +

    Закрашенные кружки — в решении, пустые — только видны; ниже пунктира (15°) спутникам веры меньше. Сигнал выше 30 дБ·Гц — хороший, ниже 20 — слабый.</div>`;

  gnssOn = true;
  satMessage('Спутники: поиск… (на открытом месте, без сим-карты — до нескольких минут)');
  GNSS.addListener('status', showSats);

$('satLine').onclick = () => {
  if (!sats) return;
  showSheet(`<div class="sh-head"><b>Спутники ГНСС</b><button class="x" data-close>×</button></div><div id="satBody">${satSheetBody()}</div>`);

$('fabMe').onclick = () => {
  startGnss();
  if (!gps) { startGps(); return; }
  map.setView([gps.lat, gps.lng], Math.max(map.getZoom(), 17));
};

/* ───────────── Точечные знаки ───────────── */

const pointLayer = L.layerGroup().addTo(map);
let selected = null;                          // { kind: 'point'|'line', obj }
function symbolSvg(svg, px, color) { return `<svg viewBox="0 0 24 24" width="${px}" height="${px}" style="color:${color || 'var(--sym)'};display:block">${svg}</svg>`; }
function pointLabel(p) {
  const s = POINTS[p.type] || POINTS.mark;
  return [s.prefix, p.name, s.suffix].filter(Boolean).join(' ');
}
let pointMarkers = [];
function drawPoints() {
  pointLayer.clearLayers();
  pointMarkers = [];
  for (const p of data.points) {
    const s = POINTS[p.type] || POINTS.mark, lbl = pointLabel(p), sel = selected && selected.obj === p;
    const icon = L.divIcon({ className: 'sym' + (sel ? ' sel' : ''), iconSize: [22, 22], iconAnchor: [11, 11],
      html: symbolSvg(s.svg, 22, netColor(p.type)) + (lbl ? `<span class="lbl">${esc(lbl)}</span>` : '') });
    const marker = L.marker([p.lat, p.lng], { icon }).on('click', e => { L.DomEvent.stop(e); if (!mode) showCard('point', p); }).addTo(pointLayer);
    pointMarkers.push({ p, marker, lbl });
  }
}
// Номер у знака — справа, слева, сверху, снизу или по диагонали: первое место, где он ни с чем не пересекается
const LBL_PX = 12.5, SYM_R = 11;
function placePointLabels() {
  for (const { p, marker, lbl } of pointMarkers) {
    const span = marker.getElement() && marker.getElement().querySelector('.lbl');
    if (!span) continue;
    const c = map.latLngToContainerPoint([p.lat, p.lng]), w = textWidth(lbl, LBL_PX, true) + 4, h = LBL_PX + 3, g = 2;
    const tries = [
      { x: c.x + SYM_R + g, y: c.y - h / 2 }, { x: c.x - SYM_R - g - w, y: c.y - h / 2 },
      { x: c.x - w / 2, y: c.y - SYM_R - g - h }, { x: c.x - w / 2, y: c.y + SYM_R + g },
      { x: c.x + SYM_R - 2, y: c.y - SYM_R - h + 2 }, { x: c.x + SYM_R - 2, y: c.y + SYM_R - 2 },
      { x: c.x - SYM_R + 2 - w, y: c.y - SYM_R - h + 2 }, { x: c.x - SYM_R + 2 - w, y: c.y + SYM_R - 2 }
    ];
    const box = tries.map(t => ({ x: t.x, y: t.y, w, h })).find(b => !hits(b, null));
    span.classList.toggle('off', !box);
    if (!box) continue;
    span.style.left = (box.x - (c.x - SYM_R) + 2) + 'px';             // координаты — от левого верхнего угла значка 22×22
    span.style.top = (box.y - (c.y - SYM_R) + 1.5) + 'px';
    reserve(box, 'lbl:' + p.id);
  }
}
// Кадр отрисовки: сначала занимаем места знаками и линиями, потом расставляем надписи
function frame() {
  occupied = [];
  for (const { p } of pointMarkers) { const c = map.latLngToContainerPoint([p.lat, p.lng]); reserve({ x: c.x - SYM_R, y: c.y - SYM_R, w: 2 * SYM_R, h: 2 * SYM_R }, p.id); }
  for (const line of data.lines) {                                    // сама линия — препятствие для чужих надписей
    const pts = line.latlngs.map(a => map.latLngToContainerPoint(a));
    for (let i = 1; i < pts.length; i++) {
      const d = pts[i - 1].distanceTo(pts[i]), n = Math.max(1, Math.ceil(d / 6));
      for (let k = 0; k <= n; k++) { const x = pts[i - 1].x + (pts[i].x - pts[i - 1].x) * k / n, y = pts[i - 1].y + (pts[i].y - pts[i - 1].y) * k / n; reserve({ x: x - 1.5, y: y - 1.5, w: 3, h: 3 }, line.id); }
    }
  }
  placePointLabels();
  drawLines();
}

/* ───────────── Линии сетей: отрисовка с подписями вдоль линии ───────────── */

const NS = 'http://www.w3.org/2000/svg';
map.createPane('netPane').style.zIndex = 450;
const netSvg = document.createElementNS(NS, 'svg');
netSvg.classList.add('netlines');
map.getPane('netPane').appendChild(netSvg);
const hitLayer = L.layerGroup().addTo(map);

function el(tag, attrs, parent) {

function segment(g, path, s0, s1, w, off, dash) {
  const pts = [], o = (off || 0) * MM;

    const p = o ? at(path, s) : path.getPointAtLength(s), a = o ? (p.a + 90) * Math.PI / 180 : 0;
    pts.push((p.x + Math.cos(a) * o).toFixed(1) + ',' + (p.y + Math.sin(a) * o).toFixed(1));

// Опора на линии ЛЭП / связи: точка, кружок или прямоугольник
function poleMark(g, path, s, kind, w) {

  if (kind === 'circle') el('circle', { cx: p.x, cy: p.y, r, fill: 'var(--symBg)', stroke: 'currentColor', 'stroke-width': w }, g);
  if (kind === 'rect') el('rect', { x: -r, y: -r * 0.8, width: 2 * r, height: 1.6 * r, fill: 'currentColor', transform: `translate(${p.x} ${p.y}) rotate(${p.a})` }, g);
}

    transform: `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${a.toFixed(1)}) translate(0 ${o.dy})` }, g).textContent = str;
}
/* ── Расстановка надписей без пересечений: занятые места на экране (знаки, линии, надписи) ── */
let occupied = [], curOwner = null;
const measureCtx = document.createElement('canvas').getContext('2d');
function textWidth(str, px, italic) {

// Прямоугольник надписи шириной w и высотой h с центром в p, повёрнутой на deg и сдвинутой поперёк на dy
function textBox(p, deg, dy, w, h) {
  const a = deg * Math.PI / 180, cx = p.x - Math.sin(a) * dy, cy = p.y + Math.cos(a) * dy;
  const hw = Math.abs(Math.cos(a)) * w / 2 + Math.abs(Math.sin(a)) * h / 2, hh = Math.abs(Math.sin(a)) * w / 2 + Math.abs(Math.cos(a)) * h / 2;
  return { x: cx - hw, y: cy - hh, w: 2 * hw, h: 2 * hh };
}
// Ставит надпись вдоль линии, только если место свободно; возвращает, поставлена ли она
function placeText(g, path, s, str, o) {
  o = Object.assign({ dy: 0, size: 2.8 * MM, italic: true }, o);
  const p = at(path, s), box = textBox(p, upright(p.a), o.dy, textWidth(str, o.size, o.italic) + 6, o.size + 5);   // с запасом на обводку
  if (hits(box, curOwner)) return false;                              // своя линия не мешает, всё остальное — мешает
  text(g, path, s, str, o);
  reserve(box, 'txt');                                                // а поставленная надпись мешает всем, в том числе надписям своей линии
  return true;
}
function arrowHead(g, path, s, dir, double, w) {
  const p = at(path, s), a = p.a * Math.PI / 180;
  for (const off of double ? [0, 1.7 * MM] : [0]) {
    const bx = p.x - Math.cos(a) * off * dir, by = p.y - Math.sin(a) * off * dir, len = 1.3 * MM, sp = 0.45;
    el('polyline', { points: `${bx - Math.cos(a - sp) * len * dir},${by - Math.sin(a - sp) * len * dir} ${bx},${by} ${bx - Math.cos(a + sp) * len * dir},${by - Math.sin(a + sp) * len * dir}`,
      fill: 'none', stroke: 'currentColor', 'stroke-width': w, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, g);
  }
}

const DRAW = {
  // «——Вп——Вп——»; двойная линия (канал, коллектор), футляр, стрелка течения; индекс в резерве — «тр»
  indexed(g, path, spec, line, w) {
    const total = path.getTotalLength(), period = 9 * MM, size = 3 * MM;
    const index = line.state === 'reserve' ? 'тр' : spec.numberedIndex ? String(line.count || 1) : (line.count > 1 ? line.count : '') + spec.index;
    const gap = textWidth(index, size, true) + 1.6 * MM;                 // разрыв точно по ширине индекса и с полями
    const run = (a, b) => {
      if (spec.double) { segment(g, path, a, b, w, -spec.double); segment(g, path, a, b, w, spec.double); } else segment(g, path, a, b, w);
      if (spec.sleeve) { segment(g, path, a, b, Math.max(1, C * MM), -1.4, `${1.6 * MM} ${0.8 * MM}`); segment(g, path, a, b, Math.max(1, C * MM), 1.4, `${1.6 * MM} ${0.8 * MM}`); }
    };
    for (let s = 0; s < total;) {
      const e = Math.min(s + period, total);
      run(s, e);
      if (e + gap < total && !placeText(g, path, e + gap / 2, index, { size })) run(e, e + gap);   // место занято — линия без разрыва
      s = e + gap;
    }
    if (spec.flow && total > 14 * MM) {                                 // стрелка направления течения — по ходу рисования
      const q = at(path, total * 0.8);
      el('polygon', { points: `0,0 ${-2.4 * MM},${-0.9 * MM} ${-2.4 * MM},${0.9 * MM}`, fill: 'currentColor', transform: `translate(${q.x} ${q.y}) rotate(${q.a})` }, g);
    }
  },
  // Кабели: «←→ ——— ←→»; в блоках/канале — число прокладок в разрывах, в канале — двойная линия без стрелок; сторожки
  cable(g, path, spec, line, w) {
    const total = path.getTotalLength(), arrowLen = 8 * MM, plain = 9 * MM, size = 3 * MM;
    const num = spec.numbered ? String(line.count || spec.defCount || 1) : null, gap = num ? textWidth(num, size, true) + 1.6 * MM : 2 * MM;
    const run = (a, b) => { if (spec.double2) { segment(g, path, a, b, w, -spec.double2); segment(g, path, a, b, w, spec.double2); } else segment(g, path, a, b, w); };
    const sep = (a) => { if (num && a + gap < total && !placeText(g, path, a + gap / 2, num, { size })) run(a, a + gap); };
    for (let s = 0, n = 0; s < total; n++) {
      const a1 = Math.min(s + arrowLen, total);
      run(s, a1);
      if (a1 - s > 3 * MM && !spec.double2) { arrowHead(g, path, s, -1, spec.double, w); arrowHead(g, path, a1, 1, spec.double, w); }
      if (!num && n % 2 === 0 && a1 - s > 4 * MM) placeText(g, path, (s + a1) / 2, 'каб.', { dy: -2.8 * MM, size: 2.8 * MM });
      if (spec.post && n % 2 === 1 && a1 - s > 4 * MM) { const m = (s + a1) / 2; poleMark(g, path, m, 'dot', w); tick(g, path, m, 1.8, w); }
      sep(a1); s = a1 + gap;
      if (s >= total) break;
      const p1 = Math.min(s + plain, total);
      run(s, p1);
      sep(p1); s = p1 + gap;
    }
  },
  // ЛЭП: «←•→ ——— ←•→», опора в середине стрелочного отрезка; напряжение и число проводов — подписью линии
  power(g, path, spec, line, w) {
    const total = path.getTotalLength(), arrowLen = 9 * MM, plain = 8 * MM;
    for (let s = 0; s < total;) {
      const a1 = Math.min(s + arrowLen, total);
      segment(g, path, s, a1, w);
      if (a1 - s > 4 * MM) { arrowHead(g, path, s, -1, spec.double, w); arrowHead(g, path, a1, 1, spec.double, w); poleMark(g, path, (s + a1) / 2, spec.pole, w); }
      s = a1; if (s >= total) break;
      const p1 = Math.min(s + plain, total); segment(g, path, s, p1, w); s = p1;
    }
  },
  // Воздушная связь: тонкая линия с кружками опор через 9 мм
  air(g, path, spec, line, w) {
    const total = path.getTotalLength(), step = 9 * MM;
    segment(g, path, 0, total, w);
    for (let s = step / 2; s < total; s += step) poleMark(g, path, s, 'circle', w);
  },
  plain(g, path, spec, line, w) { segment(g, path, 0, path.getTotalLength(), w); },
  route(g, path, spec, line, w, pts) {
    const total = path.getTotalLength(), dash = 4 * MM, space = 1.5 * MM;
    for (let s = 0; s < total;) { const e = Math.min(s + dash, total); segment(g, path, s, e, w); s = e + space; }
    // Пикеты через каждые 100 м по местности: переводим метры в пиксели по отрезкам
    const lls = line.latlngs.map(a => L.latLng(a));
    let metersBefore = 0, pxBefore = 0, k = 0;
    for (let i = 1; i < lls.length; i++) {
      const m = lls[i - 1].distanceTo(lls[i]), px = pts[i - 1].distanceTo(pts[i]);
      while ((k * PICKET_STEP_M) <= metersBefore + m + 1e-6) {
        const sPx = pxBefore + (m ? (k * PICKET_STEP_M - metersBefore) / m : 0) * px, p = at(path, Math.min(sPx, total));
        const a = (p.a + 90) * Math.PI / 180, h = 1.6 * MM;
        el('line', { x1: p.x - Math.cos(a) * h, y1: p.y - Math.sin(a) * h, x2: p.x + Math.cos(a) * h, y2: p.y + Math.sin(a) * h, stroke: 'currentColor', 'stroke-width': w * 1.4 }, g);
        if (line.pk0 != null && line.pk0 !== '') {
          const pk = 'ПК ' + (Number(line.pk0) + k * (line.pkDir || 1)), at_ = Math.min(sPx, total);
          placeText(g, path, at_, pk, { dy: 3.8 * MM, size: 2.8 * MM, italic: false }) || placeText(g, path, at_, pk, { dy: -3.8 * MM, size: 2.8 * MM, italic: false });
        }
        k++;
      }
      metersBefore += m; pxBefore += px;
    }
  }
};

function drawLines() {
  const size = map.getSize();
  L.DomUtil.setPosition(netSvg, map.containerPointToLayerPoint([0, 0]));
  netSvg.setAttribute('width', size.x); netSvg.setAttribute('height', size.y);
  netSvg.innerHTML = '';
  for (const line of data.lines) {
    const spec = LINES[line.type] || LINES.plain;
    const pts = line.latlngs.map(a => map.latLngToContainerPoint(a));
    if (pts.length < 2) continue;
    const g = el('g', {}, netSvg);
    const isSel = selected && selected.obj === line;
    g.style.color = isSel ? 'var(--accent)' : netColor(line.type, spec.color || 'var(--sym)');
    const path = el('path', { d: 'M' + pts.map(p => p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' L'), fill: 'none', stroke: 'none' }, g);
    if (path.getTotalLength() < 6) continue;
    curOwner = line.id;                                                // надписи своей линии не мешают ей самой
    const w = Math.max(1, spec.w * MM) * (isSel ? 1.8 : 1), thin = Math.max(0.8, 0.15 * MM) * (isSel ? 1.8 : 1), total = path.getTotalLength();
    // состояние линии: проектируемая и вынесенная в натуру — тонким пунктиром, остальные — обычным знаком с пометкой
    if (line.state === 'project') segment(g, path, 0, total, thin, 0, `${10 * MM} ${4 * MM}`);
    else if (line.state === 'staked') { segment(g, path, 0, total, thin, 0, `${10 * MM} ${2 * MM}`); for (let s = 11 * MM; s < total; s += 12 * MM) tick(g, path, s, 2, thin); }
    else if (line.state === 'build' || line.state === 'approx') segment(g, path, 0, total, thin);
    else DRAW[spec.kind](g, path, spec, line, line.state === 'off' ? Math.max(1, C * MM) : w, pts);   // тонкая ровная линия, как пером
    if (line.state === 'off') for (let s = 5 * MM; s < total; s += 11 * MM) tick(g, path, s, 2.8, Math.max(1, C * MM) * 1.3, 60);   // косые штрихи — недействующая
    const tag = { build: 'стр.', approx: 'ориент.' }[line.state];
    const cap = [tag, spec.tag, line.caption].filter(Boolean).join(' ');
    if (cap) captionAlong(g, path, pts, cap);
    curOwner = null;
  }
}
// Подпись линии — над (или под) серединой участка, где она помещается и ни с чем не пересекается; иначе появится при приближении
function captionAlong(g, path, pts, str) {
  const size = 2.9 * MM, need = textWidth(str, size, true) + 2 * MM, segs = [];
  let run = 0;
  for (let i = 1; i < pts.length; i++) { const d = pts[i - 1].distanceTo(pts[i]); segs.push({ d, mid: run + d / 2 }); run += d; }
  segs.sort((a, b) => b.d - a.d);                                     // сначала самые длинные участки
  for (const sg of segs) {
    if (sg.d < need) break;
    for (const dy of [-3.2 * MM, 3.2 * MM])
      for (const shift of [0, -0.25, 0.25]) if (placeText(g, path, sg.mid + shift * (sg.d - need), str, { dy, size })) return;
  }
}
function drawHits() {
  hitLayer.clearLayers();
  for (const line of data.lines)
    L.polyline(line.latlngs, { opacity: 0, weight: 24, interactive: true }).on('click', e => { L.DomEvent.stop(e); if (!mode) showCard('line', line); }).addTo(hitLayer);
}
map.on('moveend zoomend resize viewreset', frame);
map.on('zoomstart', () => netSvg.style.opacity = 0);
map.on('zoomend', () => netSvg.style.opacity = 1);
function redrawAll() { drawPoints(); drawHits(); frame(); }
function lineLength(line) { let m = 0; for (let i = 1; i < line.latlngs.length; i++) m += L.latLng(line.latlngs[i - 1]).distanceTo(line.latlngs[i]); return m; }

/* ───────────── Карточка объекта (внизу экрана) ───────────── */

function linePreview(spec, w, h) {
  w = w || 46; h = h || 22;
  const c = netColor(spec.id, spec.color || 'var(--sym)'), m = h / 2;
  const head = (x, d) => `<path d="M${x + 4 * d} ${m - 4}L${x} ${m}L${x + 4 * d} ${m + 4}" fill="none" stroke="currentColor" stroke-width="1.3"/>`;
  let body;
  const ital = 'font-style="italic" font-family="Roboto Condensed, Arial Narrow, Arial, sans-serif" fill="currentColor"';
  if (spec.kind === 'cable' && spec.double2) body = `<path d="M2 ${m - 3}H${w * 0.38}M${w * 0.62} ${m - 3}H${w - 2}M2 ${m + 3}H${w * 0.38}M${w * 0.62} ${m + 3}H${w - 2}" stroke="currentColor" stroke-width="1.1"/><text x="${w / 2}" y="${m + 4.5}" font-size="12" text-anchor="middle" ${ital}>${spec.defCount}</text>`;
  else if (spec.kind === 'cable' && spec.numbered) body = `<path d="M3 ${m}H${w * 0.36}M${w * 0.64} ${m}H${w - 3}" stroke="currentColor" stroke-width="1.2"/>${head(3, 1)}${head(w - 3, -1)}<text x="${w / 2}" y="${m + 4.5}" font-size="12" text-anchor="middle" ${ital}>${spec.defCount}</text>`;
  else if (spec.kind === 'cable') body = `<path d="M4 ${m}H${w - 4}" stroke="currentColor" stroke-width="1.2"/>${head(4, 1)}${head(w - 4, -1)}${spec.double ? head(9, 1) + head(w - 9, -1) : ''}${spec.post ? `<circle cx="${w / 2}" cy="${m}" r="2.2" fill="currentColor"/><path d="M${w / 2} ${m}V${m - 6}" stroke="currentColor" stroke-width="1.2"/>` : ''}`;
  else if (spec.kind === 'power') {
    const pole = spec.pole === 'dot' ? `<circle cx="${w / 2}" cy="${m}" r="2.4" fill="currentColor"/>` : spec.pole === 'rect' ? `<rect x="${w / 2 - 3}" y="${m - 2.2}" width="6" height="4.4" fill="currentColor"/>` : `<circle cx="${w / 2}" cy="${m}" r="2.4" fill="var(--symBg)" stroke="currentColor" stroke-width="1.2"/>`;
    body = `<path d="M4 ${m}H${w - 4}" stroke="currentColor" stroke-width="1.2"/>${head(4, 1)}${head(w - 4, -1)}${spec.double ? head(9, 1) + head(w - 9, -1) : ''}${pole}`;
  }
  else if (spec.kind === 'air') body = `<path d="M2 ${m}H${w - 2}" stroke="currentColor" stroke-width="1.1"/>${[0.2, 0.5, 0.8].map(k => `<circle cx="${w * k}" cy="${m}" r="2.2" fill="var(--symBg)" stroke="currentColor" stroke-width="1.1"/>`).join('')}`;
  else if (spec.kind === 'indexed' && spec.double) body = `<path d="M2 ${m - 3.5}H${w * 0.3}M${w * 0.7} ${m - 3.5}H${w - 2}M2 ${m + 3.5}H${w * 0.3}M${w * 0.7} ${m + 3.5}H${w - 2}" stroke="currentColor" stroke-width="1.1"/><text x="${w / 2}" y="${m + 4.5}" font-size="12" text-anchor="middle" ${ital}>${spec.defCount && spec.defCount > 1 ? spec.defCount : ''}${spec.index}</text>`;
  else if (spec.kind === 'indexed' && spec.sleeve) body = `<path d="M2 ${m}H${w * 0.3}M${w * 0.7} ${m}H${w - 2}" stroke="currentColor" stroke-width="1.6"/><path d="M2 ${m - 5}H${w - 2}M2 ${m + 5}H${w - 2}" stroke="currentColor" stroke-width="1" stroke-dasharray="5 3"/><text x="${w / 2}" y="${m + 4.5}" font-size="12" text-anchor="middle" ${ital}>${spec.index}</text>`;
  else if (spec.kind === 'indexed' && spec.numberedIndex) body = `<path d="M2 ${m}H${w * 0.36}M${w * 0.64} ${m}H${w - 2}" stroke="currentColor" stroke-width="1.2"/><text x="${w / 2}" y="${m + 4.5}" font-size="12" text-anchor="middle" ${ital}>${spec.defCount}</text>`;
  else if (spec.kind === 'route') body = `<path d="M2 ${m}H${w - 2}" stroke="currentColor" stroke-width="2.2" stroke-dasharray="7 3"/><path d="M${w * 0.3} ${m - 5}V${m + 5}M${w * 0.7} ${m - 5}V${m + 5}" stroke="currentColor" stroke-width="2"/>`;
  else if (spec.kind === 'plain') body = `<path d="M2 ${m}H${w - 2}" stroke="currentColor" stroke-width="1.8"/>`;
  else body = `<path d="M2 ${m}H${w * 0.3}M${w * 0.7} ${m}H${w - 2}" stroke="currentColor" stroke-width="1.5"/><text x="${w / 2}" y="${m + 4.5}" font-size="12.5" text-anchor="middle" ${ital}>${spec.index}</text>${spec.flow ? `<path d="M${w - 2} ${m}l-6 -2.6v5.2Z" fill="currentColor"/>` : ''}`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="color:${c};display:block">${body}</svg>`;
}
function showCard(kind, obj) {
  selected = { kind, obj };
  const card = $('card');
  let icon, name, sub, kv, ll;
  if (kind === 'point') {
    const s = POINTS[obj.type] || POINTS.mark, c = coordText(L.latLng(obj.lat, obj.lng));
    icon = symbolSvg(s.svg, 34, netColor(obj.type)); name = s.name + (obj.name ? ' — ' + esc(pointLabel(obj)) : '');
    sub = obj.note ? esc(obj.note) : 'зона ' + c.s.zone;
    kv = [[esc(planeName()), `X ${f2(c.s.x)}<br>Y ${f2(c.s.y)}`], ['WGS-84', c.wgs]];
    if (obj.h != null && obj.h !== '') kv.push(['Отметка', esc(obj.h) + ' м']);
    if (obj.meas) {
      const m = obj.meas, mark = { ok: '✓ годится', mid: '≈ на пределе', bad: '✗ не годится' }[m.ok] || '';
      kv.push(['Измерение', `±${cmText(m.m)} за ${m.sec} с, отсчётов ${m.n}${m.hdop != null ? ', HDOP ' + m.hdop : ''}<br>${mark} для 1:${m.scale} (допуск ${cmText(m.tol)})`]);
    }
    ll = [obj.lat, obj.lng];
  } else {
    const s = LINES[obj.type] || LINES.plain;
    icon = linePreview(s, 40, 34); name = s.name + (obj.count > 1 ? ` · прокладок ${obj.count}` : '');
    sub = [s.tag, obj.caption].filter(Boolean).map(esc).join(' ') || 'без подписи';
    kv = [['Длина', lineLength(obj).toLocaleString('ru-RU', { maximumFractionDigits: 1 }) + ' м'], ['Точек', obj.latlngs.length]];
    if (obj.state) kv.push(['Состояние', STATE_NAME[obj.state] || obj.state]);
    if (s.kind === 'route' && obj.pk0 != null) kv.push(['Пикеты', `от ПК ${obj.pk0}, ${obj.pkDir === -1 ? 'по убыванию' : 'по возрастанию'}`]);
  }
  card.innerHTML = `<div class="t">${icon}<div><div class="name">${name}</div><div class="sub">${sub}</div></div><button class="x" data-act="close">×</button></div>
    <div class="kv">${kv.map(([k, v]) => `<span>${k}</span><span>${v}</span>`).join('')}</div>
    <div class="acts"><button class="btn" data-act="edit">Изменить</button><button class="btn" data-act="copy">Копировать</button><button class="btn danger" data-act="del">Удалить</button></div>`;
  card.style.display = 'block';
  card.onclick = e => {
    const act = e.target.closest('[data-act]') && e.target.closest('[data-act]').dataset.act;
    if (act === 'close') hideCard();
    if (act === 'edit') { kind === 'point' ? editPoint(obj) : editLine(obj); }
    if (act === 'copy') copyCoords(kind, obj);
    if (act === 'del' && confirm(kind === 'point' ? 'Удалить этот знак?' : 'Удалить эту линию?')) {
      if (kind === 'point') data.points = data.points.filter(x => x !== obj); else data.lines = data.lines.filter(x => x !== obj);
      save(); hideCard();
    }
  };
  if (kind === 'point' && ll) map.panInside(ll, { paddingBottomRight: [0, card.offsetHeight + 90], paddingTopLeft: [0, $('top').offsetHeight + 20] });
  redrawAll();
}
function hideCard() { $('card').style.display = 'none'; selected = null; redrawAll(); }
map.on('click', () => { if (!mode && selected) hideCard(); });
async function copyCoords(kind, obj) {
  let txt;
  if (kind === 'point') { const s = sk42(obj.lat, obj.lng); txt = `${pointLabel(obj) || (POINTS[obj.type] || POINTS.mark).name}\tX ${s.x.toFixed(2)}\tY ${s.y.toFixed(2)}\t${f6(obj.lat)}\t${f6(obj.lng)}`; }
  else txt = obj.latlngs.map((a, i) => { const s = sk42(a[0], a[1]); return `${i + 1}\tX ${s.x.toFixed(2)}\tY ${s.y.toFixed(2)}`; }).join('\n');
  try { await navigator.clipboard.writeText(txt); toast('Координаты скопированы'); }
  catch (e) { prompt('Скопируйте координаты:', txt.replace(/\t/g, '  ').replace(/\n/g, ' | ')); }
}

/* ───────────── Формы (вместо системных окошек) ───────────── */

// fields: [{ key, label, type: 'text'|'number'|'select', value, options: [[v, t]], hint, half }]
function openForm(title, fields, onSave, saveText) {
  const f = fields.map(x => {
    const id = 'f_' + x.key;
    const input = x.type === 'select'
      ? `<select id="${id}">${x.options.map(([v, t]) => `<option value="${esc(v)}"${String(v) === String(x.value) ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>`
      : `<input id="${id}" type="${x.type === 'number' ? 'text' : 'text'}" inputmode="${x.type === 'number' ? 'decimal' : 'text'}" value="${esc(x.value == null ? '' : x.value)}" placeholder="${esc(x.placeholder || '')}" autocomplete="off">`;
    return { half: x.half, html: `<div><label for="${id}">${esc(x.label)}</label>${input}${x.hint ? `<div class="hint">${esc(x.hint)}</div>` : ''}</div>` };
  });
  let body = '';
  for (let i = 0; i < f.length; i++) {
    if (f[i].half && f[i + 1] && f[i + 1].half) { body += `<div class="row2">${f[i].html}${f[i + 1].html}</div>`; i++; }
    else body += f[i].html;
  }
  showSheet(`<div class="sh-head"><b>${esc(title)}</b><button class="x" data-close>×</button></div><div class="form">${body}

const parseNum = s => Number(String(s).replace(/\s/g, '').replace(',', '.'));

/* ── Сохранить участок заранее (для работы без интернета) ── */
const TILE_KB = 18;                  // средний размер куска карты — для оценки объёма
const PREFETCH_MAX_TILES = 4000;     // больше за раз не качаем: бережём и телефон, и сервер карты
const PREFETCH_PARALLEL = 3;         // одновременно не больше трёх запросов — так просит политика OSM
function tileRange(b, z) {
  const n = 2 ** z, tx = lng => Math.floor((lng + 180) / 360 * n);
  const ty = lat => { const r = lat * Math.PI / 180; return Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n); };
  return { x0: tx(b.getWest()), x1: tx(b.getEast()), y0: ty(b.getNorth()), y1: ty(b.getSouth()) };
}
function tileUrl(layer, z, x, y) {
  const sub = layer.options.subdomains, s = sub && sub.length ? sub[Math.abs(x + y) % sub.length] : '';
  return L.Util.template(layer._url, { s, z, x, y, r: '' });
}
let prefetching = false;
async function saveArea() {
  if (prefetching) { toast('Уже сохраняю — подождите'); return; }
  const layer = bases[baseName], o = layer.options;
  if (!o.cache || !o.prefetch) { alert(`«${baseName}» по условиям поставщика нельзя сохранять в телефон.\nВыберите в слоях схему OSM, рельеф или Sentinel-2.`); return; }
  const b = map.getBounds(), zMax = o.prefetch, zMin = Math.max(8, Math.min(zMax, Math.floor(map.getZoom()) - 3)), jobs = [];
  for (let z = zMin; z <= zMax; z++) { const r = tileRange(b, z); for (let x = r.x0; x <= r.x1; x++) for (let y = r.y0; y <= r.y1; y++) jobs.push({ z, x, y }); }
  if (jobs.length > PREFETCH_MAX_TILES) { alert(`Район слишком большой: ${jobs.length} кусков карты (можно до ${PREFETCH_MAX_TILES}).\nПриблизьте карту к своему участку и повторите.`); return; }
  if (!confirm(`Сохранить видимый участок для работы без интернета?\n\nПодложка: ${baseName}\nКусков карты: ${jobs.length}, примерно ${Math.max(1, Math.round(jobs.length * TILE_KB / 1024))} МБ\n\nЗаранее сохраняется до масштаба около 1:8000 (так требуют правила OpenStreetMap). Крупнее — карта сохраняется сама, когда вы просматриваете участок при интернете.`)) return;
  prefetching = true;
  let done = 0, failed = 0;
  const next = async () => {
    while (jobs.length) {
      const j = jobs.shift(), key = `${o.cacheId}/${j.z}/${j.x}/${j.y}`;
      if (!(await tileStore('readonly', s => s.count(key)))) {
        try {
          const r = await fetch(tileUrl(layer, j.z, j.x, j.y), { mode: 'cors' });
          if (!r.ok) throw new Error(r.status);
          const blob = await r.blob();                                // сначала целиком получаем кусок, потом сохраняем
          await tileStore('readwrite', s => s.put(blob, key));
        }
        catch (e) { failed++; }
      }
      if (++done % 40 === 0) toast(`Сохраняю карту: ${done} из ${done + jobs.length}`);
    }
  };
  await Promise.all(Array.from({ length: PREFETCH_PARALLEL }, next));
  prefetching = false;
  toast(failed ? `Сохранено, но ${failed} кусков не скачались — проверьте интернет и повторите` : 'Участок сохранён — можно работать без интернета');
}

  openList('Карты в телефоне', [

    { id: 'clear', icon: '🗑', text: 'Удалить все сохранённые карты' }

/* ───────────── Слой: сетка СК-42 (кресты, как на планшете) ───────────── */

const GRID_STEPS = [10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000];
const GRID_MIN_PX = 120;         // кресты не чаще, чем через 120 пикселей — чтобы поместились подписи
const GRID_ARM = 0.1;            // половина креста — 10 % шага сетки, кресты растут вместе с картой
const GRID_COLOR = '#2e7d32';    // кресты — зелёные
const GRID_LINE_COLOR = '#66bb6a';

const GRID_MAX_CROSSES = 400;    // предохранитель: больше крестов на экране не рисуем

  onAdd(m) {

  },
  onRemove(m) {

  },
  _draw() {

    const minY = Math.min(...corners.map(c => c.y)), maxY = Math.max(...corners.map(c => c.y));

    if (!step) return;                                                   // мельче ~1:300 000 сетку не рисуем (и проекция зоны там уже неточна)

      const bx = { x: cc.x + gap - PAD, y: cc.y - 3 - fh - PAD, w: wx + 2 * PAD, h: fh + 2 * PAD + 2 };

  }

const RasterLayer = L.Layer.extend({

  });
}

/* ───────────── Старт ───────────── */

ready = true;
if (NATIVE) { startGnss(); startGps(); checkUpdate(); }   // в Android-приложении спутники и GPS включаются сразу, проверяется обновление
// на сайте — фоновый помощник, чтобы приложение открывалось без интернета (в Android-приложении всё и так внутри)
if (!NATIVE && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { /* без него просто нужен интернет */ });
redrawAll();
updateInfo();
layout();                                            // после updateInfo: плашка уже с координатами и своей настоящей высотой
window.addEventListener('resize', layout);
// плашка меняет высоту (WGS / СК-42 / оба, длинная строка GPS) — кнопки и подсказки сдвигаются следом
if (window.ResizeObserver) new ResizeObserver(layout).observe($('top'));
loadRasters();
if (data.points.length || data.lines.length) MENU.fit();
</script>
</body>
</html>
