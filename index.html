<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1f5fbf">
<title>Полевой план</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"></script>
<style>
  /* ── темы: день / солнце / ночь ── */
  body.day   { --bg:#f4f1e8; --panel:#ffffff; --ink:#151515; --muted:#5d5d5d; --line:#d9d6cc; --accent:#1f5fbf; --accentInk:#fff; --red:#c62828; --sym:#111111; --symBg:#ffffff; --halo:#ffffff; --shadow:0 1px 6px rgba(0,0,0,.18); --fs:14px; }
  body.sun   { --bg:#ffffff; --panel:#ffffff; --ink:#000000; --muted:#222222; --line:#000000; --accent:#0039a6; --accentInk:#fff; --red:#b00000; --sym:#000000; --symBg:#ffffff; --halo:#ffffff; --shadow:0 0 0 2px #000; --fs:15.5px; }
  body.night { --bg:#1c2127; --panel:#262c33; --ink:#e9edf1; --muted:#9aa5b1; --line:#38414b; --accent:#5aa2ff; --accentInk:#0d1117; --red:#ff6b6b; --sym:#e9edf1; --symBg:#1c2127; --halo:#1c2127; --shadow:0 1px 8px rgba(0,0,0,.5); --fs:14px; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; background:var(--bg); font:var(--fs)/1.35 system-ui, "Segoe UI", Roboto, sans-serif; color:var(--ink); }
  #map { position:absolute; inset:0; background:var(--bg); }
  body.night .leaflet-tile-pane { filter: brightness(.55) contrast(1.15) saturate(.55); }
  body.sun .leaflet-tile-pane { filter: contrast(1.2) saturate(1.1); }
  button { font:inherit; color:inherit; }

  /* ── верхняя плашка координат ── */
  #top { position:absolute; left:8px; right:8px; top:8px; z-index:1000; background:var(--panel); color:var(--ink); border-radius:14px; padding:8px 10px; box-shadow:var(--shadow); font-variant-numeric:tabular-nums; }
  #top .r1 { display:flex; justify-content:space-between; align-items:center; gap:6px; }
  .seg { display:flex; background:var(--line); border-radius:9px; padding:2px; }
  body.sun .seg { background:#fff; border:2px solid #000; }
  .seg button { border:0; background:none; padding:5px 10px; border-radius:7px; color:var(--muted); font-size:12.5px; }
  .seg button.on { background:var(--panel); color:var(--ink); font-weight:700; }
  body.sun .seg button.on { background:#000; color:#fff; }
  #zone { font-size:12px; color:var(--muted); }
  .xy { font-size:1.08em; font-weight:700; margin-top:4px; letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .xy small { font-weight:400; color:var(--muted); font-size:.75em; }
  #gpsLine { display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); margin-top:3px; }
  .dot { width:9px; height:9px; border-radius:50%; background:#9e9e9e; flex:none; }
  .dot.ok { background:#2e7d32; } .dot.mid { background:#f9a825; } .dot.bad { background:#c62828; }

  /* ── перекрестье ── */
  #cross { position:absolute; left:50%; top:50%; width:34px; height:34px; margin:-17px 0 0 -17px; z-index:900; pointer-events:none; }

  /* ── круглые кнопки справа ── */
  #fabs { position:absolute; right:10px; z-index:1000; display:flex; flex-direction:column; gap:10px; }
  .fab { width:50px; height:50px; border-radius:50%; border:0; background:var(--panel); color:var(--ink); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow); }
  .fab svg { width:26px; height:26px; }
  .fab.on { background:var(--accent); color:var(--accentInk); }

  /* ── масштаб ── */
  #scale { position:absolute; left:10px; z-index:1000; background:var(--panel); color:var(--ink); border-radius:9px; padding:4px 9px 5px; font-size:12.5px; font-weight:700; box-shadow:var(--shadow); pointer-events:none; }
  #scale i { display:block; height:5px; border:2px solid var(--ink); border-top:0; margin-top:3px; }

  /* ── нижняя панель ── */
  #bar { position:absolute; left:0; right:0; bottom:0; z-index:1000; background:var(--panel); display:flex; justify-content:space-around; padding:8px 4px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); }
  body.sun #bar { border-top:2px solid #000; }
  #bar button { border:0; background:none; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--muted); font-size:12.5px; width:72px; padding:0; }
  #bar .ic { width:56px; height:36px; border-radius:18px; display:flex; align-items:center; justify-content:center; }
  #bar svg { width:26px; height:26px; }
  #bar button.on { color:var(--ink); font-weight:700; }
  #bar button.on .ic { background:color-mix(in srgb, var(--accent) 22%, transparent); color:var(--accent); }

  /* ── панель режима (ставим знак / рисуем линию) ── */
  #mode { position:absolute; left:8px; right:8px; z-index:1000; background:var(--panel); color:var(--ink); border-radius:16px; box-shadow:var(--shadow); padding:10px 12px; display:none; }
  #mode .title { display:flex; align-items:center; gap:8px; font-weight:700; margin-bottom:8px; }
  #mode .title svg { flex:none; }
  #mode .btns { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
  .btn { border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:12px; padding:11px 6px; font-weight:600; font-size:.95em; min-height:46px; }
  body.sun .btn { border:2px solid #000; }
  .btn.primary { background:var(--accent); color:var(--accentInk); border-color:var(--accent); }
  .btn.danger { color:var(--red); }

  /* ── нижние листы ── */
  #sheet { position:absolute; inset:0; z-index:2000; background:rgba(0,0,0,.38); display:none; }
  #sheet .panel { position:absolute; left:0; right:0; bottom:0; max-height:82%; overflow:auto; background:var(--panel); color:var(--ink); border-radius:18px 18px 0 0; padding:10px 12px calc(20px + env(safe-area-inset-bottom)); }
  .grab { width:40px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 10px; }
  .sh-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .sh-head b { font-size:1.1em; }
  .x { border:0; background:var(--line); color:var(--ink); width:36px; height:36px; border-radius:50%; font-size:18px; line-height:1; }
  .search { display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:12px; padding:0 10px; color:var(--muted); }
  body.sun .search { border:2px solid #000; }
  .search input { flex:1; border:0; outline:0; background:none; color:var(--ink); font:inherit; padding:11px 0; }
  .tabs { display:flex; gap:6px; margin:10px 0 6px; overflow-x:auto; padding-bottom:2px; }
  .tabs button { flex:none; border:1px solid var(--line); background:none; color:var(--muted); font-size:13px; padding:7px 12px; border-radius:16px; }
  .tabs button.on { background:var(--accent); color:var(--accentInk); border-color:var(--accent); font-weight:700; }
  .h { font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:12px 2px 6px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill, minmax(78px, 1fr)); gap:7px; }
  .tile { border:1px solid var(--line); background:none; color:var(--ink); border-radius:13px; padding:9px 4px 7px; display:flex; flex-direction:column; align-items:center; gap:5px; text-align:center; font-size:11.5px; line-height:1.15; min-height:84px; }
  body.sun .tile { border:2px solid #000; }
  .tile:active { background:color-mix(in srgb, var(--accent) 15%, transparent); }
  .tile svg { flex:none; }
  .empty { color:var(--muted); font-size:13px; padding:8px 2px; }
  .list .item { display:flex; align-items:center; gap:12px; padding:13px 6px; border-bottom:1px solid var(--line); }
  .list .item:active { background:color-mix(in srgb, var(--accent) 12%, transparent); }
  .list .item .i { width:26px; text-align:center; font-size:18px; flex:none; }
  .list .item.on { font-weight:700; color:var(--accent); }
  .list .item .chk { margin-left:auto; font-size:18px; color:var(--accent); }

  /* ── формы ── */
  .form label { display:block; font-size:12.5px; color:var(--muted); margin:10px 2px 4px; }
  .form input, .form select { width:100%; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:11px; padding:11px 12px; font:inherit; }
  body.sun .form input, body.sun .form select { border:2px solid #000; }
  .form .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .form .hint { font-size:12px; color:var(--muted); margin:6px 2px 0; }
  .form .acts { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:16px; }

  /* ── карточка объекта ── */
  #card { position:absolute; left:8px; right:8px; z-index:1100; background:var(--panel); color:var(--ink); border-radius:16px; padding:12px; box-shadow:var(--shadow); display:none; }
  #card .t { display:flex; align-items:center; gap:10px; }
  #card .t > div { flex:1; min-width:0; }
  #card .name { font-weight:700; font-size:1.08em; }
  #card .sub { color:var(--muted); font-size:12.5px; }
  #card .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 10px; margin:10px 0; font-size:13.5px; font-variant-numeric:tabular-nums; }
  #card .kv span:nth-child(odd) { color:var(--muted); }
  #card .acts { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }

  /* ── знаки и подписи на карте ── */
  .sym { background:none; border:0; color:var(--sym); }
  svg [fill="#fff"] { fill:var(--symBg); }                              /* белая заливка знаков — ночью тёмная, чтобы светлые черты были видны */
  .sym .lbl { position:absolute; left:24px; top:-2px; white-space:nowrap; font:italic 12px Georgia, "Times New Roman", serif; color:var(--sym);
    text-shadow:0 0 2px var(--halo), 0 0 2px var(--halo), 0 0 3px var(--halo); }
  .sym.sel svg { filter: drop-shadow(0 0 3px var(--accent)) drop-shadow(0 0 3px var(--accent)); }
  .gridlbl { background:none; border:0; pointer-events:none; }
  .gridlbl .glw { position:absolute; left:0; top:0; transform-origin:0 0; }
  .gridlbl .gx, .gridlbl .gy { position:absolute; white-space:nowrap; line-height:1; color:#1b5e20; font-weight:600;
    font-family: system-ui, "Segoe UI", Roboto, sans-serif; font-variant-numeric: tabular-nums;
    text-shadow: 0 0 2px var(--halo), 0 0 2px var(--halo), 0 0 3px var(--halo), 0 0 4px var(--halo); }
  body.night .gridlbl .gx, body.night .gridlbl .gy { color:#a5d6a7; }
  .gridlbl .gx { top:-3px; transform:translateY(-100%); }               /* над горизонтальной чертой, справа */
  .gridlbl .gyw { position:absolute; left:0; top:0; transform:rotate(-90deg); transform-origin:0 0; }
  .gridlbl .gy { top:-3px; transform:translateY(-100%); }               /* после поворота — над вертикальной чертой (слева от неё) */
  .netlines { overflow:visible; pointer-events:none; }
  .netlines text { paint-order: stroke; stroke:var(--halo); stroke-width:3px; stroke-linejoin:round; }

  /* ── Leaflet: свой список слоёв и масштаб, кнопки +/− под плашкой ── */
  .leaflet-control-layers, .leaflet-control-scale { display:none !important; }
  .leaflet-top.leaflet-left { top:var(--topH, 92px); }
  .leaflet-control-zoom a { width:40px !important; height:40px !important; line-height:40px !important; font-size:20px !important; background:var(--panel) !important; color:var(--ink) !important; border-color:var(--line) !important; }
  .leaflet-bottom { bottom:var(--barH, 70px); }
  .leaflet-control-attribution { background:color-mix(in srgb, var(--panel) 80%, transparent) !important; color:var(--muted) !important; }
  .leaflet-control-attribution a { color:var(--accent) !important; }

  #toast { position:absolute; left:50%; transform:translateX(-50%); z-index:3000; background:#222; color:#fff; padding:9px 15px; border-radius:18px; font-size:14px; display:none; max-width:90%; text-align:center; }
</style>
</head>
<body class="day">
<div id="map"></div>

<div id="top">
  <div class="r1">
    <div class="seg" id="coordSeg"><button data-c="wgs">WGS-84</button><button data-c="sk">СК-42</button><button data-c="both">оба</button></div>
    <span id="zone"></span>
  </div>
  <div id="coords"></div>
  <div id="gpsLine"><span class="dot" id="gpsDot"></span><span id="gpsText">GPS выключен — нажмите ◎</span></div>
</div>

<svg id="cross" viewBox="0 0 34 34"><path d="M17 3v10M17 21v10M3 17h10M21 17h10" stroke="#c62828" stroke-width="2.4" stroke-linecap="round" paint-order="stroke"/><circle cx="17" cy="17" r="2" fill="#c62828"/></svg>

<div id="fabs">
  <button class="fab" id="fabLayers" aria-label="Слои"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5z"/><path d="m3 13 9 5 9-5"/></svg></button>
  <button class="fab" id="fabTheme" aria-label="Яркость"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button>
  <button class="fab" id="fabMe" aria-label="Где я"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg></button>
</div>

<div id="scale"><span id="scaleText"></span><i id="scaleBar"></i></div>

<div id="mode"><div class="title" id="modeTitle"></div><div class="btns" id="modeBtns"></div></div>
<div id="card"></div>

<div id="bar">
  <button id="btnMap" class="on"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg></span>Карта</button>
  <button id="btnPoint"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M4 12h16"/></svg></span>Знак</button>
  <button id="btnLine"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 18 9 9l5 5 7-9"/><circle cx="3" cy="18" r="1.4"/><circle cx="9" cy="9" r="1.4"/><circle cx="14" cy="14" r="1.4"/><circle cx="21" cy="5" r="1.4"/></svg></span>Линия</button>
  <button id="btnMenu"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></span>Меню</button>
</div>

<div id="sheet"><div class="panel" id="sheetPanel"></div></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".kml,application/vnd.google-earth.kml+xml,text/xml" style="display:none">

<script>
'use strict';

/* ───────────── Условные знаки (ГКИНП 02-049-86, 1:1000–1:500; сверены 28.10.2026) ───────────── */

const R = '<circle cx="12" cy="12" r="9" fill="#fff" stroke="currentColor" stroke-width="1.6"/>';
const Ln = (x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>`;
const DOT = '<circle cx="12" cy="12" r="1.6" fill="currentColor"/>';
const BENCHMARK = '<circle cx="12" cy="12" r="8" fill="currentColor"/><rect x="5.5" y="10.6" width="13" height="2.8" fill="#fff"/>';

const POINT_GROUPS = [
  { id: 'geo', title: 'Геодезия', items: [
    { id: 'ggs', name: 'Пункт ГГС', svg: '<path d="M12 3 L21.5 20 H2.5 Z" fill="#fff" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="14.3" r="1.6" fill="currentColor"/>' },
    { id: 'sgusch', name: 'Пункт сети сгущения', svg: '<rect x="4" y="4" width="16" height="16" fill="#fff" stroke="currentColor" stroke-width="1.6"/>' + DOT },
    { id: 'ss_long', name: 'Точка съёмочной сети, долговр.', svg: '<circle cx="12" cy="12" r="5.5" fill="#fff" stroke="currentColor" stroke-width="1.6"/>' + DOT + Ln(12, 1.5, 12, 5) + Ln(12, 19, 12, 22.5) + Ln(1.5, 12, 5, 12) + Ln(19, 12, 22.5, 12) },
    { id: 'ss_temp', name: 'Точка съёмочной сети, врем.', svg: '<circle cx="12" cy="12" r="6.5" fill="#fff" stroke="currentColor" stroke-width="1.6"/>' + DOT },
    { id: 'rep_grunt', name: 'Репер грунтовый', svg: BENCHMARK },
    { id: 'rep_fund', name: 'Репер фундаментальный', svg: BENCHMARK, prefix: 'ф' }
  ]},
  { id: 'wells', title: 'Колодцы', items: [
    { id: 'w_any', name: 'Колодец без разделения', svg: R + Ln(5.6, 5.6, 18.4, 18.4), suffix: 'Л' },
    { id: 'w_v', name: 'Колодец водопровода', svg: R + Ln(3, 12, 21, 12) },
    { id: 'w_k', name: 'Колодец канализации', svg: R + Ln(3, 12, 21, 12) + Ln(12, 3, 12, 21) },
    { id: 'w_kl', name: 'Колодец ливнёвки', svg: R + Ln(3.4, 10.4, 20.6, 10.4) + Ln(3.4, 13.6, 20.6, 13.6) },
    { id: 'w_d', name: 'Колодец дренажа', svg: R + Ln(3.4, 10.4, 20.6, 10.4) + Ln(3.4, 13.6, 20.6, 13.6) + Ln(12, 3, 12, 21) },
    { id: 'w_g', name: 'Колодец газопровода', svg: R + Ln(5.6, 18.4, 18.4, 5.6) },
    { id: 'w_n', name: 'Колодец нефтепровода', svg: R + Ln(8.5, 4.5, 8.5, 19.5) + Ln(15.5, 4.5, 15.5, 19.5) + Ln(8.5, 12, 15.5, 12) },
    { id: 'w_t', name: 'Колодец теплосети', svg: R + Ln(3.5, 9.5, 20.5, 9.5) + Ln(12, 9.5, 12, 21) },
    { id: 'w_e', name: 'Колодец электрокабелей', svg: R + '<polyline points="6.5,16 12,10.5 17.5,16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>' },
    { id: 'w_s', name: 'Колодец кабелей связи', svg: R + Ln(12, 12, 12, 3) + Ln(12, 12, 4.4, 16.5) + Ln(12, 12, 19.6, 16.5) },
    { id: 'w_air', name: 'Колодец воздухопровода', svg: R + Ln(5.6, 5.6, 18.4, 18.4) + Ln(5.6, 18.4, 18.4, 5.6) },
    { id: 'w_maz', name: 'Колодец мазутопровода', svg: R + '<path d="M5 9.5 A7.6 7.6 0 0 1 19 9.5 Q12 15 12 17 Q12 15 5 9.5 Z" fill="currentColor"/>' },
    { id: 'w_benz', name: 'Колодец бензопровода', svg: R + DOT },
    { id: 'w_zol', name: 'Колодец золопровода', svg: R + Ln(12, 3, 12, 21) },
    { id: 'w_razr', name: 'Колодец разрушенный', svg: R, suffix: 'разр.' },
    { id: 'w_zam', name: 'Колодец под асфальтом', svg: R, suffix: 'зам.' }
  ]},
  { id: 'other', title: 'Прочее', items: [
    { id: 'mark', name: 'Метка (просто точка)', svg: '<circle cx="12" cy="12" r="6" fill="#c62828" stroke="#fff" stroke-width="2"/>' }
  ]}
];

const LINE_GROUPS = [
  { id: 'pipes', title: 'Трубопроводы', items: [
    { id: 'p_v', name: 'Водопровод', kind: 'indexed', index: 'В', w: 0.35 },
    { id: 'p_k', name: 'Канализация бытовая', kind: 'indexed', index: 'К', w: 0.35 },
    { id: 'p_kl', name: 'Канализация ливневая', kind: 'indexed', index: 'Кл', w: 0.35 },
    { id: 'p_d', name: 'Дренаж', kind: 'indexed', index: 'Д', w: 0.35 },
    { id: 'p_g', name: 'Газопровод', kind: 'indexed', index: 'Г', w: 0.35 },
    { id: 'p_t', name: 'Теплосеть', kind: 'indexed', index: 'Т', w: 0.35 },
    { id: 'p_n', name: 'Нефтепровод', kind: 'indexed', index: 'Н', w: 0.35 }
  ]},
  { id: 'cables', title: 'Кабели', items: [
    { id: 'c_hv', name: 'Электрокабель высокого напр.', kind: 'cable', double: true, w: 0.2 },
    { id: 'c_lv', name: 'Электрокабель низкого напр.', kind: 'cable', double: false, w: 0.2 },
    { id: 'c_s', name: 'Кабель связи', kind: 'indexed', index: 'V', w: 0.2 }
  ]},
  { id: 'own', title: 'Своё', items: [
    { id: 'route', name: 'Трасса демонтажа (пикеты)', kind: 'route', w: 0.3, color: '#c62828' },
    { id: 'plain', name: 'Простая линия с подписью', kind: 'plain', w: 0.3 }

const POINTS = Object.fromEntries(POINT_GROUPS.flatMap(g => g.items).map(s => [s.id, s]));
const LINES = Object.fromEntries(LINE_GROUPS.flatMap(g => g.items).map(s => [s.id, s]));
const PICKET_STEP_M = 100;     // пикет — каждые 100 м
const MM = 4;                  // экранных пикселей на 1 «мм» знака
const RECENT_MAX = 8;          // сколько «последних» знаков помнить

/* ───────────── Координаты: WGS-84 → СК-42 (Гаусс-Крюгер) ───────────── */

// Параметры перехода Пулково-1942 → WGS-84 по ГОСТ Р 51794-2008
const TOWGS84 = '+towgs84=23.57,-140.95,-79.8,0,0.35,0.79,-0.22';
const gkDef = zone => `+proj=tmerc +lat_0=0 +lon_0=${zone * 6 - 3} +k=1 +x_0=${zone * 1e6 + 500000} +y_0=0 +ellps=krass ${TOWGS84} +units=m +no_defs`;
function sk42(lat, lng) {
  const zone = Math.floor(lng / 6) + 1;
  const [y, x] = proj4('WGS84', gkDef(zone), [lng, lat]);
  return { zone, x, y };       // x — на север, y — на восток (с номером зоны впереди), как принято в геодезии
}
function fromSk42(x, y, zone) {   // обратный пересчёт СК-42 → WGS-84 (L.LatLng)
  const [lng, lat] = proj4(gkDef(zone), 'WGS84', [y, x]);
  return L.latLng(lat, lng);
}
const f2 = v => v.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const f6 = v => v.toFixed(6);
function coordText(ll) {
  const s = sk42(ll.lat, ll.lng);
  return { wgs: `${f6(ll.lat)}°  ${f6(ll.lng)}°`, sk: `X ${f2(s.x)}  Y ${f2(s.y)}`, s };
}

/* ───────────── Данные и хранение ───────────── */

const STORE_KEY = 'tk.plan.v1';
let data = { points: [], lines: [] };
try { const raw = localStorage.getItem(STORE_KEY); if (raw) data = JSON.parse(raw); } catch (e) { /* хранилище недоступно — работаем без сохранения */ }

  try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
  catch (e) { toast('Не удалось сохранить на телефоне — выгрузите KML через «Меню»'); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
// мелкие настройки (тема, вид координат, «последние») — только для удобства, без них всё работает
function pref(key, def) { try { const v = localStorage.getItem('tk.' + key); return v == null ? def : JSON.parse(v); } catch (e) { return def; } }
function setPref(key, v) { try { localStorage.setItem('tk.' + key, JSON.stringify(v)); } catch (e) { /* не критично */ } }

/* ───────────── Оформление: тема, размеры панелей ───────────── */

const $ = id => document.getElementById(id);

const THEMES = { day: 'Дневная тема', sun: 'Режим «солнце» — максимальный контраст', night: 'Ночная тема' };

}
applyTheme();
$('fabTheme').onclick = () => {
  theme = { day: 'sun', sun: 'night', night: 'day' }[theme] || 'day';
  setPref('theme', theme); applyTheme(); toast(THEMES[theme]);
};
// раскладка: кнопки, масштаб, панели — относительно реальной высоты верхней плашки и нижней панели
function layout() {

  document.documentElement.style.setProperty('--barH', (barH + 6) + 'px');

  $('scale').style.bottom = (barH + 10) + 'px';
  $('mode').style.bottom = (barH + 8) + 'px';
  $('card').style.bottom = (barH + 8) + 'px';
  $('toast').style.top = (topH + 4) + 'px';             // подсказки — под плашкой, чтобы не закрывать карточку и кнопки
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 2600); }

/* ───────────── Карта ───────────── */

const map = L.map('map', { zoomControl: true, attributionControl: true }).setView([55.75, 37.62], 5);
map.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');   // без флажка, только ссылка на библиотеку
const OSM = '© участники OpenStreetMap';
const bases = {
  'Схема (OSM)': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 20, maxNativeZoom: 19, attribution: OSM }),
  'Схема контрастная (HOT)': L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', { maxZoom: 20, maxNativeZoom: 19, subdomains: 'abc', attribution: OSM + ', стиль HOT / OSM France' }),
  'Тропы и грунтовки (CyclOSM)': L.tileLayer('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png', { maxZoom: 20, subdomains: 'abc', attribution: OSM + ', CyclOSM' }),
  'Рельеф (OpenTopoMap)': L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 20, maxNativeZoom: 17, subdomains: 'abc', attribution: OSM + ', SRTM | © OpenTopoMap (CC-BY-SA)' }),
  'Спутник подробный (Esri)': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, maxNativeZoom: 18, attribution: 'Снимки © Esri, Maxar, Earthstar Geographics' }),
  'Спутник обзорный (Sentinel-2)': L.tileLayer('https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2023_3857/default/g/{z}/{y}/{x}.jpg', { maxZoom: 20, maxNativeZoom: 14, attribution: 'Sentinel-2 cloudless — s2maps.eu, EOX IT Services GmbH (модиф. данные Copernicus Sentinel 2023), CC BY-NC-SA 4.0' })
};
let baseName = pref('base', 'Схема (OSM)');
if (!bases[baseName]) baseName = 'Схема (OSM)';
bases[baseName].addTo(map);
function setBase(name) {
  if (!bases[name] || name === baseName) return;
  map.removeLayer(bases[baseName]); bases[name].addTo(map); baseName = name; setPref('base', name);
}
const layersControl = L.control.layers(bases, null, { position: 'topright' }).addTo(map);   // скрыт: оверлеи регистрируются здесь, а выбирать слои — кнопкой справа

/* ───────────── Координаты перекрестья и масштаб ───────────── */

let coordMode = pref('coords', 'sk');
function updateInfo() {
  const c = coordText(map.getCenter());
  $('zone').textContent = 'зона ' + c.s.zone;
  const sk = `<div class="xy">X ${f2(c.s.x)} <small>м</small>&nbsp; Y ${f2(c.s.y)} <small>м</small></div>`;
  const wgs = `<div class="xy">${c.wgs}</div>`;
  $('coords').innerHTML = coordMode === 'wgs' ? wgs : coordMode === 'both' ? wgs + sk : sk;
  for (const b of $('coordSeg').children) b.classList.toggle('on', b.dataset.c === coordMode);
  updateScale();
}
$('coordSeg').onclick = e => {
  const c = e.target.dataset.c;
  if (!c) return;
  coordMode = c; setPref('coords', c); updateInfo(); layout();
};
map.on('move zoomend', updateInfo);

// Масштаб «1:N»: размер экранного пикселя — ~0,16 мм на телефоне и ~0,26 мм на компьютере
const PX_MM = matchMedia('(pointer: coarse)').matches ? 0.159 : 0.2646;
const NICE_M = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000];
function updateScale() {
  const y = map.getSize().y / 2, a = map.containerPointToLatLng([0, y]), b = map.containerPointToLatLng([100, y]);
  const mPerPx = a.distanceTo(b) / 100;
  if (!mPerPx) return;
  const denom = mPerPx * 1000 / PX_MM, p = Math.pow(10, Math.floor(Math.log10(denom)) - 1);
  const round = Math.round(denom / p) * p;
  const meters = NICE_M.find(m => m / mPerPx >= 50) || NICE_M[NICE_M.length - 1];
  $('scaleText').textContent = `1:${round.toLocaleString('ru-RU')} · ${meters >= 1000 ? meters / 1000 + ' км' : meters + ' м'}`;
  $('scaleBar').style.width = Math.round(meters / mPerPx) + 'px';
}

/* ───────────── GPS ───────────── */

let gps = null, gpsMarker = null, gpsCircle = null, gpsWatch = null;
function startGps() {
  if (!navigator.geolocation) { toast('В этом браузере нет GPS'); return; }
  if (gpsWatch != null) return;
  $('gpsText').textContent = 'Ищу спутники…'; $('gpsDot').className = 'dot mid';
  gpsWatch = navigator.geolocation.watchPosition(p => {
    const first = !gps;
    gps = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, at: Date.now() };
    const ll = [gps.lat, gps.lng];
    if (!gpsMarker) {
      gpsCircle = L.circle(ll, { radius: gps.acc, color: '#1e88e5', weight: 1, fillOpacity: .12, interactive: false }).addTo(map);
      gpsMarker = L.circleMarker(ll, { radius: 7, color: '#fff', weight: 2, fillColor: '#1e88e5', fillOpacity: 1, interactive: false }).addTo(map);
    } else { gpsMarker.setLatLng(ll); gpsCircle.setLatLng(ll).setRadius(gps.acc); }
    if (first) map.setView(ll, 18);
    const acc = Math.round(gps.acc);
    $('gpsDot').className = 'dot ' + (acc <= 5 ? 'ok' : acc <= 15 ? 'mid' : 'bad');
    $('gpsText').textContent = `GPS ±${acc} м` + (acc > 15 ? ' — подождите на открытом месте' : '');
    $('fabMe').classList.add('on');
  }, err => {
    gpsWatch = null;
    $('gpsDot').className = 'dot bad';
    $('gpsText').textContent = 'GPS: нет доступа — ' + err.message;
  }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
}
$('fabMe').onclick = () => {
  if (!gps) { startGps(); return; }
  map.setView([gps.lat, gps.lng], Math.max(map.getZoom(), 17));
};

/* ───────────── Точечные знаки ───────────── */

const pointLayer = L.layerGroup().addTo(map);
let selected = null;                          // { kind: 'point'|'line', obj }
function symbolSvg(svg, px) { return `<svg viewBox="0 0 24 24" width="${px}" height="${px}" style="color:var(--sym);display:block">${svg}</svg>`; }
function pointLabel(p) {
  const s = POINTS[p.type] || POINTS.mark;
  return [s.prefix, p.name, s.suffix].filter(Boolean).join(' ');
}
function drawPoints() {
  pointLayer.clearLayers();
  for (const p of data.points) {
    const s = POINTS[p.type] || POINTS.mark, lbl = pointLabel(p), sel = selected && selected.obj === p;
    const icon = L.divIcon({ className: 'sym' + (sel ? ' sel' : ''), iconSize: [22, 22], iconAnchor: [11, 11],
      html: symbolSvg(s.svg, 22) + (lbl ? `<span class="lbl">${esc(lbl)}</span>` : '') });
    L.marker([p.lat, p.lng], { icon }).on('click', e => { L.DomEvent.stop(e); if (!mode) showCard('point', p); }).addTo(pointLayer);
  }
}

/* ───────────── Линии сетей: отрисовка с подписями вдоль линии ───────────── */

const NS = 'http://www.w3.org/2000/svg';
map.createPane('netPane').style.zIndex = 450;
const netSvg = document.createElementNS(NS, 'svg');
netSvg.classList.add('netlines');
map.getPane('netPane').appendChild(netSvg);
const hitLayer = L.layerGroup().addTo(map);

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function at(path, s) {
  const total = path.getTotalLength();
  const p = path.getPointAtLength(s);
  const q = path.getPointAtLength(Math.min(s + 0.5, total)), r = path.getPointAtLength(Math.max(s - 0.5, 0));
  return { x: p.x, y: p.y, a: Math.atan2(q.y - r.y, q.x - r.x) * 180 / Math.PI };
}
const upright = a => (a > 90 || a < -90) ? a + 180 : a;
function segment(g, path, s0, s1, w) {
  const pts = [];
  for (let s = s0; s < s1; s += 3) { const p = path.getPointAtLength(s); pts.push(p.x.toFixed(1) + ',' + p.y.toFixed(1)); }
  const p = path.getPointAtLength(s1); pts.push(p.x.toFixed(1) + ',' + p.y.toFixed(1));
  el('polyline', { points: pts.join(' '), fill: 'none', stroke: 'currentColor', 'stroke-width': w, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
}
function text(g, path, s, str, o) {
  o = Object.assign({ dy: 0, size: 2.8 * MM, italic: true }, o);
  const p = at(path, s), a = upright(p.a);
  el('text', { 'font-size': o.size, 'text-anchor': 'middle', 'dominant-baseline': 'central',
    'font-family': 'Georgia, "Times New Roman", serif', 'font-style': o.italic ? 'italic' : 'normal', fill: 'currentColor',
    transform: `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${a.toFixed(1)}) translate(0 ${o.dy})` }, g).textContent = str;
}
function arrowHead(g, path, s, dir, double, w) {
  const p = at(path, s), a = p.a * Math.PI / 180;
  for (const off of double ? [0, 1.7 * MM] : [0]) {
    const bx = p.x - Math.cos(a) * off * dir, by = p.y - Math.sin(a) * off * dir, len = 1.3 * MM, sp = 0.45;
    el('polyline', { points: `${bx - Math.cos(a - sp) * len * dir},${by - Math.sin(a - sp) * len * dir} ${bx},${by} ${bx - Math.cos(a + sp) * len * dir},${by - Math.sin(a + sp) * len * dir}`,
      fill: 'none', stroke: 'currentColor', 'stroke-width': w, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, g);
  }
}

const DRAW = {
  indexed(g, path, spec, line, w) {
    const total = path.getTotalLength(), period = 9 * MM;
    const index = (line.count > 1 ? line.count : '') + spec.index, gap = (index.length * 1.6 + 1.6) * MM;
    for (let s = 0; s < total;) {
      const e = Math.min(s + period, total);
      segment(g, path, s, e, w);
      if (e + gap < total) text(g, path, e + gap / 2, index);
      s = e + gap;
    }
  },
  cable(g, path, spec, line, w) {
    const total = path.getTotalLength(), arrowLen = 8 * MM, plain = 9 * MM, gap = 2 * MM;
    for (let s = 0, n = 0; s < total; n++) {
      const a1 = Math.min(s + arrowLen, total);
      segment(g, path, s, a1, w);
      if (a1 - s > 3 * MM) { arrowHead(g, path, s, -1, spec.double, w); arrowHead(g, path, a1, 1, spec.double, w); }
      if (n % 2 === 0 && a1 - s > 4 * MM) text(g, path, (s + a1) / 2, 'каб.', { dy: -2.2 * MM, size: 2.4 * MM });
      s = a1 + gap;
      if (s >= total) break;
      const p1 = Math.min(s + plain, total);
      segment(g, path, s, p1, w);
      s = p1 + gap;
    }
  },
  plain(g, path, spec, line, w) { segment(g, path, 0, path.getTotalLength(), w); },
  route(g, path, spec, line, w, pts) {
    const total = path.getTotalLength(), dash = 4 * MM, space = 1.5 * MM;
    for (let s = 0; s < total;) { const e = Math.min(s + dash, total); segment(g, path, s, e, w); s = e + space; }
    // Пикеты через каждые 100 м по местности: переводим метры в пиксели по отрезкам
    const lls = line.latlngs.map(a => L.latLng(a));
    let metersBefore = 0, pxBefore = 0, k = 0;
    for (let i = 1; i < lls.length; i++) {
      const m = lls[i - 1].distanceTo(lls[i]), px = pts[i - 1].distanceTo(pts[i]);
      while ((k * PICKET_STEP_M) <= metersBefore + m + 1e-6) {
        const sPx = pxBefore + (m ? (k * PICKET_STEP_M - metersBefore) / m : 0) * px, p = at(path, Math.min(sPx, total));
        const a = (p.a + 90) * Math.PI / 180, h = 1.6 * MM;

        if (line.pk0 != null && line.pk0 !== '') text(g, path, Math.min(sPx, total), 'ПК ' + (Number(line.pk0) + k * (line.pkDir || 1)), { dy: 3.4 * MM, size: 2.3 * MM, italic: false });
        k++;
      }
      metersBefore += m; pxBefore += px;
    }
  }
};

function drawLines() {
  const size = map.getSize();
  L.DomUtil.setPosition(netSvg, map.containerPointToLayerPoint([0, 0]));
  netSvg.setAttribute('width', size.x); netSvg.setAttribute('height', size.y);
  netSvg.innerHTML = '';
  for (const line of data.lines) {
    const spec = LINES[line.type] || LINES.plain;
    const pts = line.latlngs.map(a => map.latLngToContainerPoint(a));
    if (pts.length < 2) continue;
    const g = el('g', {}, netSvg);
    const isSel = selected && selected.obj === line;
    g.style.color = isSel ? 'var(--accent)' : (spec.color || 'var(--sym)');
    const path = el('path', { d: 'M' + pts.map(p => p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' L'), fill: 'none', stroke: 'none' }, g);
    if (path.getTotalLength() < 6) continue;
    DRAW[spec.kind](g, path, spec, line, spec.w * MM * 1.6 * (isSel ? 1.6 : 1), pts);
    if (line.caption) text(g, path, path.getTotalLength() * 0.3, line.caption, { dy: -2.6 * MM, size: 2.4 * MM });
  }
}
function drawHits() {
  hitLayer.clearLayers();
  for (const line of data.lines)
    L.polyline(line.latlngs, { opacity: 0, weight: 24, interactive: true }).on('click', e => { L.DomEvent.stop(e); if (!mode) showCard('line', line); }).addTo(hitLayer);
}
map.on('moveend zoomend resize viewreset', drawLines);
map.on('zoomstart', () => netSvg.style.opacity = 0);
map.on('zoomend', () => netSvg.style.opacity = 1);
function redrawAll() { drawPoints(); drawLines(); drawHits(); }
function lineLength(line) { let m = 0; for (let i = 1; i < line.latlngs.length; i++) m += L.latLng(line.latlngs[i - 1]).distanceTo(line.latlngs[i]); return m; }

/* ───────────── Карточка объекта (внизу экрана) ───────────── */

function linePreview(spec, w, h) {
  w = w || 46; h = h || 22;
  const c = spec.color || 'var(--sym)', m = h / 2;
  const head = (x, d) => `<path d="M${x + 4 * d} ${m - 4}L${x} ${m}L${x + 4 * d} ${m + 4}" fill="none" stroke="currentColor" stroke-width="1.3"/>`;
  let body;
  if (spec.kind === 'cable') body = `<path d="M4 ${m}H${w - 4}" stroke="currentColor" stroke-width="1.3"/>${head(4, 1)}${head(w - 4, -1)}${spec.double ? head(9, 1) + head(w - 9, -1) : ''}`;
  else if (spec.kind === 'route') body = `<path d="M2 ${m}H${w - 2}" stroke="currentColor" stroke-width="2.2" stroke-dasharray="7 3"/><path d="M${w * 0.3} ${m - 5}V${m + 5}M${w * 0.7} ${m - 5}V${m + 5}" stroke="currentColor" stroke-width="2"/>`;
  else if (spec.kind === 'plain') body = `<path d="M2 ${m}H${w - 2}" stroke="currentColor" stroke-width="1.8"/>`;
  else body = `<path d="M2 ${m}H${w * 0.3}M${w * 0.7} ${m}H${w - 2}" stroke="currentColor" stroke-width="1.8"/><text x="${w / 2}" y="${m + 4.5}" font-size="13" text-anchor="middle" font-style="italic" font-family="Georgia, serif" fill="currentColor">${spec.index}</text>`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="color:${c};display:block">${body}</svg>`;
}
function showCard(kind, obj) {

  if (kind === 'point') {
    const s = POINTS[obj.type] || POINTS.mark, c = coordText(L.latLng(obj.lat, obj.lng));
    icon = symbolSvg(s.svg, 34); name = s.name + (obj.name ? ' — ' + esc(pointLabel(obj)) : '');
    sub = obj.note ? esc(obj.note) : 'зона ' + c.s.zone;
    kv = [['СК-42', `X ${f2(c.s.x)}<br>Y ${f2(c.s.y)}`], ['WGS-84', c.wgs]];
    if (obj.h != null && obj.h !== '') kv.push(['Отметка', esc(obj.h) + ' м']);
    ll = [obj.lat, obj.lng];
  } else {

    icon = linePreview(s, 40, 34); name = s.name + (obj.count > 1 ? ` · ${obj.count} прокладки` : '');
    sub = obj.caption ? esc(obj.caption) : 'без подписи';
    kv = [['Длина', lineLength(obj).toLocaleString('ru-RU', { maximumFractionDigits: 1 }) + ' м'], ['Точек', obj.latlngs.length]];
    if (s.kind === 'route' && obj.pk0 != null) kv.push(['Пикеты', `от ПК ${obj.pk0}, ${obj.pkDir === -1 ? 'по убыванию' : 'по возрастанию'}`]);
  }
  card.innerHTML = `<div class="t">${icon}<div><div class="name">${name}</div><div class="sub">${sub}</div></div><button class="x" data-act="close">×</button></div>
    <div class="kv">${kv.map(([k, v]) => `<span>${k}</span><span>${v}</span>`).join('')}</div>
    <div class="acts"><button class="btn" data-act="edit">Изменить</button><button class="btn" data-act="copy">Копировать</button><button class="btn danger" data-act="del">Удалить</button></div>`;
  card.style.display = 'block';
  card.onclick = e => {
    const act = e.target.closest('[data-act]') && e.target.closest('[data-act]').dataset.act;
    if (act === 'close') hideCard();
    if (act === 'edit') { kind === 'point' ? editPoint(obj) : editLine(obj); }
    if (act === 'copy') copyCoords(kind, obj);
    if (act === 'del' && confirm(kind === 'point' ? 'Удалить этот знак?' : 'Удалить эту линию?')) {
      if (kind === 'point') data.points = data.points.filter(x => x !== obj); else data.lines = data.lines.filter(x => x !== obj);
      save(); hideCard();
    }
  };
  if (kind === 'point' && ll) map.panInside(ll, { paddingBottomRight: [0, card.offsetHeight + 90], paddingTopLeft: [0, $('top').offsetHeight + 20] });
  redrawAll();
}
function hideCard() { $('card').style.display = 'none'; selected = null; redrawAll(); }
map.on('click', () => { if (!mode && selected) hideCard(); });
async function copyCoords(kind, obj) {
  let txt;
  if (kind === 'point') { const s = sk42(obj.lat, obj.lng); txt = `${pointLabel(obj) || (POINTS[obj.type] || POINTS.mark).name}\tX ${s.x.toFixed(2)}\tY ${s.y.toFixed(2)}\t${f6(obj.lat)}\t${f6(obj.lng)}`; }
  else txt = obj.latlngs.map((a, i) => { const s = sk42(a[0], a[1]); return `${i + 1}\tX ${s.x.toFixed(2)}\tY ${s.y.toFixed(2)}`; }).join('\n');
  try { await navigator.clipboard.writeText(txt); toast('Координаты скопированы'); }
  catch (e) { prompt('Скопируйте координаты:', txt.replace(/\t/g, '  ').replace(/\n/g, ' | ')); }
}

/* ───────────── Формы (вместо системных окошек) ───────────── */

// fields: [{ key, label, type: 'text'|'number'|'select', value, options: [[v, t]], hint, half }]
function openForm(title, fields, onSave, saveText) {
  const f = fields.map(x => {
    const id = 'f_' + x.key;
    const input = x.type === 'select'
      ? `<select id="${id}">${x.options.map(([v, t]) => `<option value="${esc(v)}"${String(v) === String(x.value) ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>`
      : `<input id="${id}" type="${x.type === 'number' ? 'text' : 'text'}" inputmode="${x.type === 'number' ? 'decimal' : 'text'}" value="${esc(x.value == null ? '' : x.value)}" placeholder="${esc(x.placeholder || '')}" autocomplete="off">`;
    return { half: x.half, html: `<div><label for="${id}">${esc(x.label)}</label>${input}${x.hint ? `<div class="hint">${esc(x.hint)}</div>` : ''}</div>` };
  });
  let body = '';
  for (let i = 0; i < f.length; i++) {
    if (f[i].half && f[i + 1] && f[i + 1].half) { body += `<div class="row2">${f[i].html}${f[i + 1].html}</div>`; i++; }
    else body += f[i].html;
  }
  showSheet(`<div class="sh-head"><b>${esc(title)}</b><button class="x" data-close>×</button></div><div class="form">${body}
    <div class="acts"><button class="btn" data-close>Отмена</button><button class="btn primary" id="formSave">${esc(saveText || 'Сохранить')}</button></div></div>`);
  $('formSave').onclick = () => {
    const vals = Object.fromEntries(fields.map(x => [x.key, $('f_' + x.key).value.trim()]));
    if (onSave(vals) !== false) closeSheet();
  };
  const first = document.querySelector('#sheetPanel input');
  if (first && !matchMedia('(pointer: coarse)').matches) first.focus();
}
const parseNum = s => Number(String(s).replace(/\s/g, '').replace(',', '.'));

function editPoint(p) {
  const s = POINTS[p.type] || POINTS.mark;
  openForm(s.name, [
    { key: 'name', label: 'Подпись у знака (номер)', value: p.name, placeholder: 'например 12' },
    { key: 'h', label: 'Отметка, м', type: 'number', value: p.h, placeholder: 'например 245.51' },
    { key: 'note', label: 'Примечание', value: p.note, placeholder: 'необязательно' }
  ], v => {
    p.name = v.name; p.note = v.note;
    p.h = v.h === '' ? null : parseNum(v.h);
    if (v.h !== '' && isNaN(p.h)) { toast('Отметка — это число, например 245.51'); return false; }
    save(); showCard('point', p);
  });
}
function editLine(line, isNew) {
  const spec = LINES[line.type] || LINES.plain;
  const fields = [];
  if (spec.kind === 'route') {
    fields.push({ key: 'pk0', label: 'Начальный ПК', type: 'number', value: line.pk0, placeholder: 'например 39', half: true },
      { key: 'pkDir', label: 'Нумерация по ходу', type: 'select', value: line.pkDir || 1, options: [[1, 'растёт: 39, 40…'], [-1, 'убывает: 39, 38…']], half: true },
      { key: 'caption', label: 'Подпись к трассе', value: line.caption, placeholder: 'марка кабеля, например ААБл 3×120', hint: 'Пикеты ставятся сами через каждые 100 м по местности.' });
  } else {
    if (spec.kind === 'indexed') fields.push({ key: 'count', label: 'Прокладок в траншее', type: 'number', value: line.count || 1 });
    fields.push({ key: 'caption', label: 'Подпись вдоль линии', value: line.caption, placeholder: 'например «гл. 1.2» или «ст. 100»' });
  }
  openForm(spec.name, fields, v => {
    if ('pk0' in v) { line.pk0 = v.pk0 === '' ? null : parseNum(v.pk0); if (line.pk0 != null && isNaN(line.pk0)) { toast('ПК — это число'); return false; } line.pkDir = Number(v.pkDir) || 1; }
    if ('count' in v) line.count = Math.max(1, parseInt(v.count, 10) || 1);
    line.caption = v.caption || '';
    if (isNew) data.lines.push(line);
    save(); showCard('line', line);
  }, isNew ? 'Готово' : 'Сохранить');
}

/* ───────────── Режимы: ставим знак / рисуем линию ───────────── */

let mode = null;          // { kind: 'point'|'line', type, latlngs, temp }
function setBarState() {
  $('btnMap').classList.toggle('on', !mode);

  $('btnLine').classList.toggle('on', !!mode && mode.kind === 'line');
}
function setMode(m) {
  if (mode && mode.temp && (!m || m !== mode)) { map.removeLayer(mode.temp); mode.temp = null; }
  mode = m;
  setBarState();
  const box = $('mode');
  if (!mode) { box.style.display = 'none'; return; }
  if (selected) hideCard();
  box.style.display = 'block';
  const isPt = mode.kind === 'point', spec = isPt ? POINTS[mode.type] : LINES[mode.type];
  $('modeTitle').innerHTML = (isPt ? symbolSvg(spec.svg, 26) : linePreview(spec, 36, 26)) +
    `<span>${isPt ? 'Ставим' : 'Рисуем'}: ${esc(spec.name)}${isPt ? '' : ` · точек ${mode.latlngs.length}`}</span>`;
  const btns = isPt
    ? [['center', 'В перекрестье'], ['gps', 'По GPS'], ['done', 'Готово', 'primary']]
    : [['center', 'В перекрестье'], ['gps', 'По GPS'], ['undo', 'Шаг назад'], ['cancel', 'Отмена', 'danger'], ['done', 'Готово', 'primary']];
  $('modeBtns').innerHTML = btns.map(([a, t, c]) => `<button class="btn ${c || ''}" data-act="${a}"${a === 'done' && !isPt ? ' style="grid-column:span 2"' : ''}>${t}</button>`).join('');
}
$('modeBtns').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || !mode) return;
  const act = b.dataset.act;
  if (act === 'center') addAt(map.getCenter());
  if (act === 'gps') { if (gps) addAt(L.latLng(gps.lat, gps.lng)); else { startGps(); toast('Ищу спутники — нажмите ещё раз через пару секунд'); } }
  if (act === 'undo') { mode.latlngs.pop(); refreshTemp(); setMode(mode); }
  if (act === 'cancel') setMode(null);
  if (act === 'done') finishMode();
});
map.on('click', e => { if (mode) addAt(e.latlng); });

function addAt(ll) {
  if (mode.kind === 'point') {
    data.points.push({ id: uid(), type: mode.type, lat: ll.lat, lng: ll.lng, name: '' });
    save(); drawPoints();
    toast('Знак поставлен');
  } else {
    mode.latlngs.push([ll.lat, ll.lng]);
    refreshTemp(); setMode(mode);
  }
}
function refreshTemp() {
  if (mode.temp) map.removeLayer(mode.temp);
  mode.temp = L.layerGroup([
    L.polyline(mode.latlngs, { color: '#1e88e5', weight: 3, dashArray: '6 6', interactive: false }),
    ...mode.latlngs.map(a => L.circleMarker(a, { radius: 6, color: '#1e88e5', fillColor: '#fff', fillOpacity: 1, weight: 2, interactive: false }))
  ]).addTo(map);
}
function finishMode() {
  if (mode.kind === 'line') {
    if (mode.latlngs.length < 2) { toast('Нужно хотя бы две точки'); return; }
    const line = { id: uid(), type: mode.type, latlngs: mode.latlngs.slice(), caption: '', count: 1 };
    setMode(null);
    editLine(line, true);

  }

}
function remember(kind, id) {

// Выбор знака или линии: поиск, вкладки, «последние», крупные плитки
function openPicker(kind) {
  const groups = kind === 'point' ? POINT_GROUPS : LINE_GROUPS, all = kind === 'point' ? POINTS : LINES;
  const recent = pref('recent.' + kind, []).filter(id => all[id]);
  let tab = recent.length ? 'recent' : groups[0].id, query = '';

    } else {
      const g = groups.find(x => x.id === tab);
      html = `<div class="h">${esc(g.title)}</div><div class="tiles">${g.items.map(tile).join('')}</div>`;
    }

  };
  showSheet(`<div class="sh-head"><b>${kind === 'point' ? 'Выберите знак' : 'Выберите линию'}</b><button class="x" data-close>×</button></div>
    <div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="pickSearch" placeholder="${kind === 'point' ? 'Найти: колодец, репер…' : 'Найти: газ, кабель…'}" autocomplete="off"></div>
    <div class="tabs" id="pickTabs"><button data-tab="recent">Последние</button>${groups.map(g => `<button data-tab="${g.id}">${esc(g.title)}</button>`).join('')}</div>
    <div id="pickBody"></div>`);
  $('pickSearch').oninput = e => { query = e.target.value.trim(); render(); };
  $('pickTabs').onclick = e => { const t = e.target.dataset.tab; if (t) { tab = t; query = ''; $('pickSearch').value = ''; render(); } };

    else { setMode({ kind: 'line', type: id, latlngs: [] }); toast('Ставьте точки линии касанием карты'); }
  };

}

};
const today = () => new Date().toISOString().slice(0, 10);
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ───────────── KML и CSV ───────────── */

const xml = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c]));
function toKml() {
  const ext = o => '<ExtendedData>' + Object.entries(o).filter(([, v]) => v != null && v !== '').map(([k, v]) => `<Data name="${k}"><value>${xml(v)}</value></Data>`).join('') + '</ExtendedData>';
  const pts = data.points.map(p => {
    const s = POINTS[p.type] || POINTS.mark;
    return `<Placemark><name>${xml(p.name || s.name)}</name>${ext({ tk_type: p.type, tk_name: p.name, tk_h: p.h, tk_note: p.note })}<Point><coordinates>${p.lng},${p.lat},0</coordinates></Point></Placemark>`;
  });
  const lns = data.lines.map(l => {
    const s = LINES[l.type] || LINES.plain;
    const color = (s.color || '#111111').replace('#', ''), kmlColor = 'ff' + color.slice(4, 6) + color.slice(2, 4) + color.slice(0, 2);
    return `<Placemark><name>${xml(l.caption || s.name)}</name>${ext({ tk_type: l.type, tk_caption: l.caption, tk_count: l.count, tk_pk0: l.pk0, tk_pkdir: l.pkDir })}` +
      `<Style><LineStyle><color>${kmlColor}</color><width>3</width></LineStyle></Style>` +
      `<LineString><tessellate>1</tessellate><coordinates>${l.latlngs.map(a => a[1] + ',' + a[0] + ',0').join(' ')}</coordinates></LineString></Placemark>`;
  });
  return `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Полевой план ${today()}</name>\n${pts.concat(lns).join('\n')}\n</Document></kml>`;
}
function toCsv() {
  const rows = [['Знак', 'Подпись', 'Отметка', 'Примечание', 'Широта WGS-84', 'Долгота WGS-84', 'X СК-42', 'Y СК-42', 'Зона']];
  for (const p of data.points) {
    const s = sk42(p.lat, p.lng);
    rows.push([(POINTS[p.type] || POINTS.mark).name, p.name || '', p.h == null ? '' : p.h, p.note || '', f6(p.lat), f6(p.lng), s.x.toFixed(2), s.y.toFixed(2), s.zone]);
  }
  return '﻿' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\r\n');
}
$('fileIn').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const doc = new DOMParser().parseFromString(await f.text(), 'application/xml');
    if (doc.querySelector('parsererror')) throw new Error('это не KML');
    let np = 0, nl = 0;
    for (const pm of doc.getElementsByTagName('Placemark')) {
      const ext = {};
      for (const d of pm.getElementsByTagName('Data')) ext[d.getAttribute('name')] = (d.getElementsByTagName('value')[0] || {}).textContent;
      const name = (pm.getElementsByTagName('name')[0] || {}).textContent || '';
      const pt = pm.getElementsByTagName('Point')[0], ls = pm.getElementsByTagName('LineString')[0];
      const coords = el => (el.getElementsByTagName('coordinates')[0] || {}).textContent.trim().split(/\s+/).map(c => c.split(',').map(Number)).filter(c => c.length >= 2 && !isNaN(c[0]));
      if (pt) {
        const [lng, lat] = coords(pt)[0];
        const type = POINTS[ext.tk_type] ? ext.tk_type : 'mark';
        data.points.push({ id: uid(), type, lat, lng, name: ext.tk_type ? (ext.tk_name || '') : name,
          h: ext.tk_h != null && ext.tk_h !== '' ? Number(ext.tk_h) : null, note: ext.tk_note || '' }); np++;
      } else if (ls) {
        const type = LINES[ext.tk_type] ? ext.tk_type : 'plain';
        data.lines.push({ id: uid(), type, latlngs: coords(ls).map(c => [c[1], c[0]]), caption: ext.tk_type ? (ext.tk_caption || '') : name,
          count: Number(ext.tk_count) || 1, pk0: ext.tk_pk0 != null && ext.tk_pk0 !== '' ? Number(ext.tk_pk0) : null, pkDir: Number(ext.tk_pkdir) || 1 }); nl++;
      }
    }
    save(); redrawAll(); MENU.fit();
    toast(`Загружено: знаков ${np}, линий ${nl}`);
  } catch (err) { alert('Не удалось загрузить файл: ' + err.message); }
};

/* ───────────── Слой: сетка СК-42 (кресты, как на планшете) ───────────── */

const GRID_STEPS = [10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000];
const GRID_MIN_PX = 120;         // кресты не чаще, чем через 120 пикселей — чтобы поместились подписи
const GRID_ARM = 0.1;            // половина креста — 10 % шага сетки, кресты растут вместе с картой
const GRID_COLOR = '#2e7d32';    // кресты — зелёные
const GRID_LINE_COLOR = '#66bb6a';
const GRID_KEY = 'tk.grid';
const GRID_MAX_CROSSES = 400;    // предохранитель: больше крестов на экране не рисуем
const GridLayer = L.Layer.extend({
  onAdd(m) {
    this._group = L.layerGroup().addTo(m);
    m.on('moveend zoomend resize', this._draw, this);
    this._draw();
    try { localStorage.setItem(GRID_KEY, '1'); } catch (e) { /* не критично */ }
  },
  onRemove(m) {
    m.off('moveend zoomend resize', this._draw, this);
    m.removeLayer(this._group);
    try { localStorage.setItem(GRID_KEY, '0'); } catch (e) { /* не критично */ }
  },
  _draw() {
    const m = this._map, size = m.getSize(), group = this._group;
    group.clearLayers();
    const zone = Math.floor(m.getCenter().lng / 6) + 1;
    const toGk = p => { const ll = m.containerPointToLatLng(p); const [y, x] = proj4('WGS84', gkDef(zone), [ll.lng, ll.lat]); return { x, y }; };
    const corners = [[0, 0], [size.x, 0], [0, size.y], [size.x, size.y]].map(toGk);
    const minX = Math.min(...corners.map(c => c.x)), maxX = Math.max(...corners.map(c => c.x));
    const minY = Math.min(...corners.map(c => c.y)), maxY = Math.max(...corners.map(c => c.y));
    const mPerPx = (maxY - minY) / size.x;
    const step = GRID_STEPS.find(s => s / mPerPx >= GRID_MIN_PX);
    if (!step) return;                                                   // мельче ~1:300 000 сетку не рисуем (и проекция зоны там уже неточна)
    if (((maxX - minX) / step + 2) * ((maxY - minY) / step + 2) > GRID_MAX_CROSSES) return;
    const spacingPx = step / mPerPx, arm = step * GRID_ARM, armPx = arm / mPerPx;
    const fontPx = Math.max(11, Math.min(16, spacingPx * 0.09));        // текст тоже растёт с масштабом, но в разумных пределах
    const fmt = v => Math.round(v).toLocaleString('ru-RU');
    const ll = (x, y) => { const p = fromSk42(x, y, zone); return [p.lat, p.lng]; };
    const x0 = Math.floor(minX / step) * step, y0 = Math.floor(minY / step) * step;
    const x1 = Math.ceil(maxX / step) * step, y1 = Math.ceil(maxY / step) * step;
    const SAMPLES = 8, gridLines = [], segs = [];
    for (let x = x0; x <= x1; x += step) { const l = []; for (let i = 0; i <= SAMPLES; i++) l.push(ll(x, y0 + (y1 - y0) * i / SAMPLES)); gridLines.push(l); }
    for (let y = y0; y <= y1; y += step) { const l = []; for (let i = 0; i <= SAMPLES; i++) l.push(ll(x0 + (x1 - x0) * i / SAMPLES, y)); gridLines.push(l); }
    const gap = (armPx + 4).toFixed(0), fs = fontPx.toFixed(1);
    for (let x = Math.ceil(minX / step) * step; x <= maxX; x += step) {
      for (let y = Math.ceil(minY / step) * step; y <= maxY; y += step) {
        segs.push([ll(x, y - arm), ll(x, y + arm)], [ll(x - arm, y), ll(x + arm, y)]);
        // наклон креста на экране (сближение меридианов) — подписи идут параллельно его чертам
        const a = m.latLngToContainerPoint(ll(x, y - arm)), b = m.latLngToContainerPoint(ll(x, y + arm));
        const deg = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
        // X — горизонтально над правой чертой креста; Y — вертикально над верхней чертой (читается снизу вверх, текст над линией)
        const html = `<div class="glw" style="transform:rotate(${deg.toFixed(2)}deg);font-size:${fs}px">` +
          `<div class="gx" style="left:${gap}px">X – ${fmt(x)}</div>` +
          `<div class="gyw"><div class="gy" style="left:${gap}px">Y – ${fmt(y)}</div></div></div>`;
        L.marker(ll(x, y), { icon: L.divIcon({ className: 'gridlbl', html, iconSize: [0, 0], iconAnchor: [0, 0] }), interactive: false, keyboard: false }).addTo(group);
      }
    }
    // линии и кресты — обычные векторные линии Leaflet: при приближении пальцами они растут вместе с картой
    const night = document.body.classList.contains('night');
    L.polyline(gridLines, { color: night ? '#4caf50' : GRID_LINE_COLOR, weight: 0.8, opacity: 0.55, interactive: false }).addTo(group);
    L.polyline(segs, { color: night ? '#81c784' : GRID_COLOR, weight: 2.2, opacity: 1, interactive: false }).addTo(group);
  }
});
const gridLayer = new GridLayer();
layersControl.addOverlay(gridLayer, 'Сетка СК-42');
let gridWanted = true;           // сетка включена сразу, пока её не выключили
try { gridWanted = localStorage.getItem(GRID_KEY) !== '0'; } catch (e) { /* по умолчанию — включена */ }
if (gridWanted) gridLayer.addTo(map);

/* ───────────── Свои растры: план, ортофото, скан (по углам в СК-42) ───────────── */

map.createPane('rasterPane').style.zIndex = 300;
const RASTER_OPACITY = 0.7;
const RasterLayer = L.Layer.extend({
  initialize(r) { this.r = r; },                      // r: { id, name, blob, tl, tr, bl: [lat, lng], opacity }
  onAdd(m) {
    const img = this._img = document.createElement('img');
    img.style.cssText = 'position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;';
    img.style.opacity = this.r.opacity || RASTER_OPACITY;
    img.onload = () => this._place();
    img.src = this._url = URL.createObjectURL(this.r.blob);
    m.getPane('rasterPane').appendChild(img);
    m.on('zoomend viewreset resize', this._place, this);
    m.on('zoomstart', this._hide, this);
  },
  onRemove(m) {
    m.off('zoomend viewreset resize', this._place, this);
    m.off('zoomstart', this._hide, this);
    this._img.remove(); URL.revokeObjectURL(this._url);
  },
  setOpacity(o) { this.r.opacity = o; if (this._img) this._img.style.opacity = o; },
  _hide() { this._img.style.visibility = 'hidden'; },
  _place() {
    const img = this._img, m = this._map, w = img.naturalWidth, h = img.naturalHeight;
    if (!w || !h) return;
    const p0 = m.latLngToLayerPoint(this.r.tl), p1 = m.latLngToLayerPoint(this.r.tr), p2 = m.latLngToLayerPoint(this.r.bl);
    // аффинное преобразование: угол (0,0) → TL, (w,0) → TR, (0,h) → BL — учитывает поворот сетки СК-42 к меридиану
    img.style.transform = `matrix(${(p1.x - p0.x) / w},${(p1.y - p0.y) / w},${(p2.x - p0.x) / h},${(p2.y - p0.y) / h},${p0.x},${p0.y})`;
    img.style.visibility = 'visible';
  }
});

// Хранение растров в IndexedDB (картинки слишком велики для localStorage)
const rasterDb = new Promise(resolve => {
  try {
    const req = indexedDB.open('tk-rasters', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('rasters', { keyPath: 'id' });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
  } catch (e) { resolve(null); }
});
async function rasterStore(mode, fn) {
  const db = await rasterDb;
  if (!db) return null;
  return new Promise((resolve, reject) => {
    const tx = db.transaction('rasters', mode), req = fn(tx.objectStore('rasters'));
    tx.oncomplete = () => resolve(req && req.result);
    tx.onerror = () => reject(tx.error);
  });
}
const rasterLayers = {};
function showRaster(r) {
  const layer = rasterLayers[r.id] = new RasterLayer(r);
  layer.addTo(map);
  layersControl.addOverlay(layer, 'Растр: ' + esc(r.name));
}
async function loadRasters() {
  try { const all = await rasterStore('readonly', s => s.getAll()); (all || []).forEach(showRaster); }
  catch (e) { toast('Не удалось открыть сохранённые растры'); }
}
// «5892500 6662500» или «5 892 500; 6 662 500» (пробелы внутри числа — только с точкой с запятой между X и Y)
function parseXY(v) {
  const parts = v.includes(';') ? v.split(';') : v.trim().split(/\s+/);
  const nums = parts.filter(s => s.trim() !== '').map(parseNum);
  return nums.length === 2 && !nums.some(isNaN) ? nums : null;
}
const rasterInput = document.createElement('input');
rasterInput.type = 'file'; rasterInput.accept = 'image/png,image/jpeg,image/webp'; rasterInput.style.display = 'none';
document.body.appendChild(rasterInput);
rasterInput.onchange = e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  const c = sk42(map.getCenter().lat, map.getCenter().lng);
  openForm('Привязка растра: ' + f.name, [
    { key: 'tl', label: 'Левый верхний угол — X Y, м', value: `${Math.round(c.x)} ${Math.round(c.y)}`, hint: 'Два числа через пробел, например 5892500 6662500' },
    { key: 'br', label: 'Правый нижний угол — X Y, м', value: `${Math.round(c.x) - 500} ${Math.round(c.y) + 500}` },
    { key: 'zone', label: 'Зона СК-42', type: 'number', value: c.zone, hint: 'Картинка должна быть выровнена по сетке СК-42: север вверху.' }
  ], v => {
    const tl = parseXY(v.tl), br = parseXY(v.br), zone = parseInt(v.zone, 10);
    if (!tl || !br) { toast('Нужно два числа: X и Y'); return false; }
    if (!(tl[0] > br[0] && br[1] > tl[1])) { toast('У левого верхнего угла X больше, а Y меньше, чем у правого нижнего'); return false; }
    if (!(zone > 0 && zone < 61)) { toast('Зона — число от 1 до 60'); return false; }
    const ll = (x, y) => { const p = fromSk42(x, y, zone); return [p.lat, p.lng]; };
    const r = { id: uid(), name: f.name, blob: f, tl: ll(tl[0], tl[1]), tr: ll(tl[0], br[1]), bl: ll(br[0], tl[1]), opacity: RASTER_OPACITY };
    rasterStore('readwrite', s => s.put(r)).catch(() => toast('Растр показан, но не сохранён на телефоне'));
    showRaster(r);
    map.fitBounds([r.tl, r.tr, r.bl], { padding: [30, 30] });
    toast('Растр наложен. Включать и выключать — кнопкой «Слои»');
  }, 'Наложить');
};
function rasterMenu() {
  const ids = Object.keys(rasterLayers);
  if (!ids.length) { toast('Своих растров пока нет'); return; }
  openList('Свои растры', ids.flatMap(id => {
    const r = rasterLayers[id].r;
    return [{ header: r.name }, { id: 'op:' + id, icon: '◐', text: `Прозрачность ${Math.round((1 - (r.opacity || RASTER_OPACITY)) * 100)} % — нажмите, чтобы изменить` },
      { id: 'del:' + id, icon: '🗑', text: 'Удалить растр' }];
  }), async pick => {
    const [act, id] = pick.split(':'), layer = rasterLayers[id];
    if (!layer) return;
    if (act === 'op') {
      const o = { 0.5: 0.7, 0.7: 0.9, 0.9: 1, 1: 0.5 }[layer.r.opacity || RASTER_OPACITY] || RASTER_OPACITY;
      layer.setOpacity(o);
      try { await rasterStore('readwrite', s => s.put(layer.r)); } catch (e) { /* не критично */ }
      toast('Прозрачность ' + Math.round((1 - o) * 100) + ' %');
      rasterMenu();
    }
    if (act === 'del' && confirm('Удалить растр «' + layer.r.name + '»?')) {
      map.removeLayer(layer); layersControl.removeLayer(layer); delete rasterLayers[id];
      try { await rasterStore('readwrite', s => s.delete(id)); } catch (e) { /* уже убран с карты */ }
    }
  });
}

/* ───────────── Старт ───────────── */

ready = true;
layout();
window.addEventListener('resize', layout);
redrawAll();
updateInfo();
loadRasters();
if (data.points.length || data.lines.length) MENU.fit();
</script>
</body>
</html>
